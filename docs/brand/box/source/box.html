<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0}html,body{width:5040px;height:3620px;overflow:hidden;background:#fff}svg{display:block}</style></head>
<body><svg id="s" width="5040" height="3620" viewBox="0 0 1260 905"></svg>
<script>if(new URLSearchParams(location.search).get('print')){document.documentElement.style.cssText='width:1260px;height:905px';document.body.style.cssText='width:1260px;height:905px';const s=document.getElementById('s');s.setAttribute('width','1260');s.setAttribute('height','905');}</script>
<script src="letters.js"></script>
<script>
// Sheet coordinates follow the supplier's dieline (1260 x 905 per sheet, traced from their file). Rendered x4.
const q=new URLSearchParams(location.search), SIDE=q.get('s')||'out', DIE=q.get('die')!=='0', V=q.get('v')||'a';
const BLUE='#3355FF', INK='#0d0e12';
const S=document.getElementById('s'); let h='';
const WM={x0:30,y0:-745,w:2229,h:775,ring:{cx:1953.5,cy:-271.5,r:228.5,stroke:130}};
// adro wordmark: centred at (cx,cy), width w, rotation deg, letter colour
function logo(cx,cy,w,rot=0,col='#fff',ring=BLUE){const k=w/WM.w;
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${k}) translate(${-WM.x0-WM.w/2} ${-WM.y0-WM.h/2})">
  <path fill="${col}" d="${window.LETTERS}"/>
  <circle cx="${WM.ring.cx}" cy="${WM.ring.cy}" r="${WM.ring.r}" fill="none" stroke="${ring}" stroke-width="${WM.ring.stroke}" stroke-linecap="round"
   stroke-dasharray="${2*Math.PI*WM.ring.r*.8} 9999" transform="rotate(-90 ${WM.ring.cx} ${WM.ring.cy})"/></g>`;}
function ringIcon(cx,cy,r,rot=0,col=BLUE,sw){sw=sw||r*.42;const C=2*Math.PI*r;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*.8} 9999" transform="rotate(${rot-90} ${cx} ${cy})"/>`;}
function text(x,y,str,o={}){const a=o.anchor||'middle';return `<text x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="middle" font-family="Sora" font-weight="${o.w||400}" font-size="${o.size||8}" fill="${o.fill||'#fff'}" letter-spacing="${o.ls||0}" opacity="${o.op??1}" ${o.rot!=null?`transform="rotate(${o.rot} ${x} ${y})"`:''}>${str}</text>`;}
const mid=(a,b)=>(a+b)/2;
// geometry from the dieline (centre panel and its four walls)
const LIDS=[{x0:146,x1:524,y0:157,y1:355,wt:70,wb:440,wl:62,wr:609},{x0:734,x1:1112,y0:565,y1:764,wt:480,wb:850,wl:648,wr:1196}];
const BASES=[{x0:750,x1:1116,y0:151,y1:339,wt:70,wb:420,wl:670,wr:1196,marks:'r'},{x0:142,x1:508,y0:581,y1:769,wt:500,wb:850,wl:62,wr:588,marks:'l'}];

if(SIDE==='out'){
  h+=`<rect x="0" y="0" width="1260" height="905" fill="${INK}"/>`;
  for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1),pw=L.x1-L.x0;
    // lid top: wordmark + line, a soft blue glow and a large faint ring
    h+=`<defs><radialGradient id="g${cx}" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="${BLUE}" stop-opacity=".22"/><stop offset="1" stop-color="${BLUE}" stop-opacity="0"/></radialGradient>
      <clipPath id="c${cx}"><rect x="${L.x0}" y="${L.y0}" width="${pw}" height="${L.y1-L.y0}"/></clipPath></defs>
      <g clip-path="url(#c${cx})"><rect x="${L.x0}" y="${L.y0}" width="${pw}" height="${L.y1-L.y0}" fill="url(#g${cx})"/>
      </g>`;
    h+=logo(cx,cy-8,pw*.46);
    h+=text(cx,cy+34,'Always with you.',{size:9,fill:'#c9cdd8',w:300,ls:.3});
    // front wall (below the top): name; back wall (above, upside down): site
    h+=text(cx,mid(L.y1,L.wb),'adro band',{size:9,w:600,ls:2.5,fill:'#e8eaf0'});
    h+=text(cx,mid(L.wt,L.y0),'adroapp.com',{size:7.5,w:400,ls:1.5,fill:'#9aa0ad',rot:180});
    // end walls: the ring
    h+=ringIcon(mid(L.wl,L.x0),cy,12,90)+ringIcon(mid(L.x1,L.wr),cy,12,-90);
  }
  for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-14:14),cy=mid(B.y0,B.y1);
    h+=logo(cx,B.y0+40,92);
    h+=text(cx,B.y0+68,'Smart fitness band',{size:8,w:600,fill:'#e8eaf0',ls:.5});
    h+=text(cx,B.y0+96,'Works with the Adro app.',{size:6.4,fill:'#c9cdd8'});
    h+=text(cx,B.y0+108,'Not a medical device.',{size:4.2,fill:'#6b7080'});
    h+=`<line x1="${cx-70}" x2="${cx+70}" y1="${B.y0+134}" y2="${B.y0+134}" stroke="#2a2d36" stroke-width=".8"/>`;
    h+=text(cx,B.y0+148,'Designed in Saudi, By adro',{size:5.6,fill:'#9aa0ad',ls:.3});
    h+=text(cx,B.y0+160,'adroapp.com',{size:6,fill:BLUE,w:600,ls:.8});
    // supplier compliance marks kept where they were
    h+=B.marks==='r'?`<image href="marks_tr.png" x="1082" y="225" width="33" height="105"/>`:`<image href="marks_bl.png" x="148" y="588" width="32" height="107"/>`;
  }
}else{
  // inside: brand blue everywhere
  h+=`<rect x="0" y="0" width="1260" height="905" fill="${BLUE}"/>`;
  for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1);
    h+=text(cx,cy-16,'Beyond what you see',{size:19,w:700,ls:-.5});
    h+=text(cx,cy+12,'Closer to what you feel',{size:19,w:700,ls:-.5});
    h+=ringIcon(cx,cy+52,7,0,'#fff',2.6);
  }
  for(const B of BASES){const lx=B.x0+26,qx=B.x1-74,qy=B.y0+84,qs=104;
    h+=text(lx,B.y0+36,'Welcome to adro.',{size:16,w:700,ls:-.4,anchor:'start'});
    const st=['Open the Adro app.','Go to Devices and connect your band.','Wear it tonight. We will do the rest.'];
    st.forEach((t,i)=>{const y=B.y0+72+i*24;h+=`<circle cx="${lx+7.5}" cy="${y}" r="7.5" fill="#fff"/>`+text(lx+7.5,y+.5,String(i+1),{size:8,w:700,fill:BLUE})+text(lx+22,y,t,{size:8.5,w:400,anchor:'start'})});
    h+=text(lx,B.y1-18,'Always with you.',{size:8,w:300,fill:'#dfe5ff',anchor:'start'});
    // the QR code: opens adroapp.com/get (the website now, the App Store from launch day)
    h+=`<image href="qr_blue.svg" x="${qx-qs/2}" y="${qy-qs/2}" width="${qs}" height="${qs}"/>`;
    h+=text(qx,qy+qs/2+10,'Scan to download the app',{size:6.6,w:600,ls:.2});
  }
}

if(V==='b'){ h='';
  const lidRegion=L=>`M${L.wl} ${L.wt}H${L.wr}V${L.wb}H${L.wl}Z`;
  if(SIDE==='out'){
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${BLUE}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1),pw=L.x1-L.x0,ph=L.y1-L.y0;
      // one giant open ring drawn on the flat layout, so it wraps over the edges onto the walls when folded
      h+=`<defs><clipPath id="b${cx}"><path d="${lidRegion(L)}"/></clipPath></defs><g clip-path="url(#b${cx})">
        ${ringIcon(L.x1-70,cy+6,128,35,'#fff',40)}</g>`;
      h+=logo(L.x0+62,L.y1-26,88,0,'#fff','#fff');
      h+=text(cx,mid(L.y1,L.wb),'Always with you.',{size:9,w:400,fill:'#fff',ls:.4});
      h+=text(cx,mid(L.wt,L.y0),'adroapp.com',{size:7.5,w:600,ls:1.5,fill:'#dfe5ff',rot:180});
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-14:14);
      h+=logo(cx,B.y0+40,92,0,'#fff','#fff');
      h+=text(cx,B.y0+68,'Smart fitness band',{size:8,w:600,ls:.5});
      h+=text(cx,B.y0+84,'Sleep  ·  Heart rate  ·  Steps  ·  Recovery',{size:6.4,fill:'#dfe5ff'});
      h+=text(cx,B.y0+106,'Works with the Adro app.',{size:6.4});
      h+=text(cx,B.y0+118,'Not a medical device.',{size:5.6,fill:'#c8d2ff'});
      h+=`<line x1="${cx-70}" x2="${cx+70}" y1="${B.y0+134}" y2="${B.y0+134}" stroke="#7d93ff" stroke-width=".8"/>`;
      h+=text(cx,B.y0+148,'Designed by Adro  ·  Made in China',{size:5.6,fill:'#c8d2ff'});
      h+=text(cx,B.y0+160,'adroapp.com',{size:6,w:600,ls:.8});
      h+=B.marks==='r'?`<image href="marks_tr.png" x="1082" y="225" width="33" height="105"/>`:`<image href="marks_bl.png" x="148" y="588" width="32" height="107"/>`;
    }
  }else{
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${INK}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1);
      ['Every rep counts.','Every meal counts.','Every night counts.'].forEach((t,i)=>h+=text(L.x0+28,cy-40+i*24,t,{size:17,w:700,ls:-.5,anchor:'start'}));
      h+=text(L.x0+28,cy+40,'What if it all connected?',{size:10,fill:'#9aa0ad',anchor:'start'});
      h+=ringIcon(L.x1-62,cy,42,0,BLUE,13);
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-10:10);
      h+=text(cx,B.y0+36,'Welcome to adro.',{size:16,w:700,ls:-.4});
      ['Open the Adro app.','Go to Devices and connect your band.','Wear it tonight. We will do the rest.'].forEach((t,i)=>{const y=B.y0+72+i*24;
        h+=`<circle cx="${cx-118}" cy="${y}" r="7.5" fill="${BLUE}"/>`+text(cx-118,y+.5,String(i+1),{size:8,w:700})+text(cx-104,y,t,{size:8.5,anchor:'start'})});
      h+=ringIcon(cx,B.y1-22,7,0,BLUE,2.6);
    }
  }
}

// Design C, "Ripples": the ring sends out waves like a pulse. They're drawn on the flat sheet, so when the box is
// folded they run over the edges onto the sides. "Beyond what you see" sits on the lid in gloss (spot UV), black on
// black, seen only when the light catches it; open the box and "Closer to what you feel" is the first thing you read.
if(V==='c'){ h='';
  const ripples=(cx,cy,r0,n,gap,seed,col,clip)=>{let o=`<g clip-path="url(#${clip})" fill="none" stroke="${col}" stroke-linecap="round">`;
    for(let k=0;k<n;k++){const r=r0+k*gap;let d='';
      for(let i=0;i<=180;i++){const a=i/180*Math.PI*2;
        const w=1+0.045*Math.sin(3*a+seed+k*.35)+0.03*Math.sin(5*a-seed*1.7-k*.22)+0.02*Math.sin(2*a+seed*.6+k*.5);
        const x=cx+Math.cos(a)*r*w,y=cy+Math.sin(a)*r*w;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
      const op=Math.max(.07,.85*Math.pow(.86,k));o+=`<path d="${d}Z" stroke-width="${k<2?1.6:1}" stroke-opacity="${op.toFixed(3)}"/>`;}
    return o+'</g>';};
  const region=L=>`M${L.wl} ${L.wt}H${L.wr}V${L.wb}H${L.wl}Z`;
  if(SIDE==='out'){
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${INK}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1),id='rc'+L.x0;
      const rx=L.x1-108,ry=cy+8;
      h+=`<defs><clipPath id="${id}"><path d="${region(L)}"/></clipPath></defs>`;
      h+=ripples(rx,ry,40,22,13,L.x0*.01,BLUE,id);
      h+=ringIcon(rx,ry,26,0,BLUE,10);
      h+=logo(L.x0+64,L.y1-24,96);
      // spot UV gloss: black on black
      h+=text(L.x0+22,L.y0+30,'Beyond what you see',{size:13,w:700,fill:'#1d2029',anchor:'start',ls:-.2});
      h+=text(cx,mid(L.y1,L.wb),'adro band',{size:9,w:600,ls:2.5,fill:'#e8eaf0'});
      h+=text(cx,mid(L.wt,L.y0),'adroapp.com',{size:7.5,w:400,ls:1.5,fill:'#9aa0ad',rot:180});
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-14:14),id='rb'+B.x0;
      h+=`<defs><clipPath id="${id}"><rect x="${B.x0}" y="${B.y0}" width="${B.x1-B.x0}" height="${B.y1-B.y0}"/></clipPath></defs>`;
      h+=ripples(B.marks==='r'?B.x0:B.x1,B.y1,30,14,13,1.3,BLUE,id).replace(/stroke-opacity="([\d.]+)"/g,(m,v)=>`stroke-opacity="${(v*.45).toFixed(3)}"`);
      h+=logo(cx,B.y0+40,92);
      h+=text(cx,B.y0+68,'Smart fitness band',{size:8,w:600,fill:'#e8eaf0',ls:.5});
      h+=text(cx,B.y0+84,'Sleep  ·  Heart rate  ·  Steps  ·  Recovery',{size:6.4,fill:'#9aa0ad'});
      h+=text(cx,B.y0+106,'Works with the Adro app.',{size:6.4,fill:'#c9cdd8'});
      h+=text(cx,B.y0+118,'Not a medical device.',{size:5.6,fill:'#7d8391'});
      h+=`<line x1="${cx-70}" x2="${cx+70}" y1="${B.y0+134}" y2="${B.y0+134}" stroke="#2a2d36" stroke-width=".8"/>`;
      h+=text(cx,B.y0+148,'Designed in Saudi, By adro',{size:5.6,fill:'#9aa0ad',ls:.3});
      h+=text(cx,B.y0+160,'adroapp.com',{size:6,fill:BLUE,w:600,ls:.8});
      h+=B.marks==='r'?`<image href="marks_tr.png" x="1082" y="225" width="33" height="105"/>`:`<image href="marks_bl.png" x="148" y="588" width="32" height="107"/>`;
    }
  }else{
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${BLUE}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1),id='ri'+L.x0;
      h+=`<defs><clipPath id="${id}"><rect x="${L.x0}" y="${L.y0}" width="${L.x1-L.x0}" height="${L.y1-L.y0}"/></clipPath></defs>`;
      h+=ripples(cx,cy,70,12,14,2.2,'#ffffff',id).replace(/stroke-opacity="([\d.]+)"/g,(m,v)=>`stroke-opacity="${(v*.28).toFixed(3)}"`);
      h+=text(cx,cy-8,'Closer to',{size:22,w:300,ls:-.4});
      h+=text(cx,cy+18,'what you feel.',{size:22,w:700,ls:-.6});
      h+=ringIcon(cx,cy+52,6,0,'#fff',2.4);
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-10:10);
      h+=text(cx,B.y0+36,'Welcome to adro.',{size:16,w:700,ls:-.4});
      ['Open the Adro app.','Go to Devices and connect your band.','Wear it tonight. We will do the rest.'].forEach((t,i)=>{const y=B.y0+72+i*24;
        h+=`<circle cx="${cx-118}" cy="${y}" r="7.5" fill="#fff"/>`+text(cx-118,y+.5,String(i+1),{size:8,w:700,fill:BLUE})+text(cx-104,y,t,{size:8.5,anchor:'start'})});
      h+=text(cx,B.y1-18,'Beyond what you see. Closer to what you feel.',{size:7,w:300,fill:'#dfe5ff'});
    }
  }
}

// Design D, "One day": the lid is one day of your life as a 24-hour ring (the adro ring is a day). Sleep, meals,
// the workout, steps and heart rate all on one circle: everything Adro connects. Midnight at the top.
if(V==='d'){ h='';
  const NAVY='#1f37b8', SOFT='#9aa0ad';
  const pol=(cx,cy,r,hr)=>{const a=(hr/24)*Math.PI*2-Math.PI/2;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  const arc=(cx,cy,r,h0,h1,col,w,op=1)=>{const [x0,y0]=pol(cx,cy,r,h0),[x1,y1]=pol(cx,cy,r,h1);const large=((h1-h0+24)%24)>12?1:0;
    return `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-opacity="${op}"/>`;};
  // A made-up but believable day: heart rate through 24 hours.
  const hrAt=t=>{let v=58;if(t>=23||t<6.5)v=52+3*Math.sin(t*2.1);else v=70+8*Math.sin(t*1.7)+5*Math.sin(t*3.9);
    if(t>=18.5&&t<19.6)v=128+18*Math.sin((t-18.5)*9);if(t>=7.6&&t<8)v=96;return v;};
  const dayRing=(cx,cy,R)=>{let o='';
    // hour ticks and four labels
    for(let i=0;i<24;i++){const [a,b]=pol(cx,cy,R+12,i),[c2,d2]=pol(cx,cy,R+(i%6?15:18),i);o+=`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c2.toFixed(1)}" y2="${d2.toFixed(1)}" stroke="#5a6070" stroke-width="${i%6?.5:.9}"/>`;}
    [[0,'00'],[6,'06'],[12,'12'],[18,'18']].forEach(([hh,l])=>{const [x,y]=pol(cx,cy,R+26,hh);o+=text(x,y,l,{size:5.5,fill:SOFT,w:600});});
    // heart rate as a line around the outside
    let d='';for(let i=0;i<=480;i++){const t=i/20;const r=R+2+(hrAt(t)-50)*0.11;const [x,y]=pol(cx,cy,r,t);d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);}
    o+=`<path d="${d}" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width=".7"/>`;
    // the day track, sleep and the workout
    o+=`<circle cx="${cx}" cy="${cy}" r="${R-8}" fill="none" stroke="#1c1f28" stroke-width="7"/>`;
    o+=arc(cx,cy,R-8,23,6.5,NAVY,7);
    o+=arc(cx,cy,R-8,18.5,19.6,BLUE,7);
    // meals
    [[7.7,3],[13.2,3.4],[16.5,2.2],[20.3,3.2]].forEach(([t,rr])=>{const [x,y]=pol(cx,cy,R-8,t);o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="#fff"/>`;});
    // steps: little bars inside, taller when you moved more
    for(let i=0;i<48;i++){const t=i/2;const st=(t>=7&&t<9?.7:t>=12&&t<14?.6:t>=17&&t<20?1:t>=9&&t<23?.25:0.04);const [a,b]=pol(cx,cy,R-17,t),[c2,d2]=pol(cx,cy,R-17-2-st*6,t);
      o+=`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c2.toFixed(1)}" y2="${d2.toFixed(1)}" stroke="${BLUE}" stroke-opacity="${(.35+st*.55).toFixed(2)}" stroke-width="1.1" stroke-linecap="round"/>`;}
    // now: the ring's gap, like the logo
    return o;};
  const legend=(x,y)=>{const items=[['Sleep',NAVY,'bar'],['Food','#fff','dot'],['Training',BLUE,'bar'],['Steps',BLUE,'tick'],['Heart','#fff','line']];let o='';
    items.forEach(([l,col,k],i)=>{const yy=y+i*11;o+=k==='dot'?`<circle cx="${x+4}" cy="${yy}" r="2.2" fill="${col}"/>`:k==='line'?`<path d="M${x} ${yy} l2 -2 l2 4 l2 -3 l2 1" fill="none" stroke="${col}" stroke-opacity=".7" stroke-width=".7"/>`:k==='tick'?`<line x1="${x+4}" y1="${yy-3}" x2="${x+4}" y2="${yy+3}" stroke="${col}" stroke-width="1.2" stroke-linecap="round"/>`:`<line x1="${x}" y1="${yy}" x2="${x+8}" y2="${yy}" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`;
      o+=text(x+14,yy,t(l),{size:6,fill:SOFT,anchor:'start'});});return o;};
  const t=x=>x;
  if(SIDE==='out'){
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${INK}"/>`;
    for(const L of LIDS){const cy=mid(L.y0,L.y1);
      const rx=L.x1-100;
      // the band itself sits in the middle of the day ring, lifted off the black by a soft blue light
      h+=`<defs><radialGradient id="bg${L.x0}"><stop offset="0" stop-color="${BLUE}" stop-opacity=".45"/><stop offset=".6" stop-color="${BLUE}" stop-opacity=".12"/><stop offset="1" stop-color="${BLUE}" stop-opacity="0"/></radialGradient></defs>`;
      h+=`<circle cx="${rx}" cy="${cy}" r="58" fill="url(#bg${L.x0})"/>`;
      h+=dayRing(rx,cy,66);
      h+=`<image href="band_black.png" x="${rx-46}" y="${cy-46}" width="92" height="92"/>`;
      h+=logo(L.x0+70,L.y0+44,104);
      h+=text(L.x0+22,L.y0+82,'One day.',{size:10.5,w:700,anchor:'start'});
      h+=text(L.x0+22,L.y0+96,'Everything connected.',{size:10.5,w:300,fill:'#c9cdd8',anchor:'start'});
      h+=legend(L.x0+24,L.y0+128);
      h+=text(mid(L.x0,L.x1),mid(L.y1,L.wb),'adro band',{size:9,w:600,ls:2.5,fill:'#e8eaf0'});
      h+=text(mid(L.x0,L.x1),mid(L.wt,L.y0),'adroapp.com',{size:7.5,w:400,ls:1.5,fill:SOFT,rot:180});
      h+=text(mid(L.wl,L.x0),cy,'00:00',{size:7,w:600,fill:SOFT,rot:90,ls:1});
      h+=text(mid(L.x1,L.wr),cy,'24:00',{size:7,w:600,fill:SOFT,rot:-90,ls:1});
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-14:14);
      h+=logo(cx,B.y0+40,92);
      h+=text(cx,B.y0+68,'Smart fitness band',{size:8,w:600,fill:'#e8eaf0',ls:.5});
      h+=text(cx,B.y0+84,'Sleep  ·  Heart rate  ·  Steps  ·  Recovery',{size:6.4,fill:SOFT});

    }
  }else{
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${BLUE}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1);
      // the same day ring, very faint, behind the words
      h+=`<g opacity=".18">${dayRing(cx,cy,74).replace(/#1c1f28/g,'#ffffff').replace(new RegExp(BLUE,'g'),'#ffffff').replace(new RegExp(NAVY,'g'),'#ffffff')}</g>`;
      h+=text(cx,cy-10,'Beyond what you see.',{size:15,w:300,ls:-.3});
      h+=text(cx,cy+12,'Closer to what you feel.',{size:15,w:700,ls:-.4});
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-10:10);
      h+=text(cx,B.y0+36,'Welcome to adro.',{size:16,w:700,ls:-.4});
      ['Open the Adro app.','Go to Devices and connect your band.','Wear it tonight. Tomorrow you see your whole day.'].forEach((tx,i)=>{const y=B.y0+72+i*24;
        h+=`<circle cx="${cx-118}" cy="${y}" r="7.5" fill="#fff"/>`+text(cx-118,y+.5,String(i+1),{size:8,w:700,fill:BLUE})+text(cx-104,y,tx,{size:8.5,anchor:'start'})});
      h+=ringIcon(cx,B.y1-20,6,0,'#fff',2.4);
    }
  }
}

// Design E, "The band": a product box. The band itself on the lid under a soft blue light, the wordmark beside it,
// nothing else competing with it. Inside, the two lines.
if(V==='e'){ h='';
  const SOFT='#9aa0ad';
  if(SIDE==='out'){
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${INK}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1),pw=L.x1-L.x0,ph=L.y1-L.y0,id='e'+L.x0;
      const bx=L.x0+pw*0.66;
      h+=`<defs>
        <radialGradient id="sp${id}" cx="50%" cy="58%" r="55%"><stop offset="0" stop-color="${BLUE}" stop-opacity=".55"/><stop offset=".45" stop-color="${BLUE}" stop-opacity=".16"/><stop offset="1" stop-color="${BLUE}" stop-opacity="0"/></radialGradient>
        <radialGradient id="fl${id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <clipPath id="c${id}"><rect x="${L.x0}" y="${L.y0}" width="${pw}" height="${ph}"/></clipPath></defs>
        <g clip-path="url(#c${id})">
          <ellipse cx="${bx}" cy="${cy+6}" rx="${pw*0.42}" ry="${ph*0.62}" fill="url(#sp${id})"/>
          <ellipse cx="${bx}" cy="${L.y1-22}" rx="58" ry="7" fill="url(#fl${id})"/>
        </g>`;
      h+=`<image href="band_black.png" x="${bx-88}" y="${cy-92}" width="176" height="176"/>`;
      h+=logo(L.x0+74,cy-10,112);
      h+=text(L.x0+22,cy+22,'B A N D',{size:7.5,w:600,fill:'#c9cdd8',anchor:'start',ls:3});
      h+=text(L.x0+22,L.y1-20,'Beyond what you see.',{size:7.5,w:300,fill:SOFT,anchor:'start'});
      h+=text(cx,mid(L.y1,L.wb),'adro band',{size:9,w:600,ls:2.5,fill:'#e8eaf0'});
      h+=text(cx,mid(L.wt,L.y0),'Sleep  ·  Heart rate  ·  Steps  ·  Recovery',{size:7,w:400,ls:1,fill:SOFT,rot:180});
      h+=ringIcon(mid(L.wl,L.x0),cy,11,90)+ringIcon(mid(L.x1,L.wr),cy,11,-90);
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-14:14);
      h+=logo(cx,B.y0+40,92);
      h+=text(cx,B.y0+68,'Smart fitness band',{size:8,w:600,fill:'#e8eaf0',ls:.5});
      h+=text(cx,B.y0+84,'Sleep  ·  Heart rate  ·  Steps  ·  Recovery',{size:6.4,fill:SOFT});
      h+=text(cx,B.y0+106,'Works with the Adro app.',{size:6.4,fill:'#c9cdd8'});
      h+=text(cx,B.y0+118,'Not a medical device.',{size:5.6,fill:'#7d8391'});
      h+=`<line x1="${cx-70}" x2="${cx+70}" y1="${B.y0+134}" y2="${B.y0+134}" stroke="#2a2d36" stroke-width=".8"/>`;
      h+=text(cx,B.y0+148,'Designed in Saudi, By adro',{size:5.6,fill:SOFT,ls:.3});
      h+=text(cx,B.y0+160,'adroapp.com',{size:6,fill:BLUE,w:600,ls:.8});
      h+=B.marks==='r'?`<image href="marks_tr.png" x="1082" y="225" width="33" height="105"/>`:`<image href="marks_bl.png" x="148" y="588" width="32" height="107"/>`;
    }
  }else{
    h+=`<rect x="0" y="0" width="1260" height="905" fill="${BLUE}"/>`;
    for(const L of LIDS){const cx=mid(L.x0,L.x1),cy=mid(L.y0,L.y1);
      h+=text(cx,cy-12,'Beyond what you see.',{size:17,w:300,ls:-.3});
      h+=text(cx,cy+12,'Closer to what you feel.',{size:17,w:700,ls:-.4});
      h+=ringIcon(cx,cy+48,6,0,'#fff',2.4);
    }
    for(const B of BASES){const cx=mid(B.x0,B.x1)+(B.marks==='r'?-10:10);
      h+=text(cx,B.y0+36,'Welcome to adro.',{size:16,w:700,ls:-.4});
      ['Open the Adro app.','Go to Devices and connect your band.','Wear it tonight. We will do the rest.'].forEach((tx,i)=>{const y=B.y0+72+i*24;
        h+=`<circle cx="${cx-118}" cy="${y}" r="7.5" fill="#fff"/>`+text(cx-118,y+.5,String(i+1),{size:8,w:700,fill:BLUE})+text(cx-104,y,tx,{size:8.5,anchor:'start'})});
      h+=text(cx,B.y1-18,'Always with you.',{size:8,w:300,fill:'#dfe5ff'});
    }
  }
}
if(DIE) h+=`<image href="die_${SIDE}.png" x="0" y="0" width="1260" height="905"/>`;
// Box size on the dieline pages: 17 x 9 x 3.8 cm (outside of the lid). Dimension lines on the first lid, and a size note.
if(DIE&&q.get('dims')!=='0'){const L=LIDS[0],R='#e0115f',dl=(x1,y1,x2,y2,lab,vert)=>{const mx=(x1+x2)/2,my=(y1+y2)/2,a=6;
    let o=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${R}" stroke-width="1"/>`;
    o+=vert?`<path d="M${x1-a/2} ${y1+a}L${x1} ${y1}L${x1+a/2} ${y1+a}M${x2-a/2} ${y2-a}L${x2} ${y2}L${x2+a/2} ${y2-a}" fill="none" stroke="${R}" stroke-width="1"/>`
           :`<path d="M${x1+a} ${y1-a/2}L${x1} ${y1}L${x1+a} ${y1+a/2}M${x2-a} ${y2-a/2}L${x2} ${y2}L${x2-a} ${y2+a/2}" fill="none" stroke="${R}" stroke-width="1"/>`;
    o+=`<rect x="${mx-(vert?14:26)}" y="${my-7}" width="${vert?28:52}" height="14" rx="3" fill="#fff"/>`+text(mx,my+.5,lab,{size:8,w:700,fill:R});return o;};
  h+=dl(L.x0,L.y0+22,L.x1,L.y0+22,'170 mm',false);
  h+=dl(L.x0+30,L.y0,L.x0+30,L.y1,'90 mm',true);
  h+=dl(L.x1+40,L.wt,L.x1+40,L.y0,'38 mm',true);
  h+=`<rect x="420" y="868" width="420" height="28" rx="6" fill="#fff" stroke="${R}" stroke-width="1"/>`+text(630,882.5,'BOX SIZE (outside): 17 × 9 × 3.8 cm  ·  L 170 × W 90 × H 38 mm',{size:9,w:700,fill:R});
}
S.innerHTML=h;
