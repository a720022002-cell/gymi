<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0}html,body{background:transparent}svg{display:block}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="letters.js"></script>
<script>
// Adro "Pulse" hoodie artwork. ?p=back | chest | front1 | front2 | front3 | sleeveL | sleeveR | hood | label. 1 unit = 1 mm on the garment.
const q=new URLSearchParams(location.search),P=q.get('p')||'back',INK=q.get('ink')||'#ECECE6',BLUE='#3355FF',GREY='#a9a9a2';
const S=document.getElementById('s');
const WM={x0:30,y0:-745,w:2229,h:775,ring:{cx:1953.5,cy:-271.5,r:228.5,stroke:130}};
const logo=(cx,cy,w,col,ring=BLUE)=>{const k=w/WM.w;return `<g transform="translate(${cx} ${cy}) scale(${k}) translate(${-WM.x0-WM.w/2} ${-WM.y0-WM.h/2})"><path fill="${col}" d="${window.LETTERS}"/><circle cx="${WM.ring.cx}" cy="${WM.ring.cy}" r="${WM.ring.r}" fill="none" stroke="${ring}" stroke-width="${WM.ring.stroke}" stroke-linecap="round" stroke-dasharray="${2*Math.PI*WM.ring.r*.8} 9999" transform="rotate(-90 ${WM.ring.cx} ${WM.ring.cy})"/></g>`;};
const tx=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="Sora" font-weight="${o.w||600}" font-size="${o.size||6}" letter-spacing="${o.ls||0}" fill="${o.fill||INK}" ${o.rot!=null?`transform="rotate(${o.rot} ${x} ${y})"`:''}>${s}</text>`;
// One heartbeat as points (mm along the line, mm off the ring; + = outward). Sharp QRS, soft P and T.
const ECG=[[0,0],[6,0],[8,1.6],[10,2.4],[12,1.6],[14,0],[19,0],[21,-4.5],[25.5,25],[30,-9],[32.5,0],[38,0],[41,3],[44,5],[47,3],[50,0],[58,0]];
const ecgAt=s=>{for(let i=1;i<ECG.length;i++){const[a0,b0]=ECG[i-1],[a1,b1]=ECG[i];if(s<=a1)return b0+(b1-b0)*(s-a0)/(a1-a0);}return 0;};
let W,H,h='';
if(P==='back'){
  // The open adro ring, calm and smooth, until its end turns into a blue heartbeat and stops on a dot: you, right now.
  W=330;H=390;const cx=165,cy=158,R=122,arc=.8,SW=4.6,len=2*Math.PI*R*arc,beatLen=58,beats=2,bStart=len-beatLen*beats-14;
  const pt=s=>{const a=-Math.PI/2+(s/len)*arc*Math.PI*2,k=s-bStart,off=k>0&&k<beatLen*beats?ecgAt(k%beatLen):0,r=R+off;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let d1='',d2='';
  for(let s=0;s<=len+1e-6;s+=.25){const [x,y]=pt(Math.min(s,len)),p=`${x.toFixed(2)} ${y.toFixed(2)}`;
    if(s<=bStart)d1+=(d1?'L':'M')+p;if(s>=bStart)d2+=(d2?'L':'M')+p;}
  h+=`<path d="${d1}" fill="none" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"/>`;
  h+=`<path d="${d2}" fill="none" stroke="${BLUE}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const [ex,ey]=pt(len);h+=`<circle cx="${ex}" cy="${ey}" r="8" fill="${BLUE}"/><circle cx="${ex}" cy="${ey}" r="14" fill="none" stroke="${BLUE}" stroke-width="1.2" opacity=".55"/>`;
  // inside the ring
  h+=tx(cx,cy-4,'ALWAYS',{size:25,w:800,ls:3});
  h+=tx(cx,cy+24,'WITH YOU.',{size:25,w:800,ls:3});
  h+=tx(cx,cy+44,'EVERY BEAT  ·  EVERY REP  ·  EVERY NIGHT',{size:5.6,w:500,ls:1.6,fill:GREY});
  // under the ring
  h+=tx(cx,342,'BEYOND WHAT YOU SEE',{size:9,w:600,ls:5});
  h+=tx(cx,358,'CLOSER TO WHAT YOU FEEL',{size:9,w:600,ls:5,fill:BLUE});
  h+=tx(cx,380,'ADRO  ·  RIYADH  ·  EST. 2026',{size:5,w:400,ls:3,fill:GREY});
}else if(P==='chest'){
  W=100;H=40;h+=logo(50,20,90,INK);
}else if(P==='back2'){
  // Every rep. Every meal. Every night. It all connects. (The teaser's lines.) Dim EVERY, bright word, blue answer.
  W=300;H=250;const L=(y,word)=>`<text x="12" y="${y}" font-family="Sora" font-weight="800" font-size="36" letter-spacing="1" fill="#77776f">EVERY</text>`+`<text x="146" y="${y}" font-family="Sora" font-weight="800" font-size="36" letter-spacing="1" fill="${INK}">${word}.</text>`;
  h+=tx(12,14,'FIRST COLLECTION',{size:5.6,w:600,ls:2.4,a:'start',fill:GREY})+tx(288,14,'DROP 001',{size:5.6,w:600,ls:2.4,a:'end',fill:GREY});
  h+=`<line x1="12" y1="22" x2="288" y2="22" stroke="${INK}" stroke-width=".6" opacity=".5"/>`;
  h+=L(66,'REP')+L(110,'MEAL')+L(154,'NIGHT');
  h+=`<line x1="12" y1="174" x2="288" y2="174" stroke="${INK}" stroke-width=".6" opacity=".5"/>`;
  h+=tx(12,204,'IT ALL CONNECTS.',{size:21,w:800,ls:1.5,a:'start',fill:BLUE});
  h+=`<circle cx="276" cy="196.5" r="7.5" fill="none" stroke="${BLUE}" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="${2*Math.PI*7.5*.8} 99" transform="rotate(-90 276 196.5)"/>`;
  h+=`<line x1="12" y1="220" x2="288" y2="220" stroke="${INK}" stroke-width=".6" opacity=".5"/>`;
  h+=tx(12,234,'DESIGNED IN SAUDI, BY ADRO',{size:5.6,w:600,ls:2.2,a:'start'})+tx(288,234,'24.71° N 46.67° E',{size:5.6,w:400,ls:2.2,a:'end',fill:GREY});
  h+=tx(12,244,'ALWAYS WITH YOU.',{size:5.6,w:600,ls:2.2,a:'start',fill:BLUE})+tx(288,244,'EST. 2026',{size:5.6,w:400,ls:2.2,a:'end',fill:GREY});
}else if(P==='backA'){
  // Tonal ring: the open adro ring big across the back in a shade just lighter than the fabric; only its end is blue.
  W=300;H=300;const c=150,r=128,sw=26,C=2*Math.PI*r;
  const e=(-90+.8*360)*Math.PI/180;
  h+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#4b4b46" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*.8} 9999" transform="rotate(-90 ${c} ${c})"/>`;
  h+=`<circle cx="${(c+Math.cos(e)*r).toFixed(2)}" cy="${(c+Math.sin(e)*r).toFixed(2)}" r="${sw/2}" fill="${BLUE}"/>`;
  h+=tx(c,c+3,'ALWAYS WITH YOU.',{size:8,w:600,ls:5,fill:'#6a6a64'});
}else if(P==='backB'){
  // Neck mark: small logo just under the hood, a quiet line under it.
  W=90;H=36;h+=logo(45,13,70,INK)+tx(45,33,'ALWAYS WITH YOU.',{size:4.4,w:600,ls:2.6,fill:GREY});
}else if(P==='backC'){
  // Wordmark: adro across the upper back, one small line under it.
  W=220;H=96;h+=logo(110,38,210,INK)+tx(110,90,'EST. 2026   ·   RIYADH',{size:6,w:500,ls:4,fill:GREY});
}else if(P==='front1'){
  // Badge: logo, the line under it, and a thin rule with where and when.
  W=150;H=72;h+=logo(75,18,110,INK);
  h+=tx(75,47,'ALWAYS WITH YOU.',{size:7.2,w:600,ls:4.2});
  h+=`<line x1="8" y1="58" x2="142" y2="58" stroke="${INK}" stroke-width=".5" opacity=".55"/>`;
  h+=tx(8,67,'EST. 2026',{size:4.6,w:500,ls:2,a:'start',fill:GREY})+tx(75,67,'●',{size:4,fill:BLUE})+tx(142,67,'RIYADH',{size:4.6,w:500,ls:2,a:'end',fill:GREY});
}else if(P==='front2'){
  // Split: logo on the left chest, a small text block on the right chest.
  W=300;H=40;h+=logo(42,16,78,INK);
  const x=196;h+=`<line x1="${x-5}" y1="1" x2="${x-5}" y2="38" stroke="${BLUE}" stroke-width="1.4"/>`;
  h+=tx(x,8,'DESIGNED IN SAUDI',{size:6.6,w:700,ls:1.4,a:'start'})+tx(x,18,'BY ADRO — EST. 2026',{size:6.6,w:500,ls:1.4,a:'start'})+tx(x,28,'24.71° N 46.67° E',{size:6.6,w:400,ls:1.4,a:'start',fill:GREY})+tx(x,38,'ALWAYS WITH YOU.',{size:6.6,w:600,ls:1.4,a:'start',fill:BLUE});
}else if(P==='front3'){
  // Big: the logo across the chest, a quiet line above it and a small one under it.
  W=260;H=120;h+=tx(130,12,'ALWAYS WITH YOU.',{size:6.4,w:600,ls:6,fill:GREY});
  h+=logo(130,58,236,INK);
  h+=tx(10,112,'Nº 001',{size:5,w:600,ls:2,a:'start',fill:GREY})+tx(130,112,'DESIGNED IN SAUDI, BY ADRO',{size:5,w:500,ls:2.4,fill:GREY})+tx(250,112,'2026',{size:5,w:600,ls:2,a:'end',fill:BLUE});
}else if(P==='sleeveL'){
  W=30;H=330;h+=tx(15,165,'BEYOND WHAT YOU SEE',{size:11,w:700,ls:7,rot:90});
}else if(P==='sleeveR'){
  W=30;H=330;h+=tx(15,165,'CLOSER TO WHAT YOU FEEL',{size:11,w:700,ls:5.5,rot:-90,fill:BLUE});
}else if(P==='seal'){
  // A round seal: the blue adro ring in the middle, the brand's lines running round it on a circle.
  W=150;H=150;const c=75,rt=60,ri=24,sw=ri*130/228.5;
  h+=`<defs><path id="circ" d="M ${c} ${c-rt} A ${rt} ${rt} 0 1 1 ${c-.01} ${c-rt}"/></defs>`;
  h+=`<text font-family="Sora" font-weight="600" font-size="8.2" letter-spacing="3.1" fill="${INK}"><textPath href="#circ" textLength="${(2*Math.PI*rt-6).toFixed(1)}" lengthAdjust="spacing">ALWAYS WITH YOU · BEYOND WHAT YOU SEE · CLOSER TO WHAT YOU FEEL ·</textPath></text>`;
  h+=`<circle cx="${c}" cy="${c}" r="${rt-12}" fill="none" stroke="${INK}" stroke-width=".5" opacity=".45"/>`;
  h+=`<circle cx="${c}" cy="${c}" r="${ri}" fill="none" stroke="${BLUE}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*ri*.8).toFixed(2)} 9999" transform="rotate(-90 ${c} ${c})"/>`;
}else if(P==='frame3'){
  // The owner's layout, as drawn: four logos on black boxes around a square (ring leading each side round),
  // and four more inside, overlapping. Units are the owner's sketch pixels; the print is scaled to 300 mm wide.
  const BOX=q.get('box')==='0'?null:'#0a0a0c',ox=177,oy=632;W=568;H=540;
  const boxed=(cx,cy,w,rot)=>{const k=w/WM.w,hh=WM.h*k,bw=w*1.11,bh=hh*1.3;
    return `<g transform="translate(${cx-ox} ${cy-oy}) rotate(${rot})">`+(BOX?`<rect x="${-bw/2}" y="${-bh/2}" width="${bw}" height="${bh}" fill="${BOX}"/>`:'')+
      `<g transform="scale(${k}) translate(${-WM.x0-WM.w/2} ${-WM.y0-WM.h/2})"><path fill="${INK}" d="${window.LETTERS}"/><circle cx="${WM.ring.cx}" cy="${WM.ring.cy}" r="${WM.ring.r}" fill="none" stroke="${BLUE}" stroke-width="${WM.ring.stroke}" stroke-linecap="round" stroke-dasharray="${2*Math.PI*WM.ring.r*.8} 9999" transform="rotate(-90 ${WM.ring.cx} ${WM.ring.cy})"/></g></g>`;};
  h+=boxed(451,692,270,0)+boxed(672,900,270,90)+boxed(450,1110,270,180)+boxed(248,900,270,270);
  h+=boxed(362,797,105,0)+boxed(488,914,205,0)+boxed(356,871,98,20)+boxed(484,868,68,-38);
}else if(P==='frame2'){
  // A square with a ring on each 90° corner and "adr" running along each side to it; inside, many logos scattered at random.
  const k=.1,D=2300*k,T=Math.ceil(D+2*293.5*k+4),c=T/2; W=T;H=T;
  const RCX=WM.ring.cx,RCY=WM.ring.cy;
  const logoAt=(x,y,rot,kk,ink,ringCol)=>`<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(1)}) scale(${kk.toFixed(4)})"><path fill="${ink}" d="${window.LETTERS}"/><circle cx="${RCX}" cy="${RCY}" r="${WM.ring.r}" fill="none" stroke="${ringCol}" stroke-width="${WM.ring.stroke}" stroke-linecap="round" stroke-dasharray="${2*Math.PI*WM.ring.r*.8} 9999" transform="rotate(-90 ${RCX} ${RCY})"/></g>`;
  // the frame: logo moved so its ring centre is at (0,0), ring on the top-right corner, then turned for each side
  const side=`<g transform="translate(${c+D/2} ${c-D/2}) scale(${k}) translate(${-RCX} ${-RCY})"><path fill="${INK}" d="${window.LETTERS}"/><circle cx="${RCX}" cy="${RCY}" r="${WM.ring.r}" fill="none" stroke="${BLUE}" stroke-width="${WM.ring.stroke}" stroke-linecap="round" stroke-dasharray="${2*Math.PI*WM.ring.r*.8} 9999" transform="rotate(-90 ${RCX} ${RCY})"/></g>`;
  for(const r of [0,90,180,270]) h+=`<g transform="rotate(${r} ${c} ${c})">${side}</g>`;
  // scattered logos: seeded, random size and angle, no two touching, all inside the inner square
  let seed=Number(q.get('seed')||5);const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const half=D/2-34,boxes=[];
  const corners=(x,y,a,w,hh)=>{const ca=Math.cos(a),sa=Math.sin(a);return [[-w/2,-hh/2],[w/2,-hh/2],[w/2,hh/2],[-w/2,hh/2]].map(([u,v])=>[x+u*ca-v*sa,y+u*sa+v*ca]);};
  const sep=(A,B)=>{for(const P of [A,B])for(let i=0;i<4;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%4],nx=y1-y2,ny=x2-x1;
      const pa=A.map(p=>p[0]*nx+p[1]*ny),pb=B.map(p=>p[0]*nx+p[1]*ny);if(Math.max(...pa)<Math.min(...pb)||Math.max(...pb)<Math.min(...pa))return true;}return false;};
  for(let tries=0;tries<6000&&boxes.length<75;tries++){
    const w=20+Math.pow(rnd(),1.8)*58,hh=w*WM.h/WM.w,a=(rnd()*2-1)*Math.PI,x=c+(rnd()*2-1)*half,y=c+(rnd()*2-1)*half;
    const P=corners(x,y,a,w*1.06,hh*1.12);
    if(P.some(([px,py])=>Math.abs(px-c)>half||Math.abs(py-c)>half))continue;
    if(boxes.some(b=>!sep(b,P)))continue;
    boxes.push(P);const kk=w/WM.w,dim=rnd()<.35;
    // place by centre: the logo's own centre is at (x0+w/2, y0+h/2)
    const cxL=WM.x0+WM.w/2,cyL=WM.y0+WM.h/2,ca=Math.cos(a),sa=Math.sin(a);
    const ox=x-(cxL*ca-cyL*sa)*kk,oy=y-(cxL*sa+cyL*ca)*kk;
    h+=logoAt(ox,oy,a*180/Math.PI,kk,dim?'#8d8d86':INK,dim?'#2a3f9e':BLUE);
  }
}else if(P==='frame'){
  // Four adro logos in a pinwheel: each ring sits on a corner and each "adr" runs along a side to the next ring.
  // Logo length L and height hL; the open square inside is L - hL wide and is filled with text (added after layout).
  const L=222,k=L/WM.w,hL=WM.h*k,T=L+hL,c=T/2; W=T;H=T;
  const one=`<g transform="scale(${k}) translate(${-WM.x0} ${-WM.y0})"><path fill="${INK}" d="${window.LETTERS}"/><circle cx="${WM.ring.cx}" cy="${WM.ring.cy}" r="${WM.ring.r}" fill="none" stroke="${BLUE}" stroke-width="${WM.ring.stroke}" stroke-linecap="round" stroke-dasharray="${2*Math.PI*WM.ring.r*.8} 9999" transform="rotate(-90 ${WM.ring.cx} ${WM.ring.cy})"/></g>`;
  for(const r of [0,90,180,270]) h+=`<g transform="rotate(${r} ${c} ${c})">${one}</g>`;
  window.FRAME={x:hL,y:hL,s:L-hL};
}else if(P==='ring'){
  // Front: only the ring of the adro logo, same proportions as in the logo (stroke 130 on radius 228.5).
  W=60;H=60;const c=30,r=21,sw=r*130/228.5;
  h+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${BLUE}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*r*.8).toFixed(2)} 9999" transform="rotate(-90 ${c} ${c})"/>`;
}else if(P==='hood'){
  // small open ring on the back of the hood, a single beat inside it
  W=60;H=60;const c=30,r=22;
  h+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${BLUE}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${2*Math.PI*r*.8} 9999" transform="rotate(-90 ${c} ${c})"/>`;
}else if(P==='label'){
  W=70;H=46;h+=logo(35,12,40,INK)+tx(35,27,'Designed in Saudi, By adro',{size:4,w:400})+tx(35,35,'THE PULSE HOODIE',{size:3.4,w:600,ls:1.4,fill:GREY})+tx(35,42,'Always with you.',{size:3.4,w:300,fill:GREY});
}
S.setAttribute('width',P==='frame3'?W*4.2:W*8);S.setAttribute('height',P==='frame3'?H*4.2:H*8);S.setAttribute('viewBox',`0 0 ${W} ${H}`);S.innerHTML=h;
if(P==='frame') document.fonts.ready.then(()=>{
  const F=window.FRAME,pad=6,x0=F.x+pad,w=F.s-pad*2,size=4.1,lead=5.7,ls=.7;
  const lines=Math.floor((F.s-pad*2+lead-size)/lead);
  const words=[['ALWAYS','b'],['WITH','b'],['YOU.','b'],'BEYOND','WHAT','YOU','SEE.','CLOSER','TO','WHAT','YOU','FEEL.','EVERY','REP','COUNTS.','EVERY','MEAL','COUNTS.','EVERY','NIGHT','COUNTS.','WHAT','IF','IT','ALL','CONNECTED?',['ADRO.','b'],'YOUR','FOOD.','YOUR','TRAINING.','YOUR','SLEEP.','ONE','COACH.','DAY','AND','NIGHT.','DESIGNED','IN','SAUDI,','BY','ADRO.','RIYADH','24.71°N','46.67°E.','EST.','2026.','FIRST','COLLECTION.','KEEP','GOING.','SHOW','UP.','REST','WELL.','EAT','WELL.','MOVE','MORE.','FEEL','BETTER.','LISTEN','TO','YOUR','BODY.','IT','ALL','CONNECTS.'];
  const T=words.map(x=>Array.isArray(x)?{t:x[0],b:1}:{t:x,b:0});
  const meas=document.createElementNS('http://www.w3.org/2000/svg','text');meas.setAttribute('font-family','Sora');meas.setAttribute('font-weight','600');meas.setAttribute('font-size',size);meas.setAttribute('letter-spacing',ls);S.appendChild(meas);
  const wd=t=>{meas.textContent=t;return meas.getComputedTextLength();};
  const space=size*.75;let i=0,out='';
  for(let ln=0;ln<lines;ln++){const row=[];let len=0;
    while(true){const t=T[i%T.length],l=wd(t.t);if(row.length&&len+space+l>w)break;row.push(t);len+=(row.length>1?space:0)+l;i++;}
    const y=F.y+pad+size+ln*lead,gap=row.length>1?(w-row.reduce((a,t)=>a+wd(t.t),0))/(row.length-1):0;let x=x0;
    for(const t of row){out+=`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-family="Sora" font-weight="600" font-size="${size}" letter-spacing="${ls}" fill="${t.b?BLUE:INK}" fill-opacity="${t.b?1:.82}">${t.t}</text>`;x+=wd(t.t)+gap;}}
  meas.remove();S.insertAdjacentHTML('beforeend',out);document.body.dataset.done=1;
});else document.body.dataset.done=1;
</script></body></html>
