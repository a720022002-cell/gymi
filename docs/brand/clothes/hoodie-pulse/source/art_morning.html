<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{background:transparent}svg{display:block}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="2400" height="1760" viewBox="0 0 300 220"></svg>
<script>
// MORNING PEOPLE: ADRO arched, a sun rising behind two date palms, the name, a quiet line, where and when. 1 unit = 1 mm.
const INK='#ECECE6',S=document.getElementById('s');let h='';
h+=`<defs><path id="arc" d="M 70 52 Q 150 12 230 52"/></defs>`;
h+=`<text font-family="Cinzel" font-weight="700" font-size="17" letter-spacing="8" fill="${INK}" text-anchor="middle"><textPath href="#arc" startOffset="50%">ADRO</textPath></text>`;
// the sun: a half disc on the horizon and fine rays
const cx=150,hy=118,R=24;
h+=`<path d="M ${cx-R} ${hy} A ${R} ${R} 0 0 1 ${cx+R} ${hy} Z" fill="${INK}"/>`;
for(let i=0;i<=22;i++){const a=Math.PI+i/22*Math.PI,r0=R+5,r1=R+(i%2?15:22);
  h+=`<line x1="${(cx+Math.cos(a)*r0).toFixed(2)}" y1="${(hy+Math.sin(a)*r0).toFixed(2)}" x2="${(cx+Math.cos(a)*r1).toFixed(2)}" y2="${(hy+Math.sin(a)*r1).toFixed(2)}" stroke="${INK}" stroke-width=".9" stroke-linecap="round"/>`;}
// horizon
h+=`<line x1="58" y1="${hy}" x2="242" y2="${hy}" stroke="${INK}" stroke-width="1.2"/>`;
// a date palm: a gently leaning trunk with ring marks and arched fronds
const palm=(x,lean,ht,flip)=>{const tx=x+lean,ty=hy-ht;let g=`<path d="M ${x-1.8} ${hy} Q ${x+lean*.4-1.4} ${hy-ht*.5} ${tx-.9} ${ty} L ${tx+.9} ${ty} Q ${x+lean*.4+1.4} ${hy-ht*.5} ${x+1.8} ${hy} Z" fill="${INK}"/>`;
  for(let k=1;k<9;k++){const t=k/9,px=x+lean*t*t*.9+lean*.1*t,py=hy-ht*t;g+=`<line x1="${(px-1.7).toFixed(2)}" y1="${py.toFixed(2)}" x2="${(px+1.7).toFixed(2)}" y2="${(py-1).toFixed(2)}" stroke="#141414" stroke-width=".45"/>`;}
  const fr=[[-150,16],[-128,19],[-100,17],[-75,18],[-48,19],[-25,16],[-170,13],[-5,13]];
  for(const [deg,len] of fr){const a=(flip?-1:1)*0+deg*Math.PI/180,ex=tx+Math.cos(a)*len,ey=ty+Math.sin(a)*len+len*.55,mx=tx+Math.cos(a)*len*.55,my=ty+Math.sin(a)*len*.55-2.5;
    g+=`<path d="M ${tx} ${ty} Q ${mx.toFixed(2)} ${my.toFixed(2)} ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>`;
    for(let k=1;k<6;k++){const t=k/6,qx=(1-t)*(1-t)*tx+2*(1-t)*t*mx+t*t*ex,qy=(1-t)*(1-t)*ty+2*(1-t)*t*my+t*t*ey,dl=3.2*(1-t*.5);
      g+=`<line x1="${qx.toFixed(2)}" y1="${qy.toFixed(2)}" x2="${(qx+Math.cos(a+1.9)*dl).toFixed(2)}" y2="${(qy+Math.sin(a+1.9)*dl).toFixed(2)}" stroke="${INK}" stroke-width=".7" stroke-linecap="round"/><line x1="${qx.toFixed(2)}" y1="${qy.toFixed(2)}" x2="${(qx+Math.cos(a-1.9+Math.PI)*dl*.0+Math.cos(a+1.2)*dl).toFixed(2)}" y2="${(qy+Math.sin(a+1.2)*dl).toFixed(2)}" stroke="${INK}" stroke-width=".7" stroke-linecap="round"/>`;}}
  return g;};
h+=palm(96,-6,52)+palm(206,5,44);
// name and lines
h+=`<text x="150" y="152" text-anchor="middle" font-family="Playfair Display" font-weight="900" font-size="25" letter-spacing=".8" fill="${INK}">MORNING PEOPLE</text>`;
h+=`<text x="150" y="166" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="400" font-size="7.4" fill="${INK}">for those who start before the city wakes.</text>`;
h+=`<text x="150" y="182" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="5.4" letter-spacing="3.2" fill="${INK}">EST. 2026  ·  RIYADH  ·  05:40</text>`;
S.innerHTML=h;
</script></body></html>
