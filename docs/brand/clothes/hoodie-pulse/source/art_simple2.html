<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{background:transparent}svg{display:block}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 180 140"></svg>
<script>
// Simple back: one date palm in front of a thin sun circle, on a fine horizon; ADRO and "Riyadh, 2026" under it. 1 unit = 1 mm.
const INK='#ECECE6',S=document.getElementById('s');let h='';
const cx=90,hy=70;
h+=`<circle cx="${cx+9}" cy="${hy-22}" r="22" fill="none" stroke="${INK}" stroke-width=".7"/>`;
h+=`<line x1="${cx-42}" y1="${hy}" x2="${cx+42}" y2="${hy}" stroke="${INK}" stroke-width=".7"/>`;
// the palm: a gently leaning trunk and arched fronds
const px=cx-4,ht=50,lean=-5,tx=px+lean,ty=hy-ht;
h+=`<path d="M ${px-1.7} ${hy} Q ${px+lean*.4-1.3} ${hy-ht*.5} ${tx-.8} ${ty} L ${tx+.8} ${ty} Q ${px+lean*.4+1.3} ${hy-ht*.5} ${px+1.7} ${hy} Z" fill="${INK}"/>`;
for(const [deg,len] of [[-165,17],[-140,20],[-112,18],[-82,17],[-55,20],[-28,19],[-5,15],[-185,13]]){
  const a=deg*Math.PI/180,ex=tx+Math.cos(a)*len,ey=ty+Math.sin(a)*len+len*.62,mx=tx+Math.cos(a)*len*.55,my=ty+Math.sin(a)*len*.55-2.6;
  h+=`<path d="M ${tx} ${ty} Q ${mx.toFixed(2)} ${my.toFixed(2)} ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>`;
  for(let k=1;k<6;k++){const t=k/6,qx=(1-t)*(1-t)*tx+2*(1-t)*t*mx+t*t*ex,qy=(1-t)*(1-t)*ty+2*(1-t)*t*my+t*t*ey,dl=3.4*(1-t*.5);
    h+=`<line x1="${qx.toFixed(2)}" y1="${qy.toFixed(2)}" x2="${(qx+Math.cos(a+1.25)*dl).toFixed(2)}" y2="${(qy+Math.sin(a+1.25)*dl+dl*.5).toFixed(2)}" stroke="${INK}" stroke-width=".6" stroke-linecap="round"/>`;}}
h+=`<text x="${cx}" y="${hy+26}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="16" letter-spacing="9" fill="${INK}">ADRO</text>`;
h+=`<text x="${cx}" y="${hy+38}" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-size="6.2" fill="${INK}">Riyadh, 2026</text>`;
S.innerHTML=h;
</script></body></html>
