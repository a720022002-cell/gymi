<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>*{margin:0}html,body{background:transparent}svg{display:block}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="2400" height="1520" viewBox="0 0 300 190">
<!-- Back print: arched name, the year with a Najdi star, a small title and a short note. 1 unit = 1 mm. -->
<defs><path id="arc" d="M 2 104 Q 150 26 298 104"/></defs>
<text font-family="Playfair Display" font-weight="900" font-size="34" letter-spacing=".2" fill="#ECECE6" text-anchor="middle"><textPath href="#arc" startOffset="50%">ADRO SOCIETY</textPath></text>
<g font-family="Playfair Display" font-style="italic" font-weight="400" font-size="21" fill="#ECECE6">
  <text x="137" y="128" text-anchor="end">20</text><text x="163" y="128" text-anchor="start">26</text>
</g>
<g transform="translate(150 121) scale(1.25)" fill="#ECECE6"><path id="st" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6Z"/><use href="#st" transform="rotate(45) scale(.72)"/></g>
<text x="150" y="146" text-anchor="middle" font-family="Playfair Display" font-weight="800" font-size="5.6" letter-spacing="1.4" fill="#ECECE6">NOTES TO SELF</text>
<g font-family="Playfair Display" font-weight="500" font-size="6.3" fill="#ECECE6" text-anchor="middle">
  <text x="150" y="160">You don’t need a <tspan font-style="italic" font-weight="700">perfect</tspan> week, you need a <tspan font-style="italic" font-weight="700">repeated</tspan> one. Show up when it is easy,</text>
  <text x="150" y="169">show up when it is <tspan font-style="italic" font-weight="700">hard</tspan>, and let the small days add up. Nobody sees</text>
  <text x="150" y="178">the early mornings, but your body <tspan font-style="italic" font-weight="700">remembers every one</tspan>.</text>
</g>
</svg></body></html>
