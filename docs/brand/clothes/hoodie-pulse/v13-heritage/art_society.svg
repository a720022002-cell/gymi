<svg id="s" xmlns="http://www.w3.org/2000/svg" width="2400" height="1840" viewBox="0 0 300 230">
<!-- Back print: arched name, the year with a Najdi star, a small title and a short note. 1 unit = 1 mm. -->
<defs><path id="arc" d="M 4 100 Q 150 36 296 100"></path></defs>
<text font-family="Playfair Display" font-weight="800" font-size="31" letter-spacing="1.2" fill="#ECECE6" text-anchor="middle"><textPath href="#arc" startOffset="50%">ADRO SOCIETY</textPath></text>
<g font-family="Playfair Display" font-style="italic" font-weight="400" font-size="17" fill="#ECECE6">
  <text x="138" y="122" text-anchor="end">20</text><text x="162" y="122" text-anchor="start">26</text>
</g>
<g transform="translate(150 116)" fill="#ECECE6"><path id="st" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6Z"></path><use href="#st" transform="rotate(45) scale(.72)"></use></g>
<text x="150" y="142" text-anchor="middle" font-family="Playfair Display" font-weight="700" font-size="5" letter-spacing="1.4" fill="#ECECE6">NOTES TO SELF</text>
<g font-family="Playfair Display" font-weight="500" font-size="5.6" fill="#ECECE6" text-anchor="middle">
  <text x="150" y="156">You don’t need a <tspan font-style="italic" font-weight="700">perfect</tspan> week, you need a <tspan font-style="italic" font-weight="700">repeated</tspan> one. Show up when it is easy,</text>
  <text x="150" y="164">show up when it is <tspan font-style="italic" font-weight="700">hard</tspan>, and let the small days add up. Nobody sees</text>
  <text x="150" y="172">the early mornings, but your body <tspan font-style="italic" font-weight="700">remembers every one</tspan>.</text>
</g>
</svg>