  <button class="btn glass gb mt16" onclick="setFT(1)">Next: meal times and training ${ic('chev',16)}</button>`:`
  ${secHead('Meal times')}
  <div class="list">${f.meals.map((m,i)=>`<div class="li"><span class="ico">${ic('clock',18)}</span><label class="grow row" style="gap:6px;min-width:0;cursor:text"><input value="${esc(m.n)}" aria-label="Meal name" maxlength="24" style="flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:transparent;font:inherit;font-weight:700;color:inherit;outline:none;padding:6px 0" onfocus="this.style.borderBottomColor='var(--cobalt)'" onblur="this.style.borderBottomColor=''" onkeydown="if(event.key==='Enter')this.blur()" onchange="renameMeal(${i},this.value)"><span class="sec">${ic('edit',14)}</span></label><label style="position:relative;display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:12px;background:var(--inset);cursor:pointer"><b class="num sora">${fmtTime(m.t)}</b><input type="time" aria-label="${m.n} time" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer" value="${m.t}" onchange="S.food.meals[${i}].t=this.value;S.food.meals.sort((a,b)=>a.t.localeCompare(b.t));refresh()"></label>${f.meals.length>2?`<button class="nb" style="width:36px;height:36px" aria-label="Remove ${m.n}" onclick="removeMeal(${i})"><span class="sec">${ic('trash',16)}</span></button>`:''}</div>`).join('')}</div>
  <div class="row between" style="padding:0 4px"><span class="sec xs">${f.meals.length<=2?'You need at least 2 meals.':'Tap a name or time to change it.'}</span><button class="link small" onclick="mealCount(1)">${ic('plus',14,2.4)} Add a meal</button></div>
  ${false?`<div class="card row"><span class="grow"><b>Number of meals</b><div class="sec small">Minimum 2</div></span><div class="stepper"><button onclick="mealCount(-1)" aria-label="Fewer meals" ${f.meals.length<=2?'disabled style="opacity:.35"':''}>${ic('minus',20,2.2)}</button><b class="sora num" style="width:24px;text-align:center;font-size:20px">${f.meals.length}</b><button onclick="mealCount(1)" aria-label="More meals">${ic('plus',20,2.2)}</button></div></div>`:''}
  ${secHead('Training')}
  <div class="card"><div class="row between"><span class="grow"><b>Your workout time</b><div class="sec xs">When you usually train</div></span>
   <label style="position:relative;display:inline-flex;align-items:center;height:44px;padding:0 14px;border-radius:12px;background:var(--inset);cursor:pointer;gap:6px">${f.myWorkoutTime?`<b class="sora num">${fmtTime(f.myWorkoutTime)}</b>`:`<span class="cob b small">${ic('plus',14,2.4)} Add time</span>`}<input type="time" aria-label="Your workout time" value="${f.myWorkoutTime||f.workoutTime}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="setWorkoutTime(this.value)"></label></div>
   ${f.myWorkoutTime?`<button class="link xs mt8" onclick="S.food.myWorkoutTime=null;refresh()">Clear</button>`:''}
   <div class="inset row mt12" style="gap:10px">${mark(22,'var(--cobalt)',4.5)}<div class="grow small"><b>Suggested: ${fmtTime(f.workoutTime)}</b><div class="sec xs">${f.intensity} intensity, after work with time to eat first</div></div>${f.myWorkoutTime===f.workoutTime?`<span class="okchip">${ic('check',12,2.6)}Using</span>`:`<button class="btn sm soft" style="background:var(--card)" onclick="setWorkoutTime(S.food.workoutTime)">Use</button>`}</div></div>
  ${adv?'':`<div class="row small sec mt8" style="gap:8px">${ic('info',18)}<span>Calories and protein are set for you. Switch to Advanced to change them.</span></div>`}
`}
  <div class="mt24"><button class="btn" onclick="saveFoodPlan()">Save my plan</button></div>`}});
function pkWarn(v){if(v>2.5)return `<div class="inset row mt12" style="align-items:flex-start;gap:8px"><span class="sec">${ic('info',18)}</span><span class="small">Above 2.5 g per kg gives little extra muscle for most people. It\u2019s safe for healthy people, just drink enough water. If you have kidney problems, ask your doctor first.</span></div>`;if(v<1.6)return `<div class="inset row mt12" style="align-items:flex-start;gap:8px"><span class="down">${ic('warn',18)}</span><span class="small">Under 1.6 g per kg makes it harder to keep muscle while you train.</span></div>`;return ''}
const pkPos=v=>`calc(14px + (100% - 28px) * ${(v-1.2)/(3.5-1.2)})`;
const pkIn=v=>v>=1.6-1e-9&&v<=2.2+1e-9;
const pkZone=v=>pkIn(v)?'In the common range':v<1.6?'Below the common range':'Above the common range';
let PKSNAP=null;
function pkSlide(el){let v=+el.value,snap=null;for(const t of [1.6,2.2])if(Math.abs(v-t)<.07){v=t;snap=t}if(snap!==null){el.value=snap;if(PKSNAP!==snap){PKSNAP=snap;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}tone(snap===1.6?880:1046,0,.06,'sine',.08)}}else PKSNAP=null;pkLive(v)}
function pkLive(v){v=Math.round(clamp(v,1.2,3.5)*10)/10;S.food.perKg=v;$('#pkG').textContent=Math.round(S.food.weight*v);$('#pkV').textContent=v.toFixed(1);$('#pkS').textContent=v.toFixed(1);$('#pkWarn').innerHTML=pkWarn(v);const w=$('#pkVw');if(w)w.style.color=pkIn(v)?'var(--up)':'var(--text)';const z=$('#pkZone');if(z){z.textContent=pkZone(v);z.className=pkIn(v)?'up':''}}
function setFT(i){P().ft=i;refresh();const sc=topEl().querySelector('.scroll');sc&&(sc.scrollTop=0)}
function setPk(d){pkLive(S.food.perKg+d);refresh()}

/* ---------- edit macros in grams or percent; calories follow ---------- */
function openMacros(){const t=targets();sheet('macros',{mode:'g',p:t.p,c:t.c,f:t.f,K:t.k})}
const mK=p=>p.p*4+p.c*4+p.f*9;
const mPct=(p,k)=>({p:Math.round(p.p*400/k),c:Math.round(p.c*400/k),f:Math.round(p.f*900/k)});
SH.macros=p=>{if(p.mode==='%'&&!p.pc)pcInit(p);const k=mK(p),pc=p.mode==='%'?p.pc:mPct(p,k),tot=pc.p+pc.c+pc.f;const row=(key,label,mult)=>`<div class="li noic" style="gap:8px"><span class="grow"><b style="display:block">${label}</b><span class="sec xs" id="mx_${key}">${p.mode==='g'?`${pc[key]}% of calories`:`${p[key]} g`}</span></span>
   <div class="stepper" style="gap:6px"><button style="width:38px;height:38px" aria-label="Less ${label}" onclick="mStep('${key}',-1)">${ic('minus',16,2.2)}</button>
   <input class="field sora num center" type="text" inputmode="numeric" value="${p.mode==='g'?p[key]:pc[key]}" style="width:72px;height:44px;padding:0 4px;font-size:16px" oninput="mType('${key}',this)"><span class="sec small b" style="width:14px">${p.mode==='g'?'g':'%'}</span>
   <button style="width:38px;height:38px" aria-label="More ${label}" onclick="mStep('${key}',1)">${ic('plus',16,2.2)}</button></div></div>`;
  return `<div class="h2">Edit macros</div><p class="sec small mt4">${p.mode==='g'?'Change the grams. Your daily calories update to match.':'Change the split. Your calories stay the same and the grams update.'}</p>
  <div class="seg solid mt12">${[['g','Grams'],['%','Percent']].map(([m,l])=>`<button class="${p.mode===m?'on':''}" onclick="SHEET.p.mode='${m}';SHEET.p.K=mK(SHEET.p);SHEET.p.pc=null;renderSheet()">${l}</button>`).join('')}</div>
  <div class="list mt12">${row('p','Protein',4)}${row('c','Carbs',4)}${row('f','Fat',9)}</div>
  <div class="card row between"><span class="b">${p.mode==='g'?'Daily calories':'Total'}</span><span class="sora num" style="font-size:22px" id="mxK">${p.mode==='g'?fmt(k)+' kcal':tot+'%'}</span></div>
  <div id="mxW">${macroWarn(p)}</div>
  <div class="mt12"><button class="btn" id="mxGo" ${p.mode==='%'&&tot!==100?'disabled':''} onclick="saveMacros()">${p.mode==='%'&&tot!==100?`Total must be 100% (now ${tot}%)`:'Save'}</button></div><button class="btn soft mt8" style="background:transparent" onclick="closeSheet()">Cancel</button>`};
function macroWarn(p){const w=S.food.weight,out=[];if(p.f<w*.5)out.push('Fat under 0.5 g per kg is very low. Some fat is needed for hormones and vitamins.');if(p.c<50)out.push('Under 50 g of carbs is a low-carb diet. Training may feel harder.');if(p.p<w*1.2)out.push('Protein under 1.2 g per kg makes it hard to keep muscle.');if(mK(p)<1200)out.push('These calories are very low. Talk to a doctor before eating this little.');
  return out.map(t=>`<div class="inset row mt8" style="align-items:flex-start;gap:8px"><span class="down">${ic('warn',16)}</span><span class="small">${t}</span></div>`).join('')}
function pcInit(p){const K=mK(p)||1;p.K=K;const raw={p:p.p*4/K*100,c:p.c*4/K*100,f:p.f*9/K*100},pc={};let sum=0;['p','c','f'].forEach(x=>{pc[x]=Math.floor(raw[x]);sum+=pc[x]});['p','c','f'].sort((a,b)=>(raw[b]-Math.floor(raw[b]))-(raw[a]-Math.floor(raw[a]))).slice(0,Math.max(0,100-sum)).forEach(x=>pc[x]++);p.pc=pc}
function mSet(key,v){const p=SHEET.p;v=Math.max(0,Math.round(v));if(p.mode==='g')p[key]=v;else{if(!p.pc)pcInit(p);v=Math.min(100,v);p.pc[key]=v;const m=key==='f'?9:4;p[key]=Math.round(p.K*v/100/m)}}
function mStep(key,d){const p=SHEET.p;if(p.mode==='g')mSet(key,p[key]+d*5);else{if(!p.pc)pcInit(p);mSet(key,p.pc[key]+d)}renderSheet()}
function mType(key,el){el.value=el.value.replace(/[^\d]/g,'');mSet(key,+el.value||0);const p=SHEET.p,k=mK(p),pc=p.mode==='%'?p.pc:mPct(p,k),tot=pc.p+pc.c+pc.f;
  ['p','c','f'].forEach(x=>{const e=$('#mx_'+x);if(e)e.textContent=p.mode==='g'?`${pc[x]}% of calories`:`${p[x]} g`});$('#mxK').textContent=p.mode==='g'?fmt(k)+' kcal':tot+'%';$('#mxW').innerHTML=macroWarn(p);
  const b=$('#mxGo');if(p.mode==='%'){b.disabled=tot!==100;b.textContent=tot!==100?`Total must be 100% (now ${tot}%)`:'Save'}}
function saveMacros(){const p=SHEET.p;S.food.perKg=p.p/S.food.weight;S.food.carbG=p.c;S.food.fatG=p.f;S.food.kcal=mK(p);closeSheet();refresh();toast(`Macros saved. Daily calories: ${fmt(S.food.kcal)} kcal`,{icon:'check'})}
function setMode(i){S.settings.mode='advanced';refresh();return;S.settings.mode=i?'advanced':'beginner';refresh()}
function adjK(d){targets();S.food.carbG=null;S.food.kcal=clamp(S.food.kcal+d,800,6000);refresh()}
function setWorkoutTime(v){const f=S.food;f.myWorkoutTime=v;const pre=f.meals.findIndex(m=>(m.type||m.n)==='Pre-workout');let msg=`Workout time set to ${fmtTime(v)}`;
  if(pre>=0){const [h,m]=v.split(':').map(Number),t=((h*60+m-60)+1440)%1440,nt=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;f.meals[pre].t=nt;f.meals.sort((a,b)=>a.t.localeCompare(b.t));msg+=`. ${f.meals.find(x=>(x.type||x.n)==='Pre-workout').n} moved to ${fmtTime(nt)}`}
  refresh();toast(msg,{icon:'clock'})}
function renameMeal(i,v){const m=S.food.meals[i],n=v.trim();if(!n){refresh();return}if(!m.type)m.type=m.n;m.n=n;refresh();toast(`Renamed to ${n}`,{icon:'edit'})}
function removeMeal(i){const m=S.food.meals[i];if(S.food.meals.length<=2)return;S.food.meals.splice(i,1);refresh();toast(`${m.n} removed`,{icon:'trash',undo:()=>{S.food.meals.splice(i,0,m)}})}
function mealCount(d){const m=S.food.meals;if(d>0){const last=m[m.length-1].t.split(':').map(Number);m.push({n:m.length===4?'Snack':'Meal '+(m.length+1),t:`${String(Math.min(23,last[0]+2)).padStart(2,'0')}:00`})}else if(m.length>2)m.pop();refresh()}
function saveFoodPlan(){S.food.setup=true;reset(['food']);toast('Plan saved. Your meal plan is ready.',{ai:true})}

/* --- recipe --- */
function plateArt(){return `<svg viewBox="0 0 350 180" width="100%" style="display:block"><rect width="350" height="180" fill="var(--card)"/><circle cx="175" cy="96" r="78" fill="var(--bg)"/><circle cx="175" cy="96" r="62" fill="var(--inset)"/><ellipse cx="152" cy="86" rx="30" ry="20" fill="#E8C07D"/><ellipse cx="200" cy="80" rx="26" ry="18" fill="#C9784A"/><ellipse cx="190" cy="118" rx="28" ry="14" fill="#6FA35A"/><ellipse cx="150" cy="116" rx="14" ry="10" fill="#D9534F" opacity=".85"/></svg>`}
def('recipe',{title:p=>recipeOf(p).r.n,large:false,full:true,body:p=>{const {r,k,key}=recipeOf(p);const pp=Math.round(k*r.m[0]/4),cc=Math.round(k*r.m[1]/4),ff=Math.round(k*r.m[2]/9);

function ingSearch(q){q=(q||'').trim().toLowerCase();if(!q)return [];return INGDB.filter(x=>x.n.toLowerCase().includes(q)||q.split(' ').every(w=>x.n.toLowerCase().includes(w))).slice(0,5)}
function mpSug(i,el){const it=P().items[i];it.n=el.value;it.db=null;it.custom=null;const box=$('#mpS'+i),res=ingSearch(el.value);

function mpPick(i,n){const it=P().items[i],x=INGDB.find(z=>z.n===n);it.n=n;it.db=n;it.custom=null;if(it.u!=='g'&&!(x.tb&&it.u==='tbsp'))it.u='g';refresh()}
function mpCustom(i){const it=P().items[i];it.db=null;it.custom={k:'',p:'',c:'',f:''};refresh()}
function itemCalc(it){if(!String(it.n||'').trim())return {k:0,p:0,c:0,f:0,known:true,empty:true};if(it.custom){const a=+it.a||0,base=+it.customA||a||1,f=a/base;return {k:(+it.custom.k||0)*f,p:(+it.custom.p||0)*f,c:(+it.custom.c||0)*f,f:(+it.custom.f||0)*f,known:true,own:true}}if(it.db){const x=INGDB.find(z=>z.n===it.db);if(x){const a=+it.a||0,g=it.u==='g'?a:it.u==='tbsp'?a*(x.tb||15):it.u==='tsp'?a*(x.tb||15)/3:it.u==='cup'?a*160:a*100;return {k:x.k*g/100,p:x.p*g/100,c:x.c*g/100,f:x.f*g/100,known:true,db:true}}}const r=pdbFind(it.n)||[[],150,6,18,6],a=+it.a||0;let g=it.u==='g'?a:it.u==='tbsp'?a*(r[5]||15):it.u==='tsp'?a*(r[5]||15)/3:it.u==='cup'?a*160:a*(/egg|بيض/.test(it.n.toLowerCase())?50:/date|تمر/.test(it.n.toLowerCase())?8:100);
  return {k:r[1]*g/100,p:r[2]*g/100,c:r[3]*g/100,f:r[4]*g/100,known:!!pdbFind(it.n)}}
function cookExtra(t){t=(t||'').toLowerCase();if(/deep|قلي عميق/.test(t))return [180,'Deep fried: about 180 kcal of absorbed oil'];if(/fri|fry|fried|قلي|مقلي/.test(t))return [90,'Pan fried: about 90 kcal of oil'];if(/butter|ghee|سمن|زبدة/.test(t))return [100,'Cooked with butter or ghee: about 100 kcal'];if(/grill|bake|boil|steam|air|شوي|مشوي|فرن|مسلوق|بخار/.test(t))return [0,'Grilled, baked or boiled: nothing added'];return [0,'']}
function mealTotals(p){const t=p.items.reduce((a,it)=>{const c=itemCalc(it);return {k:a.k+c.k,p:a.p+c.p,c:a.c+c.c,f:a.f+c.f}},{k:0,p:0,c:0,f:0});const [x]=cookExtra(p.notes);t.k+=x;t.f+=x/9;return t}

  <div class="mt16"><button class="btn" onclick="saveCustom()">Save meal</button></div>`}});

let FQ='',FCAT='all';
def('foodsearch',{title:'Search food',large:false,body:()=>`<div class="chips scrollx">${[['all','All'],['gulf','Saudi and Gulf'],['rest','Restaurants'],['basic','Basics']].map(([k,l])=>`<button class="chip ${FCAT===k?'on':''}" onclick="FCAT='${k}';refresh()">${l}</button>`).join('')}</div><div id="fsRes" class="mt12">${searchResults()}</div>`,
  float:()=>`<div class="floatbar glass"><span class="sec" style="padding-left:8px">${ic('search',20)}</span><input id="fsIn" style="flex:1;height:44px;border:0;background:transparent;outline:none;font-size:16px" placeholder="kabsa, mandi, shawarma\u2026" value="${esc(FQ)}" oninput="FQ=this.value;$('#fsRes').innerHTML=searchResults()"><button class="nb gb" style="background:var(--pill)" aria-label="Voice search" onclick="FQ='mandi';$('#fsIn').value=FQ;$('#fsRes').innerHTML=searchResults()">${ic('mic',20)}</button></div>`});
function searchResults(){const q=FQ.toLowerCase().trim();const r=FOODS.filter(f=>(FCAT==='all'||f.cat===FCAT)&&(!q||f.n.toLowerCase().includes(q)||(f.r||'').toLowerCase().includes(q)||f.kw.some(k=>k.includes(q))));

function openPortion(i){const f=FOODS[i];sheet('portion',{i,parts:f.parts?f.parts.map(x=>[x[0],x[1]]):null,g:f.g||100})}
function portionCalc(p){const f=FOODS[p.i];if(p.parts)return partsTotal(p.parts);const m=p.g/(f.g||100);return {k:f.k*m,p:f.p*m,c:f.c*m,f:f.f*m,g:p.g}}
function gramRow(label,sub,val,idx,unit='g'){return `<div class="li noic" style="gap:8px"><span class="grow"><b style="display:block">${label}</b><span class="sec xs" id="${sub}">${''}</span></span>

SH.portion=p=>{const f=FOODS[p.i];return `<div class="h2">${f.n}</div><div class="sec small">${f.r?f.r+', ':''}${f.parts?'Set the grams of each part to match your plate':'Set how much you ate'}</div>
  ${f.sugar||f.fatHigh?`<div class="row gap4 mt8">${f.sugar?`<span class="warnchip">${ic('warn',13,2.2)}High added sugar</span>`:''}${f.fatHigh?`<span class="warnchip">${ic('warn',13,2.2)}High fat</span>`:''}</div>`:''}
  <div class="card mt16 center"><div class="kbd num" id="ptK"></div><div class="sec small b">kcal</div><div class="grid3 mt12">${['Protein','Carbs','Fat'].map((a,i)=>`<div><div class="sora num" id="ptM${i}"></div><div class="sec xs b">${a}</div></div>`).join('')}</div></div>
  ${f.parts?`<div class="sec small b" style="margin:4px 4px 8px">What\u2019s in it</div><div class="list">${p.parts.map(([k,g],j)=>gramRow(ING[k][0],'ptP'+j,g,j)).join('')}${gramRow('Total weight','ptT',Math.round(portionCalc(p).g),-1)}</div>`
   :`<div class="list">${gramRow('Amount','ptT',p.g,-1,f.unit)}</div><div class="chips" style="justify-content:center">${[.5,1,1.5,2].map(m=>`<button class="chip" onclick="SHEET.p.g=${Math.round((f.g||100)*m)};updPortion()">${Math.round((f.g||100)*m)} ${f.unit}</button>`).join('')}</div>`}
  <div class="row small sec mt12" style="gap:6px;align-items:flex-start">${ic('info',16)}<span>${f.parts?'Tip: weigh the meat and the rice separately, cooked, for the most accurate number.':`One serving is ${f.u}${f.g?`, about ${f.g} ${f.unit}`:''}.`}</span></div>
  <div class="mt16"><button class="btn" id="ptBtn" onclick="addPortion()">Add to log</button></div>`};
SH.portion_after=()=>updPortion();
function updPortion(active){const p=SHEET&&SHEET.p;if(!p||SHEET.id!=='portion')return;const t=portionCalc(p);
  $('#ptK').textContent=fmt(t.k);[t.p,t.c,t.f].forEach((v,i)=>$('#ptM'+i).textContent=Math.round(v)+' g');
  if(p.parts)p.parts.forEach(([k,g],j)=>{$('#ptP'+j).textContent=`${fmt(ING[k][1]*g/100)} kcal, ${Math.round(ING[k][2]*g/100)} g protein`;const el=$(`[data-pi="${j}"]`);if(el&&el!==active)el.value=Math.round(g)});
  const te=$('[data-pi="-1"]');if(te&&te!==active)te.value=Math.round(p.parts?t.g:p.g);$('#ptT').textContent=p.parts?'Change it to scale every part':'';
  $('#ptBtn').textContent=`Add ${fmt(t.k)} kcal`;$('#ptBtn').disabled=t.g<=0}
function setPartVal(idx,v){const p=SHEET.p;v=Math.max(0,Math.min(3000,v));if(idx<0){if(p.parts){const cur=partsTotal(p.parts).g||1;p.parts=p.parts.map(([k,g])=>[k,g*v/cur])}else p.g=v}else p.parts[idx][1]=v}
function typePart(idx,el){setPartVal(idx,+el.value||0);updPortion(el)}
function stepPart(idx,d){const p=SHEET.p;const step=idx<0?(p.parts?50:(FOODS[p.i].g||100)>=150?25:10):25;const cur=idx<0?(p.parts?partsTotal(p.parts).g:p.g):p.parts[idx][1];setPartVal(idx,Math.max(0,Math.round((cur+d*step)/step)*step));updPortion()}
function addPortion(){const p=SHEET.p,f=FOODS[p.i],t=portionCalc(p);if(t.g<=0)return;const name=p.parts?`${f.n} (${p.parts.filter(x=>x[1]>0).map(([k,g])=>`${ING[k][0].toLowerCase()} ${Math.round(g)} g`).join(', ')})`:`${f.n}, ${Math.round(p.g)} ${f.unit}`;closeSheet();addFood({n:name,k:t.k,p:t.p,c:t.c,f:t.f,sugar:f.sugar,fatHigh:f.fatHigh})}

function buildWorkout(name){const t=S.train.homeMode?WK.Home:WK[name]||WK.Push;const inj=S.train.injuries.map(x=>x.toLowerCase());
  let ex=t.ex.map(([id,sets,reps])=>{let i=id;const e=EX[id];if(e.stress&&e.stress.some(s=>inj.includes(s))&&e.alt)i=e.alt;return {id:i,sets,reps,swapped:i!==id}});
  (S.train.extra[name]||[]).forEach(id=>ex.push({id,sets:3,reps:'10–12'}));
  ex=ex.map(x=>{let sets=x.sets;if(S.train.light||S.train.deload)sets=Math.max(2,sets-1);const last=S.last[x.id]||[];let target=last[0]?last[0][0]:0;if(S.train.light)target=Math.round(target*.9/2.5)*2.5;if(S.train.deload)target=Math.round(target*.6/2.5)*2.5;return {...x,sets,last,target}});
  return {name,ex,min:Math.round(t.min*(S.train.light?.85:1))}}
function nextWorkoutLabel(){for(let i=1;i<=7;i++){const d=(TODAY+i)%7;if(S.train.plan[d].w)return `${S.train.plan[d].w} on ${DAYSL[d]}`}return 'none planned'}
function weekStrip(){return `<div class="row between" style="gap:4px">${DAYS.map((d,i)=>{const w=S.train.plan[i].w,done=S.train.done[d],isT=i===TODAY;return `<div class="center" style="flex:1"><div class="xs sec b">${d}</div><div style="margin:6px auto 0;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;${isT?'background:var(--text);color:var(--bg)':w?'background:var(--card)':''};font-family:Sora;font-weight:600;font-size:12px">${done?`<span class="${isT?'':'cob'}">${ic('check',18,2.6)}</span>`:w?w[0]:''}</div><div class="xs sec mt4" style="height:16px">${w?(w==='Full body'?'Full':w):'Rest'}</div></div>`}).join('')}</div>`}
def('train',{title:()=>S.train.setup?'Train':'Set up training',large:true,tabs:true,left:p=>!S.train.setup&&p.step>0&&p.step<3?`<button class="nb glass gb" aria-label="Back" onclick="P().step--;refresh()">${ic('back')}</button>`:'',right:()=>S.train.setup?`${bellBtn('workout')}<button class="nb glass gb" aria-label="Weekly plan" onclick="go('weekplan')">${ic('cal',22)}</button>`:'',body:p=>{
  if(!S.train.setup){p.step=p.step??0;return SCR.trainsetup.body(p)}
  return `${coachLock()?lockBanner('training'):''}<div class="card">${weekStrip()}</div>${recoveryCard()}${workoutCard()}${groupCard()}
  ${S.train.deload?`<div class="card row"><span class="cob">${ic('bolt')}</span><div class="grow small"><b>Deload week is on.</b> Weights are about 60% and one set less. Next week you go back to normal.</div><button class="link small" onclick="S.train.deload=false;refresh()">End</button></div>`:!S.train.deloadDismissed?`<div class="card"><div class="row" style="align-items:flex-start">${mark(24,'var(--cobalt)',5)}<div class="grow"><b>Time for a lighter week?</b><div class="sec small mt4">Your squat and bench dropped two sessions in a row. A deload week lets your body catch up, then you come back stronger.</div></div></div><div class="row mt12" style="gap:8px"><button class="btn sm" onclick="S.train.deload=true;S.train.deloadDismissed=true;refresh();toast('Deload week started',{ai:true})">Start deload week</button><button class="btn sm soft" onclick="S.train.deloadDismissed=true;refresh()">Not now</button></div></div>`:''}
  <div class="card row"><span class="ico">${ic('plane',20)}</span><span class="grow"><b>Home or travel mode</b><div class="sec small">No equipment. Bodyweight only.</div></span>${tgl(S.train.homeMode,'S.train.homeMode=!S.train.homeMode;refresh();toast(S.train.homeMode?\'Today is a no-equipment workout\':\'Back to your gym plan\')')}</div>
  <div class="sec small b" style="margin:18px 4px 8px">Plan</div><div class="list">${li(ic('cal',20),'Weekly plan',`${S.train.split}, ${S.train.days} days a week`,'',"go('weekplan')")}${li(ic('users',20),'Train together','One workout, right weights for each','',"go('together')")}</div>
  <div class="sec small b" style="margin:18px 4px 8px">Tools</div><div class="list">${li(ic('book',20),'Exercise library','Filter by equipment and muscle','',"go('library')")}${li(ic('camera',20),'Unknown machine?','Take a photo and add it','',"go('machinecam')")}${li(ic('walk',20),'Cardio and steps',`${fmt(S.steps)} steps today`,'',"go('cardio')")}</div>
  ${coachLock()?'':`<button class="btn soft mt8" style="background:transparent;color:var(--sec)" onclick="redoTraining()">Redo training setup</button>`}`}});

const SPLITS={2:[['Upper / Lower',['Upper','Lower']],['Full body / Full body',['Full body','Full body']]],3:[['Push / Pull / Legs',['Push','Pull','Legs']],['Upper / Lower / Full body',['Upper','Lower','Full body']],['Full body × 3',['Full body','Full body','Full body']]],4:[['Upper / Lower × 2',['Upper','Lower','Upper','Lower']],['Push / Pull / Legs / Full body',['Push','Pull','Legs','Full body']]],5:[['Push / Pull / Legs / Upper / Lower',['Push','Pull','Legs','Upper','Lower']],['Upper / Lower × 2 + Full body',['Upper','Lower','Upper','Lower','Full body']]],6:[['Push / Pull / Legs × 2',['Push','Pull','Legs','Push','Pull','Legs']],['Upper / Lower × 3',['Upper','Lower','Upper','Lower','Upper','Lower']]]};

def('trainsetup',{title:'Training setup',large:false,left:p=>`<button class="nb glass gb" aria-label="Back" onclick="${p.step>0&&p.step<3?'P().step--;refresh()':'back()'}">${ic('back')}</button>`,body:p=>{const t=S.train,st=p.step;
  if(st===3)return `<div style="padding-top:120px">${thinking(p.msg||'Building your plan')}</div>`;
  const hdr=`<div class="progdots">${[0,1,2].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><div class="sec small b">Step ${st+1} of 3</div>`;
  if(st===0)return `${hdr}<div class="h1 mt4">How many days a week?</div><p class="sec mt4 mb16">Pick what you can keep up, not your best week.</p><div class="grid3">${[2,3,4,5,6].map(d=>`<button class="card center" style="margin:0;border:2px solid ${t.days===d?'var(--cobalt)':'transparent'}" onclick="S.train.days=${d};refresh()"><div class="kbd num ${t.days===d?'cob':''}">${d}</div><div class="sec small b">days</div></button>`).join('')}</div><div class="mt24"><button class="btn" onclick="P().step=1;refresh()">Next</button></div>`;
  if(st===1)return `${hdr}<div class="h1 mt4">Any injuries or pain?</div><p class="sec mt4 mb16">We swap out exercises that stress these areas.</p><div class="chips">${['None',...INJ].map(x=>{const on=x==='None'?!t.injuries.length:t.injuries.includes(x);return `<button class="chip ${on?'on':''}" onclick="toggleInj('${x}')">${on?ic('check',14,2.6):''}${x}</button>`}).join('')}</div>
    ${t.injuries.length?`<div class="card row mt16" style="align-items:flex-start"><span class="cob">${ic('info')}</span><span class="small">Exercises that load your ${t.injuries.join(', ').toLowerCase()} will be replaced. If the pain is sharp or new, please see a doctor first.</span></div>`:''}<div class="mt24"><button class="btn" onclick="P().step=2;refresh()">Next</button></div>`;
  const opts=SPLITS[t.days];return `${hdr}<div class="h1 mt4">Choose your split</div><p class="sec mt4 mb16">Only splits that fit ${t.days} days a week.</p>
    <button class="opt ${p.pick==='ai'?'on':''}" onclick="P().pick='ai';refresh()" style="background:var(--g-ai)">${mark(28,'var(--cobalt)',6)}<span class="grow"><b>Let the AI build it</b><span class="sec small" style="display:block">Picks the split, spreads it across your week and chooses every exercise.</span></span><span class="dot">${p.pick==='ai'?ic('check',14,3):''}</span></button>
    ${opts.map(([l,seq],i)=>`<button class="opt ${p.pick===i?'on':''}" onclick="P().pick=${i};refresh()"><span class="grow"><b>${l}</b><span class="sec small" style="display:block">${onceNote(seq)?'Each muscle once a week':'Each muscle about twice a week'}</span></span><span class="dot">${p.pick===i?ic('check',14,3):''}</span></button>`).join('')}
    <button class="opt ${p.pick==='own'?'on':''}" onclick="P().pick='own';refresh()"><span class="ico">${ic('edit',20)}</span><span class="grow"><b>I\u2019ll build it myself</b><span class="sec small" style="display:block">Pick your days, name your workouts and choose every exercise.</span></span><span class="dot">${p.pick==='own'?ic('check',14,3):''}</span></button>
    <div class="mt16"><button class="btn" ${p.pick===undefined?'disabled':''} onclick="planGo()">${p.pick==='own'?'Start building':'Build my plan'}</button></div>`}});
function redoTraining(){alertBox({icon:ic('warn',30),iconCls:'down',title:'Redo training setup?',body:`Your current plan (${esc(S.train.split)}, ${S.train.days} days a week) will be replaced. Your workout history and records stay.`,actions:[{label:'Yes, redo setup',cls:'danger',fn:()=>{S.train.setup=false;P().step=0;P().pick=undefined;refresh();topEl().querySelector('.scroll').scrollTop=0}},{label:'Keep my plan',cls:'glass'}]})}

/* ---------- recovery ---------- */
S.rec={hrv:[64,62,60,63,59,61,58],rhr:[60,61,62,60,63,62,64],load:[0,520,0,610,0,0,580,0,640,0,590,0,0,0],tools:[],stress:1};
const REC_TOOLS=[['stretch','Stretching',2],['foam','Foam rolling',2],['walk','Easy walk',2],['nap','Nap',2],['sauna','Sauna',1],['cold','Cold shower',1],['massage','Massage',3]];
function recParts(){const sl=S.sleeps.at(-1),c=S.checkin,r=S.rec;
  const sleep=clamp((sl.h-5)/3,0,1)*100*(sl.q===0?.8:sl.q===2?1.05:1);
  const hrvBase=r.hrv.slice(0,-1).reduce((a,b)=>a+b,0)/(r.hrv.length-1),hrv=clamp(r.hrv.at(-1)/hrvBase,0,1.1)*90;
  const rhrBase=r.rhr.slice(0,-1).reduce((a,b)=>a+b,0)/(r.rhr.length-1),rhr=clamp(100-(r.rhr.at(-1)-rhrBase)*12,0,100);
  const sore=[100,70,35][c.sore],energy=[45,80,100][c.energy];
  const acute=r.load.slice(-7).reduce((a,b)=>a+b,0),chronic=r.load.reduce((a,b)=>a+b,0)/2,acwr=chronic?acute/chronic:1,load=clamp(100-Math.abs(acwr-1)*120,30,100);
  const fuel=clamp((eaten().p/targets().p)*100,40,100);
  return {sleep:Math.round(Math.min(100,sleep)),hrv:Math.round(Math.min(100,hrv)),rhr:Math.round(rhr),sore,energy,load:Math.round(load),fuel:Math.round(fuel),acwr,hrvBase,rhrBase}}
function recScore(){const p=recParts();const s=p.sleep*.28+p.hrv*.18+p.rhr*.1+p.sore*.16+p.energy*.1+p.load*.1+p.fuel*.08;const bonus=Math.min(6,S.rec.tools.reduce((a,t)=>a+(REC_TOOLS.find(x=>x[0]===t)||[0,0,0])[2],0));return Math.round(clamp(s+bonus,5,99))}
const recLabel=v=>v>=80?['Ready to train hard','up']:v>=60?['Ready for a normal session','cob']:v>=40?['Take it easier today','sec']:['Rest or go very light','down'];
function recoveryCard(){const v=recScore(),[l,c]=recLabel(v);return `<button class="card tap row" style="width:100%;text-align:left" onclick="S.ptab=2;tab('progress')">${ring({id:'recc',v,max:100,size:56,sw:6,color:v>=60?'var(--cobalt)':'var(--down)',inner:`<b class="sora num" style="font-size:15px">${v}</b>`})}<span class="grow"><span class="sec xs b" style="display:block">Recovery</span><b style="display:block">${l}</b><span class="sec small">Tap for tips to recover faster</span></span><span class="sec">${ic('chev',18)}</span></button>`}
function musReady(){const done=S.train.done,base={Legs:done.Sun?62:95,Back:92,Chest:95,Shoulders:94,Arms:90,Core:85};if(done[DAYS[TODAY]]){const w=todayPlan();if(w==='Push'){base.Chest=35;base.Shoulders=45;base.Arms=60}if(w==='Pull'){base.Back=35;base.Arms=55}if(w==='Legs'||w==='Lower'){base.Legs=30;base.Core=60}if(w==='Upper'){base.Chest=45;base.Back=45;base.Shoulders=50}if(w==='Full body')Object.keys(base).forEach(k=>base[k]=Math.min(base[k],55))}return base}
function recTips(p,v){const t=[];const sl=S.sleeps.at(-1);
  if(p.sleep<80)t.push(['moon','Sleep more tonight',`You slept ${fx(sl.h)} h. Aim for 7.5 to 8 h: lights out by 11:00 PM and no screens 30 minutes before.`]);
  if(p.hrv<85)t.push(['pulse','Your HRV is below normal',`${S.rec.hrv.at(-1)} ms vs your usual ${Math.round(p.hrvBase)} ms. Keep today\u2019s session moderate and skip extra sets.`]);
  if(p.sore<100)t.push(['body','Sore muscles',`10 minutes of light stretching and foam rolling on the sore areas helps more than full rest.`]);
  if(p.fuel<90)t.push(['food','Eat your protein',`You still need ${Math.max(0,Math.round(targets().p-eaten().p))} g today. Have Greek yogurt or a shake before bed. It helps repair overnight.`]);
  if(S.water.ml<S.food.water*.7)t.push(['drop','Drink more water',`You\u2019re at ${fmt(S.water.ml)} of ${fmt(S.food.water)} ml. Even mild dehydration slows recovery.`]);
  if(p.acwr>1.3)t.push(['chart','Training load jumped',`This week\u2019s load is ${fx(p.acwr)}\u00d7 your usual. Consider a lighter day or a deload week.`]);
  if(v<50)t.push(['bolt','Make today light','Swap the workout for a 30-minute walk and mobility. You\u2019ll train better tomorrow.']);
  if(S.user.gender==='Female'&&S.period.mode==='track'&&cyPhase()==='Luteal')t.unshift(['drop','Luteal phase',`You\u2019re on day ${S.period.day} of your cycle. Lower HRV and higher resting heart rate are normal this week. Sleep a bit more and drop a set if you feel tired.`]);
  t.push(['walk','Move on rest days','A 20 to 30 minute easy walk increases blood flow and speeds up recovery.']);
  return t.slice(0,5)}
def('recovery',{title:'Recovery',body:()=>{const p=recParts(),v=recScore(),[l,c]=recLabel(v),mus=musReady(),r=S.rec;
  const parts=[['Sleep',p.sleep,'moon',`${fx(S.sleeps.at(-1).h)} h, ${QL[S.sleeps.at(-1).q].toLowerCase()}`],['HRV',p.hrv,'pulse',`${r.hrv.at(-1)} ms (usual ${Math.round(p.hrvBase)})`],['Resting heart rate',p.rhr,'heart',`${r.rhr.at(-1)} bpm (usual ${Math.round(p.rhrBase)})`],['Soreness',p.sore,'body',['None','A little','Very sore'][S.checkin.sore]],['Energy',p.energy,'bolt',['Tired','Normal','Great'][S.checkin.energy]],['Training load',p.load,'chart',`${fx(p.acwr)}\u00d7 your usual`],['Nutrition',p.fuel,'food',`${Math.round(eaten().p)} of ${targets().p} g protein`]];
  return `<div class="card center" style="padding:22px"><div style="display:flex;justify-content:center">${ring({id:'recbig',v,max:100,size:160,sw:15,color:v>=60?'var(--cobalt)':'var(--down)',inner:`<div class="kbd num">${v}%</div><div class="sec xs b">recovered</div>`})}</div><div class="h2 mt12 ${c}">${l}</div><p class="sec small mt4">Based on your sleep, heart data, soreness, training load and food.</p></div>
  ${secHead('What\u2019s in your score')}<div class="card">${parts.map(([n,val,i,sub])=>`<div class="mt8"><div class="row between small"><span class="row" style="gap:8px"><span class="cob">${ic(i,16)}</span><b>${n}</b></span><span class="num b">${val}</span></div><div class="mt4">${bar('rp'+n,val,100,'',false,val>=75?'var(--up)':val>=50?'var(--cobalt)':'var(--down)')}</div><div class="sec xs mt4">${sub}</div></div>`).join('')}</div>
  ${secHead('Muscles ready to train')}<div class="card">${Object.entries(mus).map(([m,val])=>`<div class="row" style="gap:10px;margin-top:8px"><span class="small b" style="width:76px">${m}</span><div class="grow">${bar('mr'+m,val,100,'',true,val>=80?'var(--up)':val>=55?'#D97706':'var(--down)')}</div><span class="xs b num" style="width:78px;text-align:right">${val>=80?'Ready':val>=55?`~${Math.round((80-val)*1.5)} h`:`~${Math.round((80-val)*1.3)} h`}</span></div>`).join('')}<div class="sec xs mt12">Green is ready. Hours show roughly when it\u2019s fully recovered.</div></div>
  ${secHead('Coach tips')}${recTips(p,v).map(([i,t,d])=>`<div class="card row" style="align-items:flex-start"><span class="ico cobalt">${ic(i,18)}</span><div class="grow"><b>${t}</b><div class="small sec mt4">${d}</div></div></div>`).join('')}

 after:el=>{const box=$('#days',el);if(!box)return;box.addEventListener('pointerdown',e=>{const c=e.target.closest('.wchip');if(!c)return;const from=+c.dataset.wk;if(S.train.plan[from].lock){const x1=e.clientX,y1=e.clientY;const u=ev=>{c.removeEventListener('pointerup',u);if(Math.hypot(ev.clientX-x1,ev.clientY-y1)<8)sheet('dayplan',{d:from});else toast(`${DAYSL[from]} is locked`,{icon:'lock'})};c.addEventListener('pointerup',u);return}

function exArrow(x){const done=x.sets.filter(s=>s.done);if(!done.length)return '';const v=done.reduce((a,s)=>a+(+s.w||0)*(+s.r||0)+(+s.r||0)*.01,0),l=done.reduce((a,s)=>a+(+s.lw||0)*(+s.lr||0)+(+s.lr||0)*.01,0);if(Math.abs(v-l)<.001)return `<span class="sec b small">same</span>`;return v>l?`<span class="up" aria-label="Improved">${ic('up',18,2.6)}</span>`:`<span class="down" aria-label="Dropped">${ic('down',18,2.6)}</span>`}

  return `<div class="row between mb8"><span class="sec small b">${dn} of ${tot} sets</span><span class="sec small b num" id="elapsed">0:00</span></div>${bar('ws',dn,tot,'',false,'var(--cobalt)')}<div class="sp"></div>
  ${s.ex.map((x,ei)=>{const e=EX[x.id];return `<div class="card"><div class="row between"><div class="row" style="gap:6px"><div class="h3">${e.n}</div>${exArrow(x)}</div><span class="sec small b">${x.reps}</span></div><div class="sec xs">${e.mach[S.train.machines[x.id]||0]}</div>
    <div class="setrow xs sec b" style="margin-top:12px"><span class="center">Set</span><span class="center">${e.time?'—':'kg'}</span><span class="center">${e.time?'seconds':'reps'}</span><span></span></div>
    ${x.sets.map((st,si)=>`<div class="setrow ${st.done?'done':''}"><span class="center sora">${si+1}</span><input type="number" inputmode="decimal" aria-label="Weight set ${si+1}" placeholder="${st.lw||'—'}" value="${st.w}" ${e.time?'disabled':''} oninput="S.session.ex[${ei}].sets[${si}].w=this.value"><input type="number" inputmode="numeric" aria-label="Reps set ${si+1}" placeholder="${st.lr}" value="${st.r}" oninput="S.session.ex[${ei}].sets[${si}].r=this.value"><button class="ck ${st.done?'on':''}" aria-label="Finish set ${si+1}" onclick="markSet(${ei},${si})">${ic('check',20,2.6)}</button></div>`).join('')}
    ${x.tip?`<div class="inset row mt12" style="gap:10px">${mark(20,'var(--cobalt)',4)}<span class="small b">That was easy. Add 2.5 kg next time.</span></div>`:''}</div>`}).join('')}<div style="height:80px"></div>`},
 float:()=>{const s2=S.session;if(!s2)return '';const tot=s2.ex.reduce((a,x)=>a+x.sets.length,0),dn=s2.ex.reduce((a,x)=>a+x.sets.filter(y=>y.done).length,0);return `<div class="floatbar glass" style="padding:8px 8px 8px 18px"><div class="grow small"><b>${dn} of ${tot} sets done</b><div class="sec">Tap \u2713 after each set</div></div><button class="btn sm glass gb" onclick="startRest(90)">${ic('timer',16)}Rest</button></div>`},
 after:el=>{clearInterval(window._el);window._el=setInterval(()=>{const e=$('#elapsed');if(!e||!S.session){clearInterval(window._el);return}const s=Math.floor((Date.now()-S.session.start)/1000)+12*60;e.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},1000)}});
function markSet(ei,si){const x=S.session.ex[ei],st=x.sets[si];if(st.done){st.done=false;refresh();return}if(st.w==='')st.w=st.lw||0;if(st.r==='')st.r=st.lr;st.done=true;
  const hi=parseInt(String(x.reps).split('–').pop());if(+st.r>=hi&&(+st.w>=+st.lw)&&EX[x.id].t!=='Bodyweight')x.tip=true;refresh();
  const left=S.session.ex.some(y=>y.sets.some(z=>!z.done));if(left)startRest(90);else toast('All sets done. Tap Finish.',{ai:true})}
let TIMER={};
function ensureTimerEl(){let t=$('#timer');if(!t){t=document.createElement('div');t.id='timer';t.className='timer glass';$('#app').appendChild(t)}return t}
function startRest(sec){TIMER={end:Date.now()+sec*1000,total:sec};ensureTimerEl().classList.add('show');tickRest();clearInterval(TIMER.i);TIMER.i=setInterval(tickRest,250)}
function tickRest(){const t=ensureTimerEl();const left=Math.max(0,Math.ceil((TIMER.end-Date.now())/1000));const size=150,sw=10,r=(size-sw)/2,C=2*Math.PI*r,p=left/TIMER.total;
  t.innerHTML=`<div class="row between"><b>Rest</b><button class="nb" aria-label="Close" onclick="stopTimer()">${ic('close',18,2.2)}</button></div><div style="display:grid;place-items:center;margin:4px 0 14px"><div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--cobalt)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .3s linear"/></svg><div class="ri"><div class="kbd num" style="font-size:48px">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</div></div></div></div>
   <div class="grid2"><button class="btn soft" style="background:rgba(127,127,135,.14)" onclick="TIMER.end+=30000;TIMER.total+=30;tickRest()">+30 s</button><button class="btn" onclick="stopTimer()">Skip</button></div>`;
  if(left<=0){stopTimer();const wc=NS().cats.workout;if(NS().on&&wc.rest)playSound(wc.sound);toast('Rest done. Next set.',{icon:'timer'})}}
function stopTimer(){clearInterval(TIMER.i);const t=$('#timer');t&&t.classList.remove('show')}
async function voiceSet(){const L=$('#listen');L.innerHTML=`<span class="wave"><i></i><i></i><i></i><i></i></span>Listening\u2026`;L.classList.add('show');await wait(1300);L.innerHTML=`${ic('mic',18)}\u201cBench 80 kilos, 10 reps\u201d`;await wait(1000);L.classList.remove('show');
  const s=S.session;if(!s)return;let x=s.ex.find(e=>e.id==='bench'||e.id==='chestpress')||s.ex[0];const si=x.sets.findIndex(z=>!z.done);if(si<0){toast('All bench sets are already logged',{icon:'info'});return}x.sets[si].w=80;x.sets[si].r=10;markSet(s.ex.indexOf(x),si);toast(`Logged ${EX[x.id].n}: 80 kg × 10`,{ai:true})}
function finishWorkout(){const s=S.session;if(!s)return back();const done=s.ex.reduce((a,x)=>a+x.sets.filter(y=>y.done).length,0);
  const go2=()=>{stopTimer();const mins=Math.max(1,Math.round((Date.now()-s.start)/60000))+12;let vol=0,prs=[],ups=0,downs=0;
    s.ex.forEach(x=>{const d=x.sets.filter(y=>y.done);d.forEach(y=>vol+=(+y.w||0)*(+y.r||0));const best=Math.max(0,...d.map(y=>+y.w||0)),prevBest=Math.max(0,...(S.last[x.id]||[]).map(y=>y[0]));if(best>prevBest&&prevBest>0)prs.push([EX[x.id].n,best]);const a=exArrow(x);if(a.includes('Improved'))ups++;if(a.includes('Dropped'))downs++;if(d.length)S.last[x.id]=d.map(y=>[+y.w||0,+y.r||0])});
    S.summary={w:s.w,mins,vol,sets:done,prs,ups,downs,kcal:Math.round(mins*6.2)};if(!S.train.done[DAYS[TODAY]]){S.wstreak++;S.bestW=Math.max(S.bestW,S.wstreak);S.wHist.push(s.w)}S.train.done[DAYS[TODAY]]=true;S.train.queue.push(S.train.queue.shift());S.session=null;replace('summary')};
  if(!done)alertBox({title:'Finish without logging?',body:'You haven\u2019t finished any sets yet.',actions:[{label:'Keep training'},{label:'End workout',cls:'glass',fn:()=>{stopTimer();S.session=null;back()}}]});else go2()}
def('summary',{title:'Workout done',large:false,body:()=>{const s=S.summary||{w:'Push',mins:52,vol:9840,sets:18,prs:[['Bench press',82.5]],ups:3,downs:1,kcal:320};const inten=s.vol>9000?'Hard':s.vol>4000?'Moderate':'Light';
  return `<div class="center" style="padding:10px 0 6px">${ring({id:'sum',v:1,max:1,size:120,sw:12,inner:`<span class="cob">${ic('check',40,2.6)}</span>`})}<div class="h1 mt16">${s.w} day, done</div><p class="sec mt4">Great work. It\u2019s saved and will show in grey next time.</p></div>
  <div class="grid2 mt16">${[['Time',s.mins+' min'],['Volume',fmt(s.vol)+' kg'],['Sets',s.sets],['Intensity',inten]].map(([a,b])=>`<div class="card center" style="margin:0"><div class="sora num" style="font-size:22px">${b}</div><div class="sec xs b">${a}</div></div>`).join('')}</div>

  <div class="card row"><span class="cob">${ic('flame',20)}</span><span class="grow"><b>${S.wstreak} workouts in a row</b><div class="sec small">Best: ${S.bestW}</div></span></div>

function repError(){const {a,b}=repRange();if(toD(a)>toD(b))return 'The start date is after the end date.';if(toD(b)>toD(TODAY_DATE))return 'The end date can\u2019t be in the future.';if((toD(b)-toD(a))/864e5>366)return 'Pick a range of one year or less.';return ''}
function repData(){const {a,b}=repRange(),days=Math.round((toD(b)-toD(a))/864e5)+1,planned=Math.max(1,Math.round(days*3/7)),done=Math.max(0,planned-Math.floor(days/14)),wd=-Math.min(6,days*.09),prot=Math.round(days*.74),sl=7+Math.sin(days)*.25;
  const pts=Math.min(days,30),w=Array.from({length:pts},(_,i)=>+(80.4-wd*(1-i/(pts-1||1))+Math.sin(i*1.9)*.15).toFixed(1));return {days,planned,done,wd,prot,sl,w}}
function dateWheel(name,o){return gwheel(name,[{items:MONTHS.map((n,i)=>[i+1,n]),sel:o.m,w:80},{items:Array.from({length:31},(_,i)=>[i+1,i+1]),sel:o.d,w:60},{items:Array.from({length:4},(_,i)=>[2023+i,2023+i]),sel:o.y,w:90}])}

function delChat(id){const i=S.chats.findIndex(c=>c.id===id),c=S.chats[i];S.chats.splice(i,1);if(!S.chats.length)S.chats.push({id:Date.now(),when:'Today',time:'Now',msgs:[AI('Hi. What can I help with?')]});if(S.cur===id){S.cur=S.chats[0].id;S.chat=curChat().msgs}refresh();toast('Chat deleted',{icon:'trash',undo:()=>{S.chats.splice(i,0,c)}})}
function historyList(){const q=CHQ.toLowerCase().trim();const list=S.chats.filter(c=>c.msgs.some(m=>m.from==='me')||c.id===S.cur).filter(c=>!q||c.msgs.some(m=>strip(m.text).toLowerCase().includes(q)));
  if(!list.length)return `<div class="card empty"><span class="sec">${ic('search',30)}</span><div class="h3 mt8">No chats found</div><p class="sec small mt4">Try a different word.</p></div>`;
  const groups={};list.forEach(c=>(groups[c.when]=groups[c.when]||[]).push(c));
  return Object.entries(groups).map(([g,cs])=>`<div class="sec small b" style="margin:18px 4px 8px">${g}</div><div class="list">${cs.map(c=>{const last=[...c.msgs].reverse().find(m=>m.from==='ai')||c.msgs[0];return `<div class="li" style="padding-right:6px"><button class="row grow" style="gap:12px;text-align:left;min-width:0" onclick="openChat(${c.id})"><span style="flex:none">${mark(26,c.id===S.cur?'var(--cobalt)':'var(--sec)',5)}</span><span class="grow" style="min-width:0"><span class="row between" style="gap:8px"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(chatTitle(c))}</b><span class="sec xs" style="flex:none">${c.id===S.cur?'<span class="cob b">Open</span>':c.time}</span></span><span class="sec small" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(strip(last.text))}</span></span></button><button class="nb" style="width:36px;height:36px;flex:none" aria-label="Delete chat" onclick="delChat(${c.id})"><span class="sec">${ic('trash',17)}</span></button></div>`}).join('')}</div>`).join('')}
def('chathistory',{title:'Chat history',body:()=>`<p class="sec" style="margin-top:-8px">Your past chats with the coach. Tap one to open it.</p>
  <div class="field row mt16" style="gap:8px"><span class="sec">${ic('search',20)}</span><input style="flex:1;border:0;background:transparent;outline:none;font-size:16px;height:48px" placeholder="Search your chats" value="${esc(CHQ)}" oninput="CHQ=this.value;$('#hList').innerHTML=historyList()"></div>
  <div id="hList">${historyList()}</div>
  <button class="btn mt16" onclick="back();setTimeout(newChat,450)">${ic('edit',18)}New chat</button>`});
async function chatVoice(){const L=$('#listen');L.innerHTML=`<span class="wave"><i></i><i></i><i></i><i></i></span>Listening\u2026`;L.classList.add('show');await wait(1500);L.classList.remove('show');sendChat('I slept 7 hours')}
async function sendChat(text){text=(text||'').trim();if(!text||S.chat.thinking)return;S.chat.push({from:'me',text});S.chat.thinking=true;refresh();await wait(1100+Math.random()*500);S.chat.thinking=false;const r=aiReply(text);S.chat.push({from:'ai',...r});refresh()}
function miniCard(inner){return `<div style="background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px">${inner}</div>`}
function aiReply(text){const t=text.toLowerCase();let m;
  if(/hungrier|period|cycle|luteal|ovulat|perimenopaus|fertil|conceive|pregnan/.test(t)&&S.user.gender==='Female'){const ph=cyPhase(),d=S.period.day;
    if(/hungr/.test(t))return {text:`You\u2019re on day ${d}, in the <b>${ph.toLowerCase()} phase</b>. ${ph==='Luteal'?'Progesterone is higher now, which raises hunger and burns about 100 to 200 kcal more a day. Have a bigger protein snack, like Greek yogurt with dates. It\u2019s fine to eat a little more this week.':'Hunger usually rises in the week before your period. Right now it\u2019s more likely sleep, stress or a low-protein day.'}`};
    if(/train hard|period/.test(t))return {text:'Yes, if you feel okay. Training on your period is safe and light movement can ease cramps. If you feel tired, keep your weights but do one set less. Avoid PR attempts on the heaviest days.'};
    if(/weight/.test(t))return {text:`On day ${d} (${ph.toLowerCase()} phase) it\u2019s normal to hold 0.5 to 2 kg of water. Look at your weekly average, not one day. Your coach won\u2019t change your calories because of it.`};
    if(/fertil|conceive/.test(t))return {text:'Keep training as normal while trying. Moderate exercise supports fertility. Eat enough: very big calorie cuts can delay ovulation. Folic acid daily is recommended. Check with your doctor for anything specific.'};
    if(/perimenopaus|sleep/.test(t))return {text:'Hormone changes can wake you up at night (hot flashes, night sweats). A cooler room, less caffeine after noon, and lifting weights 2 to 3 times a week all help. If it\u2019s affecting your life, talk to your doctor about options.'};
  }
  if((m=t.match(/(?:slept|sleep)\D*(\d+(?:\.\d+)?)/))){const h=+m[1];const prev=S.sleeps[S.sleeps.length-1],had=prev.d==='Tue*'?{...prev}:null;logSleep(h,h>=7?2:1,true);toast(`Logged to Sleep: ${h} h`,{ai:true,undo:()=>{if(had)S.sleeps[S.sleeps.length-1]=had;else S.sleeps.pop()}});
    return {text:`Logged ${h} hours of sleep. ${h>=7?'That\u2019s a solid night. You\u2019re good for a full push workout today.':'That\u2019s a bit short. I\u2019ll keep today\u2019s workout as planned, but aim for bed by 11 PM tonight.'}`}}
  if((m=t.match(/(?:drank|drink|water)\D*(\d+)\s*(ml|l)?/))){let ml=+m[1];if(m[2]==='l'||ml<10)ml*=1000;addWater(ml,'Water');return {text:`Added ${fmt(ml)} ml of water. You\u2019re at ${fmt(S.water.ml)} of ${fmt(S.food.water)} ml today.`}}
  if((m=t.match(/(?:weigh|weight)\D*(\d+(?:\.\d+)?)/))){const v=+m[1];logWeight(v);toast(`Logged to Progress: ${v} kg`,{ai:true});return {text:`Saved ${v} kg for today. Your weekly average is ${fx(weekAvg(0))} kg.`}}
  if(/\b(ate|had|eaten|eat)\b/.test(t)&&!/should|what/.test(t)){const items=parseFoods(t.replace(/.*?\b(ate|had|eaten|eat)\b/,''));const it=items.reduce((a,x)=>({n:a.n?a.n+', '+x.n:x.n,k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f,sugar:a.sugar||x.sugar,fatHigh:a.fatHigh||x.fatHigh}),{n:'',k:0,p:0,c:0,f:0});addFood(it);const left=kcalLeft();
    return {text:`Logged ${esc(it.n.toLowerCase())}: <b>${fmt(it.k)} kcal</b>, ${Math.round(it.p)} g protein. ${left>=0?`You have ${fmt(left)} kcal left today.`:`That puts you ${fmt(-left)} kcal over. No stress, we can spread it across the week.`}`}}
  if(/progress|how am i|doing|week/.test(t)){const w=S.weights;return {text:`You\u2019re down <b>${fx(w[0].v-w[w.length-1].v)} kg</b> in two weeks, right on pace for a moderate cut. Strength is holding, which means you\u2019re keeping muscle.`,card:miniCard(`<div class="row between xs b"><span class="sec">Weight, 2 weeks</span><span class="up">${ic('down',12,2.6)} ${fx(w[0].v-w[w.length-1].v)} kg</span></div>${lineChart(w.map(x=>x.v),{h:70,w:240,id:'chat'+S.chat.length})}`)}}
  if(/dinner|eat|meal|hungry/.test(t)){const left=kcalLeft(),pl=Math.max(0,targets().p-eaten().p);return {text:`You have <b>${fmt(left)} kcal</b> and ${Math.round(pl)} g protein left. Try the chicken shawarma bowl from your plan. It fits both.`,card:miniCard(`<div class="row between"><b class="small">Chicken shawarma bowl</b><span class="small num b">${fmt(Math.min(left,700))} kcal</span></div><div class="sec xs">About ${Math.round(Math.min(left,700)*.36/4)} g protein</div>`)}}
  if(/protein/.test(t)){const pl=Math.max(0,targets().p-eaten().p);return {text:pl?`You need ${Math.round(pl)} g more protein today. A cup of Greek yogurt (17 g) and a small can of tuna (25 g) would do it.`:'Protein is done for today. Nice.'}}
  if(/workout|train|gym|lift/.test(t)){const w=todayPlan();return {text:w?`Today is <b>${w} day</b>: ${buildWorkout(w).ex.length} exercises, about ${buildWorkout(w).min} minutes. Start with bench press at ${(buildWorkout(w).ex[0]||{}).target} kg.`:'Today is a rest day. A 30 minute walk would help recovery.'}}
  if(/recover|sore|rest day|tired|fatigue/.test(t)){const p=recParts(),v=recScore();return {text:`Your recovery is <b>${v}%</b> today. Three things that will help most:<br>${recTips(p,v).slice(0,3).map((x,i)=>`${i+1}. <b>${x[1]}.</b> ${x[2]}`).join('<br>')}`}}
  if(/pain|hurt|injur|sick|doctor|medic/.test(t))return {text:'I\u2019m sorry you\u2019re dealing with that. I can\u2019t give medical advice, so please check with a doctor. If you want, I can remove exercises that load that area from your plan.'};
  return {text:'I can log food, water, sleep and weight for you, or answer questions about your plan and progress. Try \u201cI had a shawarma wrap\u201d or \u201cHow\u2019s my progress?\u201d'}}

function bLevel(b){return b.tiers.filter(t=>b.v>=t).length}
function bProg(b){const L=bLevel(b);if(L>=b.tiers.length)return 1;const lo=L?b.tiers[L-1]:0,hi=b.tiers[L];return (b.v-lo)/(hi-lo)}
function badgeIcon(b,size=60){const L=bLevel(b),max=b.tiers.length,sw=size*.13,r=(size-sw)/2,C=2*Math.PI*r,pr=bProg(b);
  if(!L)return ring({id:'bg'+b.id+size,v:pr,max:1,size,sw,color:'var(--sec)',inner:`<span class="sec">${ic('lock',size*.27)}</span>`});
  const full=L>=max;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--cobalt)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*(full?1:Math.max(.04,pr))} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><circle cx="${size/2}" cy="${size/2}" r="${r-sw*.9}" fill="${full?'#F59E0B':'var(--cobalt)'}"/></svg><div class="ri" style="color:#fff">${ic(b.ic,size*.3,2.2)}</div><span style="position:absolute;right:-4px;bottom:-4px;min-width:${size*.36}px;height:${size*.36}px;border-radius:${size*.18}px;background:var(--text);color:var(--bg);font-family:Sora;font-weight:600;font-size:${size*.2}px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)">${L}</span></div>`}
function badgeTile(b){const L=bLevel(b),pin=S.pinned.includes(b.id);return `<button class="badge" style="position:relative" onclick="sheet('badge',{id:'${b.id}'})">${pin?`<span class="cob" style="position:absolute;top:8px;right:8px">${ic('bookmark',13,2.4)}</span>`:''}${badgeIcon(b,58)}<span class="xs b" style="line-height:1.2">${b.n}</span><span class="xs sec" style="margin-top:-6px">${L?LVN[L]:'Locked'}</span></button>`}
SH.badge=p=>{const b=BADGE2.find(x=>x.id===p.id),L=bLevel(b),max=b.tiers.length,next=b.tiers[L],pin=S.pinned.includes(b.id);
  return `<div class="center"><div style="display:flex;justify-content:center">${badgeIcon(b,96)}</div><div class="h2 mt12">${b.n}</div><div class="sec small b">${L?`${LVN[L]} of ${max}`:'Not unlocked yet'}</div></div>
  ${L<max?`<div class="card mt16"><div class="row between small"><b>${fmt(b.v)} ${b.u}</b><span class="sec b">Next: ${fmt(next)}</span></div><div class="mt8">${bar('bp'+b.id,b.v-(L?b.tiers[L-1]:0),next-(L?b.tiers[L-1]:0),'',true,'var(--cobalt)')}</div><div class="sec xs mt8">${fmt(next-b.v)} more to reach ${LVN[L+1]}.</div></div>`:`<div class="card mt16 center small"><b>Max level reached.</b> Respect.</div>`}
  <div class="list">${b.tiers.map((t,i)=>`<div class="li noic"><span style="width:26px;height:26px;border-radius:13px;display:grid;place-items:center;flex:none;${i<L?'background:var(--cobalt);color:#fff':'border:2px solid var(--line)'}">${i<L?ic('check',13,3):`<span class="xs b sec">${i+1}</span>`}</span><span class="grow ${i<L?'b':''}">${LVN[i+1]}</span><span class="sec small b">${fmt(t)} ${b.u}</span></div>`).join('')}</div>
  ${L?`<div class="card row"><span class="grow"><b>Show on my profile</b><div class="sec xs">Up to 3 badges. Friends see them. (${S.pinned.length}/3)</div></span>${tgl(pin,`togglePin('${b.id}')`)}</div>`:`<p class="sec small center">Unlock it to show it on your profile.</p>`}
  <button class="btn soft mt8" style="background:transparent" onclick="closeSheet()">Done</button>`};

function parseScheme(str){const m=str.match(/(\d+)\s*(sets|rounds)\s*×\s*(\d+)\s*(reps|s)/);return {sets:+m[1],reps:+m[3],unit:m[4]==='s'?'s':'reps'}}
let GST=[];const gsClear=()=>{GST.forEach(clearTimeout);GST=[]};const gsLater=(fn,ms)=>GST.push(setTimeout(()=>{if(S.gs&&topEl()&&topEl().dataset.id==='groupactive')fn()},ms));
function startGroup(ids){gsClear();const ppl=[{id:'me',n:'You',c:'var(--cobalt)',lvl:'Intermediate',me:true},...ids.map(id=>S.friends.find(f=>f.id===id))];

  go('groupactive',{v:0});ppl.slice(1).forEach((x,i)=>gsLater(()=>{S.gs.joined[x.id]=true;refresh();toast(`${x.n} tapped Start`,{icon:'users'});if(ppl.every(y=>S.gs.joined[y.id]))gsLater(gsBegin,700)},1300+i*1100))}
function gsBegin(){if(!S.gs||S.gs.started)return;S.gs.started=true;refresh();toast('Everyone is in. Let\u2019s go.',{ai:true});
  const f=S.gs.ppl[1];if(f)gsLater(()=>{const e=S.gs.ex[S.gs.cur],me=e.per[f.id];me.sets.push({w:'',r:'',done:false,lw:0});refresh();toast(`${f.n} added a set on ${e.n}. Synced.`,{icon:'users'})},9000)}
const gsTurn=()=>S.gs.ppl[S.gs.turn];
const gsDone=(e,id)=>e.per[id].sets.every(x=>x.done);
function gsAdvance(){const g=S.gs,e=g.ex[g.cur];if(g.ppl.every(x=>gsDone(e,x.id))){if(g.cur<g.ex.length-1){g.cur++;g.turn=0;P().v=g.cur;refresh();toast(`Next: ${g.ex[g.cur].n}`,{icon:'train'})}else{refresh();toast('All exercises done. Tap Finish.',{ai:true})}return gsCheckFriend()}
  for(let k=1;k<=g.ppl.length;k++){const t=(g.turn+k)%g.ppl.length;if(!gsDone(e,g.ppl[t].id)){g.turn=t;break}}refresh();gsCheckFriend()}
function gsCheckFriend(){const g=S.gs;if(!g)return;const t=gsTurn();if(t.me)return;gsLater(()=>{const e=g.ex[g.cur],st=e.per[t.id].sets.find(x=>!x.done);if(st){st.done=true;st.r=e.per[t.id].reps}gsAdvance()},3200)}
function gsSet(si){const g=S.gs,e=g.ex[P().v],mine=e.per.me,st=mine.sets[si];if(st.done){st.done=false;refresh();return}if(st.w==='')st.w=st.lw||0;if(st.r==='')st.r=mine.reps;st.done=true;
  if(P().v===g.cur&&gsTurn().me)gsAdvance();else refresh()}

function gsEdit(a){const e=S.gs.ex[P().v],m=e.per.me;if(a==='add')m.sets.push({w:'',r:'',done:false,lw:m.sets[0]?m.sets[0].lw:0});if(a==='del'){const i=m.sets.map(x=>x.done).lastIndexOf(false);if(m.sets.length>1&&i>=0)m.sets.splice(i,1)}if(a==='r+')m.reps++;if(a==='r-')m.reps=Math.max(1,m.reps-1);refresh();gsSynced()}

function rdWeek(k){if(k==='weight')return S.weights.slice(-7).map(x=>x.v);const w=RD[k].w.slice();if(k==='steps')w[6]=S.steps;return w}

function rdFmt(k,v){if(k==='stress')return `${v<40?'Low':v<60?'Medium':'High'}`;if(k==='bed'){const h=Math.floor(v),m=Math.round((v-h)*60);return `${h} h ${m}`}return RD[k].dec?fx(v):fmt(v)}

def('reading',{title:p=>DEV[p.k][0],large:false,body:p=>{const k=p.k,r=RD[k],[n,i]=DEV[k];const intr=!!r.d;p.r=p.r??(intr?0:1);if(!intr&&p.r===0)p.r=1;
  const week=rdWeek(k),v=week[week.length-1],avg7=week.reduce((a,b)=>a+b,0)/7,diff=v-avg7;

  const dir=k==='weight'?goalDir():r.dir,good=dir===0||dir===null?null:Math.sign(diff)===dir;

   ${k==='stress'?`<div class="sec small mt4">Score ${v} of 100</div>`:''}</div>

function setCFilter(i){S.cfilter=i;refresh()}

def('client',{title:p=>cl(p.id).status==='pending'?cl(p.id).code:cl(p.id).n,large:false,right:p=>`<button class="nb glass gb" aria-label="Message" onclick="go('cthread',{id:'${p.id}'})">${ic('msg',20)}</button>`,body:p=>{const c=cl(p.id);
  if(c.status==='pending')return `<div class="center"><span class="cob">${ic('key',34,2)}</span><div class="h2 mt8">Waiting to join</div><div class="sec small">Their details show up here after they sign up.</div></div>
   <div class="card center mt16" style="padding:22px"><div class="sec small b">Their sign-up code</div><div class="kbd num mt8" style="letter-spacing:.06em">${c.code}</div><p class="sec small mt8">They type this code when they create their Gymi account. Then you\u2019ll see their food, training and health here.</p>
   <button class="link small mt8" style="color:var(--down)" onclick="S.coach.clients=S.coach.clients.filter(x=>x.id!=='${c.id}');back();toast('Invite cancelled',{icon:'trash'})">Cancel this invite</button>
   <div class="grid2 mt12"><button class="btn sm glass gb" onclick="navigator.clipboard&&navigator.clipboard.writeText('${c.code}');toast('Code copied',{icon:'copy'})">${ic('copy',16)}Copy</button><button class="btn sm" onclick="shareCode('${c.id}')">${ic('share',16)}Share</button></div></div>
   ${assignCards(c)}`;
  const rank=rankC().findIndex(x=>x.id===c.id);
  return `<div class="row" style="gap:14px">${avatar(c,64)}<div class="grow"><div class="h2">${c.n}</div><div class="sec small">${c.isNew?'Goal not set yet':c.goal}, ${String(c.g).toLowerCase()}, ${c.age}</div><div class="xs b mt4">${c.pkg?`<span class="tag" style="height:18px;font-size:10px;padding:0 6px">${c.pkg}</span> `:''}${c.isNew?'New client':`Rank #${rank+1} of ${rankC().length} \u00b7 ${c.streak}-day streak`}</div></div>${c.isNew?'':ring({id:'cr'+c.id,v:c.commit,max:100,size:62,sw:6,color:cTone(c.commit),inner:`<b class="sora num" style="font-size:15px">${c.commit}%</b>`})}</div>
  <div class="mt16">${seg(['Overview','Food','Training','Health'],p.t||0,'setCT')}</div><div class="sp"></div>${[cOverview,cFood,cTraining,cHealth][p.t||0](c)}`}});
function endClient(id){const c=cl(id);alertBox({title:`End coaching with ${c.n}?`,body:'They go back to the AI coach. This frees a spot.',actions:[{label:'End coaching',cls:'danger',fn:()=>{c.status='left';back();const o=S.coach.offer;toast(myActive()<o.max&&o.autoRelist&&o.listed?'Spot freed. You\u2019re showing in Find a coach again.':'Spot freed',{icon:'check'})}},{label:'Cancel',cls:'glass'}]})}
function setCT(i){P().t=i;refresh()}
function assignCards(c){const pr=prog(c.prog),mp=mplan(c.meal);return `${secHead('Plans for '+c.n)}
  <button class="card tap row" style="width:100%;text-align:left" onclick="sheet('assign',{id:'${c.id}',k:'prog'})"><span class="ico cobalt">${ic('train',18)}</span><span class="grow"><span class="sec xs b" style="display:block">Workout program</span><b>${pr?pr.n:'Not set (the AI plans it)'}</b></span><span class="sec">${ic('chev',18)}</span></button>
  <button class="card tap row" style="width:100%;text-align:left" onclick="sheet('assign',{id:'${c.id}',k:'meal'})"><span class="ico cobalt">${ic('food',18)}</span><span class="grow"><span class="sec xs b" style="display:block">Meal plan</span><b>${mp?mp.n:'Not set (the AI plans it)'}</b></span><span class="sec">${ic('chev',18)}</span></button>`}
function cOverview(c){if(c.isNew)return todoCard(c)+`<div class="card row" style="align-items:flex-start"><span class="cob">${ic('info',20)}</span><span class="small"><b>${c.n} just joined.</b> Their weight, food, training and commitment show up here as they log. Ranking starts after their first week.</span></div><div class="card row"><span class="ico">${ic('scale',18)}</span><div class="grow"><b>${c.w.length?fx(c.w.at(-1))+' kg':'No weight yet'}</b><div class="sec small">Starting weight</div></div></div>${assignCards(c)}<div class="grid2 mt8"><button class="btn glass gb" onclick="go('cthread',{id:'${c.id}'})">${ic('msg',16)}Say hi</button><button class="btn soft" onclick="toast('Reminder sent to ${c.n}',{icon:'bell'})">${ic('bell',16)}Nudge</button></div>`;const w=c.w,d=w.at(-1)-w[0];return `<div class="card"><div class="row between"><b class="small">Weight, 8 weeks</b><span class="xs b ${(c.goal==='Lose fat'?d<0:d>0)?'up':'down'}">${d<0?'\u2193':'\u2191'} ${fx(Math.abs(d))} kg</span></div>${lineChart(w,{h:110,id:'cw'+c.id,dots:true})}</div>
  <div class="card"><b class="small">Commitment, last 30 days</b>${[['Workouts as planned',Math.min(100,c.commit+6)],['Calories on target',Math.max(10,c.commit-8)],['Protein goal',Math.max(10,c.commit-3)],['Water goal',Math.max(10,c.commit-12)],['Sleep 7 h+',Math.max(10,c.commit-15)]].map(([n,v])=>`<div class="mt8"><div class="row between small"><span>${n}</span><b class="num">${v}%</b></div><div class="mt4">${bar('co'+c.id+n,v,100,'',false,cTone(v))}</div></div>`).join('')}</div>
  ${todoCard(c)}${assignCards(c)}
  <div class="grid2 mt8"><button class="btn glass gb" onclick="go('cthread',{id:'${c.id}'})">${ic('msg',16)}Message</button><button class="btn soft" onclick="toast('Check-in reminder sent to ${c.n}',{icon:'bell'})">${ic('bell',16)}Nudge</button></div>
  <button class="btn soft mt8" style="background:transparent;color:var(--down)" onclick="endClient('${c.id}')">End coaching with ${c.n}</button>`}
function cFood(c){const k=c.eat.reduce((a,x)=>a+x[2],0),pr=c.eat.reduce((a,x)=>a+x[3],0),mp=mplan(c.meal);return `<div class="card"><div class="row between"><b class="small">Today</b><span class="sec xs b">Goal ${fmt(c.kT)} kcal, ${c.pT} g protein</span></div>
   <div class="grid2 mt8"><div>${bar('ck'+c.id,k,c.kT,`${fmt(k)} kcal`,true,'var(--cobalt)')}</div><div>${bar('cp'+c.id,pr,c.pT,`${pr} g protein`,true,'var(--up)')}</div></div></div>
  ${secHead('What '+c.n+' ate today')}${c.eat.length?`<div class="list">${c.eat.map(([n,m,kk,pp])=>`<div class="li noic"><span class="grow"><b style="display:block">${n}</b><span class="sec xs">${m}</span></span><span style="text-align:right"><b class="num" style="display:block">${kk}</b><span class="sec xs">${pp} g protein</span></span></div>`).join('')}</div>`:`<div class="card small sec center">Nothing logged today.</div>`}
  <div class="card"><b class="small">Calories, last 7 days</b>${barChart([.92,1.04,.88,.97,1.1,.85,k/c.kT].map(x=>Math.round(x*c.kT)),{labels:['W','T','F','S','S','M','Today'],hl:6,goal:c.kT})}</div>
  ${secHead('Meal plan','Change',`sheet('assign',{id:'${c.id}',k:'meal'})`)}${mp?`<div class="list">${mp.meals.map(m=>`<div class="li noic"><span class="grow"><b style="display:block">${m.n}, ${fmtTime(m.t)}</b><span class="sec xs">${esc(m.d)}</span></span><b class="num">${m.k}</b></div>`).join('')}</div>`:`<div class="card small sec center">No meal plan from you. The AI suggests meals for ${c.n}.</div>`}`}
function cTraining(c){const pr=prog(c.prog);return `${secHead('Recent workouts')}${c.work.length?`<div class="list">${c.work.map(([n,when,min,note])=>`<div class="li"><span class="ico">${ic('train',18)}</span><span class="grow"><b style="display:block">${n}</b><span class="sec xs">${when}, ${min} min${note?`, ${note}`:''}</span></span></div>`).join('')}</div>`:`<div class="card small sec center">No workouts this week.</div>`}
  <div class="card"><b class="small">Workouts per week</b>${barChart([3,3,2,3,3,2,c.work.length?Math.min(3,c.work.length+1):0],{labels:['W1','W2','W3','W4','W5','W6','Now'],hl:6})}</div>
  ${secHead('Program','Change',`sheet('assign',{id:'${c.id}',k:'prog'})`)}${pr?pr.days.map((d,i)=>`<div class="card"><div class="row between"><b>${esc(d.n)}</b><span class="sec xs b">${d.ex.length} exercises</span></div>${d.ex.map(([id,s,r])=>`<div class="row between small mt8"><span>${EX[id].n}</span><span class="sec num b">${s} \u00d7 ${r}</span></div>`).join('')}</div>`).join('')+`<button class="btn sm glass gb" style="width:100%" onclick="go('progedit',{id:'${pr.id}'})">${ic('edit',15)}Edit this program</button>`:`<div class="card small sec center">No program from you. The AI plans ${c.n}\u2019s workouts.</div>`}`}
function cHealth(c){const h=c.h;return `<div class="grid2" style="gap:10px">${[['moon','Sleep',`${fx(h.sleep)} h`,'7-day average',h.sleep>=7],['pulse','Recovery',`${h.rec}%`,'Today',h.rec>=60],['heart','Resting HR',`${h.rhr} bpm`,'7-day average',h.rhr<=65],['bolt','HRV',`${h.hrv} ms`,'7-day average',h.hrv>=55],['steps','Steps',fmt(h.steps),'Today',h.steps>=7000],['drop','Water',`${fx(h.water)} L`,'Today',h.water>=2.5]].map(([i,n,v,s,ok])=>`<div class="card" style="margin:0;padding:14px"><div class="row between"><span class="sec xs b">${n}</span><span class="${ok?'up':'down'}">${ic(i,15)}</span></div><div class="sora num mt4" style="font-size:20px">${v}</div><div class="sec xs">${s}</div></div>`).join('')}</div>
  <p class="sec xs mt12" style="margin:12px 4px">${c.n} chose to share these with you. Cycle and personal notes are never shared.</p>`}
SH.assign=p=>{const c=cl(p.id),isP=p.k==='prog',list=isP?S.coach.programs:S.coach.meals,cur=isP?c.prog:c.meal;return `<div class="h2">${isP?'Workout program':'Meal plan'} for ${c.n}</div><p class="sec small mt4">It shows up in ${c.n}\u2019s app right away.</p>
  <div class="mt12">${list.map(x=>`<button class="opt ${cur===x.id?'on':''}" onclick="assignTo('${c.id}','${p.k}','${x.id}')"><span class="grow"><b>${esc(x.n)}</b><span class="sec small" style="display:block">${isP?`${x.days.length} days, ${x.days.reduce((a,d)=>a+d.ex.length,0)} exercises`:`${x.meals.length} meals, ${fmt(x.meals.reduce((a,m)=>a+m.k,0))} kcal`}</span></span><span class="dot">${cur===x.id?ic('check',14,3):''}</span></button>`).join('')}
   <button class="opt ${!cur?'on':''}" onclick="assignTo('${c.id}','${p.k}','')"><span class="grow"><b>Let the AI plan it</b><span class="sec small" style="display:block">Gymi builds it from ${c.n}\u2019s goal</span></span><span class="dot">${!cur?ic('check',14,3):''}</span></button></div>
  <button class="btn sm glass gb mt8" style="width:100%" onclick="closeSheet();${isP?`newProg('${c.id}')`:`newMeal('${c.id}')`}">${ic('plus',16,2.2)}Make a new one</button>`};
function assignTo(cid,k,id){const c=cl(cid);if(k==='prog')c.prog=id||null;else c.meal=id||null;if(S.myCoach&&S.myCoach.cid===cid){if(k==='prog')S.myCoach.prog=id||null;else S.myCoach.meal=id||null;applyCoachPlans()}closeSheet();refresh();toast(id?`Sent to ${c.n}`:`${c.n} will get AI plans`,{icon:'check'})}
/* --- Add client + code --- */
def('addclient',{title:'Invite a client',large:false,body:p=>{if(!p.cid){const code='GYMI-'+Math.random().toString(36).slice(2,6).toUpperCase().replace(/[O0I1]/g,'7'),id='c'+Date.now();
    S.coach.start.invite=true;S.coach.clients.push({id,n:'New invite',c:['#3355FF','#15803D','#C2410C','#7C3AED','#0EA5E9'][S.coach.clients.length%5],g:'',age:'',goal:'',w:[],commit:0,trend:0,streak:0,last:'Not joined yet',status:'pending',code,prog:null,meal:null,kT:2200,pT:140,eat:[],work:[],h:{},invited:true});p.cid=id}
  const c=cl(p.cid);return `<div class="center" style="padding-top:8px"><span class="cob">${ic('key',34,2)}</span><div class="h1 mt8">Their sign-up code</div><p class="sec mt8">Give this code to your client. They type it when they create their Gymi account, fill in their own details, and show up in your list.</p>
   <div class="card mt16" style="padding:24px"><div class="kbd num" style="letter-spacing:.08em">${c.code}</div><div class="sec xs b mt8">One person per code</div></div>
   <div class="grid2"><button class="btn glass gb" onclick="navigator.clipboard&&navigator.clipboard.writeText('${c.code}');toast('Code copied',{icon:'copy'})">${ic('copy',16)}Copy</button><button class="btn" onclick="shareCode('${c.id}')">${ic('share',16)}Share</button></div></div>
  ${secHead('Plans to start with (optional)')}<p class="sec small" style="margin:-4px 4px 10px">You can also do this after they join.</p>
  <span class="label">Workout program</span><div class="chips">${[['','AI plans it'],...S.coach.programs.map(x=>[x.id,x.n])].map(([id,n])=>`<button class="chip ${(c.prog||'')===id?'on':''}" onclick="cl('${c.id}').prog='${id}'||null;refresh()">${esc(n)}</button>`).join('')}<button class="chip" style="background:transparent;border:1.5px dashed var(--cobalt);color:var(--cobalt)" onclick="acNew('prog')">${ic('plus',13,2.6)}Make a new one</button></div>
  <span class="label">Meal plan</span><div class="chips">${[['','AI plans it'],...S.coach.meals.map(x=>[x.id,x.n])].map(([id,n])=>`<button class="chip ${(c.meal||'')===id?'on':''}" onclick="cl('${c.id}').meal='${id}'||null;refresh()">${esc(n)}</button>`).join('')}<button class="chip" style="background:transparent;border:1.5px dashed var(--cobalt);color:var(--cobalt)" onclick="acNew('meal')">${ic('plus',13,2.6)}Make a new one</button></div>
  <div class="mt24"><button class="btn" onclick="reset(['clients']);S.cfilter=2;refresh()">Done</button></div>`}});
function acNew(k){const c=cl(P().cid);if(k==='prog'){const id='p'+Date.now();S.coach.programs.push({id,n:`Program for ${c.code}`,days:[{n:'Day 1',ex:[]},{n:'Day 2',ex:[]},{n:'Day 3',ex:[]}]});c.prog=id;go('progedit',{id})}else{const id='m'+Date.now();S.coach.meals.push({id,n:`Meal plan for ${c.code}`,meals:[{n:'Breakfast',t:'08:00',k:500,p:30,d:''},{n:'Lunch',t:'13:30',k:700,p:45,d:''},{n:'Dinner',t:'20:00',k:600,p:40,d:''}]});c.meal=id;go('mealedit',{id})}}
function shareCode(id){const c=cl(id),txt=`${S.coach.name} invited you to Gymi. Create your account and type this code: ${c.code}`;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt);toast('Invite text copied',{icon:'copy'})}}
/* --- Programs tab (workouts + meals) --- */
def('cprog',{title:'Programs',tabs:true,large:true,right:()=>`<button class="nb glass gb" aria-label="New" onclick="${(S.cpt||0)?'newMeal()':'newProg()'}">${ic('plus',22,2.2)}</button>`,body:()=>{const t=S.cpt||0,used=(k,id)=>S.coach.clients.filter(c=>c[k]===id).length;
  return `${seg(['Workouts','Meal plans'],t,'setCpt')}<div class="sp"></div>
  ${t===0?S.coach.programs.map(x=>`<button class="card tap" style="width:100%;text-align:left" onclick="go('progedit',{id:'${x.id}'})"><div class="row between"><b>${esc(x.n)}</b><span class="sec">${ic('chev',18)}</span></div><div class="sec small mt4">${x.days.map(d=>esc(d.n)).join(' \u00b7 ')}</div><div class="xs b mt8 cob">${used('prog',x.id)} client${used('prog',x.id)===1?'':'s'}</div></button>`).join('')
  :S.coach.meals.map(x=>`<button class="card tap" style="width:100%;text-align:left" onclick="go('mealedit',{id:'${x.id}'})"><div class="row between"><b>${esc(x.n)}</b><span class="sec">${ic('chev',18)}</span></div><div class="sec small mt4">${x.meals.length} meals, ${fmt(x.meals.reduce((a,m)=>a+m.k,0))} kcal, ${x.meals.reduce((a,m)=>a+m.p,0)} g protein</div><div class="xs b mt8 cob">${used('meal',x.id)} client${used('meal',x.id)===1?'':'s'}</div></button>`).join('')}
  <button class="btn glass gb mt8" onclick="${t?'newMeal()':'newProg()'}">${ic('plus',18,2.2)}${t?'New meal plan':'New workout program'}</button>`}});
function setCpt(i){S.cpt=i;refresh()}
function newProg(cid){S.coach.start.program=true;const id='p'+Date.now();S.coach.programs.push({id,n:'New program',days:[{n:'Day 1',ex:[]}]});if(cid)cl(cid).prog=id;go('progedit',{id,cid})}
function newMeal(cid){const id='m'+Date.now();S.coach.meals.push({id,n:'New meal plan',meals:[{n:'Breakfast',t:'08:00',k:500,p:30,d:''},{n:'Lunch',t:'13:30',k:700,p:45,d:''},{n:'Dinner',t:'20:00',k:600,p:40,d:''}]});if(cid)cl(cid).meal=id;go('mealedit',{id,cid})}
def('progedit',{title:'Workout program',large:false,body:p=>{const x=prog(p.id);return `<label class="label">Program name</label><input class="field" value="${esc(x.n)}" oninput="prog('${x.id}').n=this.value">
  ${x.days.map((d,di)=>`<div class="card mt12"><div class="row" style="gap:8px"><input class="b grow" value="${esc(d.n)}" style="border:0;border-bottom:1.5px dashed var(--line);background:transparent;outline:none;color:inherit;font-size:16px;padding:4px 0" oninput="prog('${x.id}').days[${di}].n=this.value">${x.days.length>1?`<button class="nb" style="width:32px;height:32px" aria-label="Remove day" onclick="prog('${x.id}').days.splice(${di},1);refresh()"><span class="down">${ic('trash',15)}</span></button>`:''}</div>
   ${d.ex.map(([id,s,r],i)=>`<div class="row mt8" style="gap:6px"><span class="grow small b">${EX[id].n}</span><div class="stepper" style="gap:2px"><button style="width:26px;height:26px" onclick="pxSet('${x.id}',${di},${i},-1)">${ic('minus',12,2.4)}</button><b class="num small" style="width:16px;text-align:center">${s}</b><button style="width:26px;height:26px" onclick="pxSet('${x.id}',${di},${i},1)">${ic('plus',12,2.4)}</button></div><input class="num center small" value="${esc(r)}" style="width:54px;height:36px;border:0;border-radius:8px;background:var(--inset);outline:none;color:inherit;font-weight:700" onchange="prog('${x.id}').days[${di}].ex[${i}][2]=this.value"><button class="nb" style="width:32px;height:32px" aria-label="Remove" onclick="prog('${x.id}').days[${di}].ex.splice(${i},1);refresh()"><span class="sec">${ic('close',13,2.4)}</span></button></div>`).join('')}
   <button class="link small mt12" onclick="sheet('cxpick',{pid:'${x.id}',di:${di},q:''})">${ic('plus',14,2.4)} Add exercise</button></div>`).join('')}
  <button class="btn sm soft" style="width:100%" onclick="prog('${x.id}').days.push({n:'Day ${x.days.length+1}',ex:[]});refresh()">${ic('plus',16,2.2)}Add a day</button>
  <div class="mt16"><button class="btn" onclick="back();toast('Program saved. Clients on it see the changes.',{icon:'check'})">Save</button></div>`}});
function pxSet(pid,di,i,d){const e=prog(pid).days[di].ex[i];e[1]=clamp(e[1]+d,1,8);refresh()}
SH.cxpick=p=>{const q=p.q.toLowerCase();const list=Object.entries(EX).filter(([,e])=>!q||e.n.toLowerCase().includes(q)||e.m.toLowerCase().includes(q));return `<div class="h2">Add an exercise</div><div class="field row mt12" style="gap:8px">${ic('search',18)}<input style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:46px;color:inherit" placeholder="Search by name or muscle" value="${esc(p.q)}" oninput="SHEET.p.q=this.value;renderSheet();setTimeout(()=>{const i=$('#sheetc input');i&&(i.focus(),i.setSelectionRange(99,99))},0)"></div>
  <div class="list mt8">${list.map(([id,e])=>`<button class="li noic" onclick="prog('${p.pid}').days[${p.di}].ex.push(['${id}',3,'10']);closeSheet();refresh();toast('${e.n.replace(/'/g,"\\'")} added',{icon:'check'})"><span class="grow"><b style="display:block">${e.n}</b><span class="sec xs">${e.m}, ${e.t}</span></span><span class="cob">${ic('plus',18,2.2)}</span></button>`).join('')}</div>`};
def('mealedit',{title:'Meal plan',large:false,body:p=>{const x=mplan(p.id),tot=x.meals.reduce((a,m)=>a+(+m.k||0),0),pt=x.meals.reduce((a,m)=>a+(+m.p||0),0);return `<label class="label">Plan name</label><input class="field" value="${esc(x.n)}" oninput="mplan('${x.id}').n=this.value">
  <div class="card row mt12"><span class="grow"><b>Total</b></span><span class="sora num" id="meTot">${fmt(tot)} kcal, ${pt} g protein</span></div>
  ${x.meals.map((m,i)=>`<div class="card"><div class="row" style="gap:8px"><input class="b grow" value="${esc(m.n)}" style="border:0;border-bottom:1.5px dashed var(--line);background:transparent;outline:none;color:inherit;font-size:16px;padding:4px 0" oninput="mplan('${x.id}').meals[${i}].n=this.value">
    <label style="position:relative;display:inline-flex;height:34px;align-items:center;padding:0 10px;border-radius:10px;background:var(--inset)"><b class="small">${fmtTime(m.t)}</b><input type="time" value="${m.t}" style="position:absolute;inset:0;opacity:0" onchange="mplan('${x.id}').meals[${i}].t=this.value;refresh()"></label>
