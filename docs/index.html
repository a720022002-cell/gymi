S.notif={on:true,cats:{
  water:{on:false,freq:'2h',from:'08:00',to:'22:00',sound:'drop'},
  food:{on:true,mode:'before',before:30,summary:true,sumTime:'21:00',sound:'crunch'},
  workout:{on:true,before:30,rest:true,sound:'lightweight'},
  checkin:{on:true,time:'07:30',sound:'chime'},
  sleep:{on:false,time:'23:00',wind:true,sound:'soft'},
  vitamins:{on:true,sound:'default'},
  report:{on:true,day:'Fri',time:'10:00',sound:'default'},
  friends:{on:true,prs:true,challenges:true,cheers:false,sound:'yeahbuddy'}}};
const NS=()=>S.notif;
const NCAT={water:['Water','drop','Time for a glass of water. You\u2019re 700 ml behind.'],food:['Meals and food','food','Lunch in 30 minutes: chicken kabsa, 810 kcal.'],workout:['Workouts','train','Push day in 30 minutes. Light weight, let\u2019s go.'],checkin:['Morning check-in','sun','Good morning. Your 30-second check-in is ready.'],sleep:['Bedtime','moon','Bed in 30 minutes. Put the phone away soon.'],vitamins:['Vitamins','pill','Time for Vitamin D, 50,000 IU.'],report:['Reports','chart','Your weekly report is ready. You trained 3 of 3 days.'],friends:['Gym Bros','users','Ahmed hit a new PR: Bench 100 kg.']};
const NSOUNDS={water:['drop','pour','default','bell','none'],food:['crunch','default','bell','none'],workout:['lightweight','yeahbuddy','gymbell','horn','default','none'],checkin:['chime','default','bell','none'],sleep:['soft','bell','default','none'],vitamins:['default','bell','chime','none'],report:['default','chime','none'],friends:['yeahbuddy','default','horn','none']};
const FREQ={'1h':'Every hour','2h':'Every 2 hours','3h':'Every 3 hours','day':'Once a day','behind':'Only when I\u2019m behind'};
/* sounds made with Web Audio, voices with the phone\u2019s speech */
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,dur,type='sine',vol=.3,delay=0){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function noise(dur,freq,q,vol,delay=0,type='bandpass'){try{const a=ac(),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const src=a.createBufferSource();src.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain(),t=a.currentTime+delay;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(f).connect(g).connect(a.destination);src.start(t)}catch(e){}}
function say(t,pitch=.6,rate=.9){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=pitch;u.rate=rate;u.lang='en-US';speechSynthesis.speak(u)}catch(e){tone(440,0,.3)}}
const SOUNDS={
 default:['Gymi ding',()=>{tone(880,0,.25);tone(1320,0,.4,'sine',.22,.12)}],
 drop:['Water drop',()=>{tone(1500,450,.12,'sine',.45);tone(1200,380,.1,'sine',.25,.2)}],
 pour:['Pouring water',()=>{noise(1.2,1100,1.4,.35);noise(1.2,2600,2,.12)}],
 crunch:['Crunchy bite',()=>{for(let i=0;i<4;i++)noise(.06,2600+i*500,.9,.6,i*.085,'highpass')}],
 bell:['Soft bell',()=>{tone(660,0,1.3,'sine',.25);tone(1320,0,.9,'sine',.07)}],
 chime:['Morning chime',()=>[523,659,784,1047].forEach((f,i)=>tone(f,0,.55,'sine',.2,i*.12))],
 soft:['Night chimes',()=>[784,659,523].forEach((f,i)=>tone(f,0,1,'sine',.12,i*.28))],
 gymbell:['Gym bell',()=>{tone(1250,0,1,'triangle',.3);tone(1257,0,1,'triangle',.2,.015)}],
 horn:['Air horn',()=>{tone(233,0,.7,'sawtooth',.16);tone(294,0,.7,'sawtooth',.12);tone(349,0,.7,'sawtooth',.08)}],
 lightweight:['\u201cLight weight!\u201d voice',()=>say('Light weight, baby!',.5,.85)],
 yeahbuddy:['\u201cYeah buddy!\u201d voice',()=>say('Yeah buddy!',.5,.85)],
 none:['None (silent)',()=>{}]};
function playSound(k){(SOUNDS[k]||SOUNDS.default)[1]()}
function testNotif(k){const c=NS().cats[k];playSound(c.sound);notify('Gymi',NCAT[k][2],{icon:NCAT[k][1],onTap:()=>go('notif',{k})})}
function catSummary(k){const c=NS().cats[k];switch(k){
  case 'water':return `${FREQ[c.freq]}${c.freq==='day'?`, ${fmtTime(c.from)}`:`, ${fmtTime(c.from)} to ${fmtTime(c.to)}`}`;
  case 'food':return `${c.mode==='before'?`${c.before} min before each meal`:c.mode==='after'?'After each meal, to log it':'Once a day'}`;
  case 'workout':return c.before?`${c.before===60?'1 hour':c.before+' min'} before your workout`:'At workout time';
  case 'checkin':return `Every day at ${fmtTime(c.time)}`;
  case 'sleep':return `Bedtime ${fmtTime(c.time)}${c.wind?', plus a wind-down reminder':''}`;
  case 'vitamins':return 'At each vitamin\u2019s own time';
  case 'report':return `${DAYSL[DAYS.indexOf(c.day)]} at ${fmtTime(c.time)}`;
  case 'friends':return [c.prs&&'PRs',c.challenges&&'challenges',c.cheers&&'cheers'].filter(Boolean).join(', ')||'Nothing selected'}}
function notifSummary(){const n=NS();if(!n.on)return 'Off';const on=Object.values(n.cats).filter(c=>c.on).length;return `${on} of ${Object.keys(n.cats).length} on`}
function bellIcon(on,s=22){return on?`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC.bell}" fill="var(--cobalt)" stroke="var(--cobalt)" stroke-width="1.8" stroke-linejoin="round"/></svg>`:ic('bell',s)}
function bellBtn(k){const on=NS().on&&NS().cats[k].on;return `<button class="nb glass gb" aria-label="${NCAT[k][0]} reminders ${on?'on':'off'}" aria-pressed="${on}" onclick="bellToggle('${k}')">${bellIcon(on)}</button>`}
function bellToggle(k){const n=NS(),c=n.cats[k];if(!n.on){n.on=true;c.on=true}else c.on=!c.on;refresh();if(c.on)playSound(c.sound);
  toast(c.on?`${NCAT[k][0]} reminders on: ${catSummary(k).toLowerCase()}`:`${NCAT[k][0]} reminders off`,{icon:'bell',action:{label:'Settings',fn:()=>go('notif',{k})}})}
def('notifications',{title:'Notifications',body:()=>{const n=NS();return `
  <div class="card row"><span class="ico cobalt">${ic('bell',20)}</span><span class="grow"><b>Allow notifications</b><div class="sec small">Turn off to pause everything</div></span>${tgl(n.on,'S.notif.on=!S.notif.on;refresh()')}</div>
  ${n.on?'':`<p class="sec small center mb12">All reminders are paused. Your choices below are kept.</p>`}
  <div class="list" style="${n.on?'':'opacity:.5'}">${Object.keys(NCAT).map(k=>{const c=n.cats[k];return `<div class="li" style="padding-right:12px"><button class="row grow" style="gap:12px;text-align:left;min-width:0" onclick="go('notif',{k:'${k}'})"><span class="ico">${ic(NCAT[k][1],18)}</span><span class="grow" style="min-width:0"><b style="display:block">${NCAT[k][0]}</b><span class="sec small">${c.on?catSummary(k):'Off'}</span></span><span class="sec">${ic('chev',16)}</span></button>${tgl(c.on,`S.notif.cats.${k}.on=!S.notif.cats.${k}.on;refresh()`)}</div>`}).join('')}</div>
  <p class="sec small mt8">Tap a type to choose how often it reminds you and which sound it plays. If you don\u2019t hear sounds, turn off your phone\u2019s silent mode.</p>`}});
let NOPEN=null;
function nRadio(k,field,opts){const c=NS().cats[k];return `<div class="list">${opts.map(([v,l,sub])=>`<button class="li noic" onclick="S.notif.cats.${k}.${field}=${typeof v==='string'?`'${v}'`:v};refresh()" role="radio" aria-checked="${c[field]===v}"><span class="grow"><b style="display:block">${l}</b>${sub?`<span class="sec small">${sub}</span>`:''}</span><span style="width:24px;height:24px;border-radius:12px;display:grid;place-items:center;${c[field]===v?'background:var(--cobalt);color:#fff':'border:2px solid var(--line)'}">${c[field]===v?ic('check',13,3):''}</span></button>`).join('')}</div>`}
function nTime(k,field,label){const c=NS().cats[k];return timeRow(label,c[field],'nt_'+field,`NS().cats['${k}']['${field}']=this.value;$('#nt_${field}').textContent=fmtTime(this.value);const sm=$('#nSum');if(sm)sm.textContent=catSummary('${k}')`,true)}
GW.nt=([h,m,ap])=>{if(!NOPEN)return;const H=(+h)%12+(ap==='PM'?12:0),v=`${pad2(H)}:${pad2(+m)}`;NS().cats[NOPEN.k][NOPEN.f]=v;const e=$('#nt_'+NOPEN.f);if(e)e.textContent=fmtTime(v);const sm=$('#nSum');if(sm)sm.textContent=catSummary(NOPEN.k)};
function nToggle(k,field,label,sub){const c=NS().cats[k];return `<div class="li noic"><span class="grow"><b style="display:block">${label}</b>${sub?`<span class="sec small">${sub}</span>`:''}</span>${tgl(c[field],`S.notif.cats.${k}.${field}=!S.notif.cats.${k}.${field};refresh()`)}</div>`}
def('notif',{title:p=>NCAT[p.k][0],large:false,body:p=>{const k=p.k,c=NS().cats[k];let when='';
  if(k==='water')when=`${secHead('How often')}${nRadio('water','freq',Object.entries(FREQ).map(([v,l])=>[v,l,v==='behind'?'Checks every 2 hours and only reminds you if you\u2019re behind':'']))}
    <div class="list">${nTime('water','from',c.freq==='day'?'At':'From')}${c.freq==='day'?'':nTime('water','to','Until')}</div><p class="sec xs">No reminders outside these hours.</p>`;
  if(k==='food')when=`${secHead('When')}${nRadio('food','mode',[['before','Before each meal','A heads-up with what\u2019s on your plan'],['after','After each meal','A nudge to log what you ate'],['day','Once a day','One reminder in the evening']])}
    ${c.mode==='before'?`<div class="chips">${[15,30,60].map(v=>`<button class="chip ${c.before===v?'on':''}" onclick="S.notif.cats.food.before=${v};refresh()">${v===60?'1 hour':v+' min'} before</button>`).join('')}</div>`:''}
    <div class="list mt12">${nToggle('food','summary','Daily summary','Calories and protein left, in the evening')}${c.summary||c.mode==='day'?nTime('food','sumTime','Summary time'):''}</div>`;
  if(k==='workout')when=`${secHead('Remind me')}${nRadio('workout','before',[[0,'At workout time',''],[30,'30 min before',''],[60,'1 hour before','']])}<div class="list">${nToggle('workout','rest','Sound when rest ends','Plays your workout sound when the rest timer is done')}</div>`;
  if(k==='checkin')when=`${secHead('When')}<div class="list">${nTime('checkin','time','Every day at')}</div><p class="sec xs">Pick a time right after you usually wake up.</p>`;
  if(k==='sleep')when=`${secHead('When')}<div class="list">${nTime('sleep','time','Bedtime')}${nToggle('sleep','wind','Wind-down reminder','30 minutes before bedtime')}</div>`;
  if(k==='vitamins')when=`${secHead('When')}<div class="card small">Each vitamin reminds you at its own time.</div><button class="btn glass gb" onclick="go('vitamins')">${ic('pill',18)}Set times for each vitamin</button>`;
  if(k==='report')when=`${secHead('When')}<div class="chips">${WEEKLEFT.concat(['Sun','Mon','Tue']).map(d=>`<button class="chip ${c.day===d?'on':''}" onclick="S.notif.cats.report.day='${d}';refresh()">${d}</button>`).join('')}</div><div class="list mt12">${nTime('report','time','Time')}</div>`;
  if(k==='friends')when=`${secHead('Tell me when')}<div class="list">${nToggle('friends','prs','A friend hits a PR','')}${nToggle('friends','challenges','Challenge updates','When someone passes you on the leaderboard')}${nToggle('friends','cheers','Someone cheers you on','')}</div>`;
  return `<div class="card row"><span class="ico cobalt">${ic(NCAT[k][1],20)}</span><span class="grow"><b>${NCAT[k][0]} reminders</b><div class="sec small" id="nSum">${c.on?catSummary(k):'Off'}</div></span>${tgl(c.on,`S.notif.cats.${k}.on=!S.notif.cats.${k}.on;if(S.notif.cats.${k}.on)S.notif.on=true;refresh()`)}</div>
  <div style="${c.on?'':'opacity:.5'}">${when}
  ${secHead('Sound')}<div class="list">${NSOUNDS[k].map(sd=>`<div class="li noic" style="padding-right:8px"><button class="row grow" style="gap:12px;text-align:left" onclick="S.notif.cats.${k}.sound='${sd}';playSound('${sd}');refresh()" role="radio" aria-checked="${c.sound===sd}"><span style="width:24px;height:24px;border-radius:12px;flex:none;display:grid;place-items:center;${c.sound===sd?'background:var(--cobalt);color:#fff':'border:2px solid var(--line)'}">${c.sound===sd?ic('check',13,3):''}</span><span class="grow b">${SOUNDS[sd][0]}</span></button>${sd!=='none'?`<button class="nb" style="width:44px;height:44px;background:var(--inset)" aria-label="Play ${SOUNDS[sd][0]}" onclick="playSound('${sd}')">${ic('play',16)}</button>`:''}</div>`).join('')}</div>
