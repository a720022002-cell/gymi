<style>
:root{
  --bg:#FFFFFF;--card:#F4F4F5;--line:#E4E4E7;--text:#0A0A0B;--sec:#52525B;--cobalt:#3355FF;--link:#3355FF;
  --up:#15803D;--down:#DC2626;--btn:#0A0A0B;--btnText:#FFFFFF;--track:#E4E4E7;--pill:rgba(10,10,11,.07);--segon:#FFFFFF;
  --inset:#FFFFFF;--scrim:rgba(10,10,11,.22);--page:#E9E9EC;--macroC:#0A0A0B;--macroF:#71717A;
  --g-bg:rgba(255,255,255,.56);--g-sheet:rgba(250,250,251,.8);--g-border:rgba(255,255,255,.78);--g-hi:rgba(255,255,255,.95);
  --g-glow:rgba(255,255,255,.35);--g-shadow:0 10px 30px rgba(10,10,11,.10),0 1px 3px rgba(10,10,11,.06);
  --g-ai:rgba(232,236,255,.62);--g-aiborder:rgba(160,176,255,.55);
  --st:54px;--sb:0px;
  --spring:cubic-bezier(.34,1.45,.64,1);--ease:cubic-bezier(.2,.9,.25,1);
}
html.dark{
  --bg:#0A0A0B;--card:#18181B;--line:#27272A;--text:#FAFAFA;--sec:#A1A1AA;--link:#7088FF;
  --up:#22C55E;--down:#F87171;--btn:#FAFAFA;--btnText:#0A0A0B;--track:#27272A;--pill:rgba(255,255,255,.1);--segon:rgba(255,255,255,.16);
  --inset:#232327;--scrim:rgba(0,0,0,.45);--page:#050506;--macroC:#FAFAFA;--macroF:#A1A1AA;
  --g-bg:rgba(34,34,38,.52);--g-sheet:rgba(26,26,30,.8);--g-border:rgba(255,255,255,.13);--g-hi:rgba(255,255,255,.2);
  --g-glow:rgba(255,255,255,.04);--g-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --g-ai:rgba(40,52,122,.5);--g-aiborder:rgba(112,136,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--page);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---------- page shell ---------- */
.page{display:flex;height:100%;align-items:center;justify-content:center;gap:36px;padding:20px}
.side{width:290px;height:100%;max-height:868px;overflow:auto;scrollbar-width:thin;flex:none}
.side h2{font-family:Sora;font-weight:600;letter-spacing:-.03em;font-size:20px}
.maplogo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mapsec{margin-top:18px}
.mapsec h3{font-size:13px;font-weight:700;color:var(--sec);margin:0 0 6px 10px}
.mapsec button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:500}
.mapsec button:hover{background:var(--card)}
.ctl{background:var(--bg);border-radius:22px;padding:18px;margin-bottom:14px}
.ctl .row+.row{margin-top:12px}
.note{font-size:13px;color:var(--sec);line-height:1.5}
.phone{width:414px;height:868px;border-radius:66px;background:#0A0A0B;padding:12px;flex:none;box-shadow:0 0 0 2px #2a2a2e,0 40px 80px rgba(0,0,0,.25);transform-origin:center center;position:relative}
.app{width:390px;height:844px;border-radius:54px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);isolation:isolate}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 42px;font-weight:700;font-size:16px;pointer-events:none;font-family:Sora;letter-spacing:-.02em}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;border-radius:20px;background:#000;transform:translateX(-50%)}
.hind{position:absolute;bottom:8px;left:50%;width:136px;height:5px;border-radius:3px;background:var(--text);opacity:.85;transform:translateX(-50%);z-index:95;pointer-events:none}
.mapfab{display:none;position:fixed;z-index:200;right:0;top:42%;width:34px;height:64px;border-radius:18px 0 0 18px;align-items:center;justify-content:center}
.drawer{position:fixed;inset:0;z-index:300;display:none}
.drawer.open{display:block}
.drawer .scrim{opacity:1}
.drawer .dpanel{position:absolute;top:0;bottom:0;right:0;width:min(340px,88vw);background:var(--bg);overflow:auto;padding:20px 16px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
@media (max-width:1180px){.side{display:none}.mapfab{display:flex}}
body.bleed .page{padding:0}
body.bleed .phone{width:100vw;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
body.bleed .app{width:100%;height:100%;border-radius:0}
body.bleed .sbar,body.bleed .hind{display:none}
body.bleed{--st:max(10px,env(safe-area-inset-top));--sb:env(safe-area-inset-bottom)}

/* ---------- type ---------- */
.sora,.h1,.h2,.h3,.num,.lt{font-family:Sora;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num{font-feature-settings:"tnum"}
.lt{font-size:34px;line-height:1.1;margin:2px 0 18px}
.h1{font-size:28px;line-height:1.15}
.h2{font-size:21px;line-height:1.2}
.h3{font-size:17px;line-height:1.25}
.sec{color:var(--sec)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.link{color:var(--link);font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.cob{color:var(--cobalt)}
html.dark .cob{color:var(--link)}
.center{text-align:center}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.gap8{gap:8px}.gap4{gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sp{height:8px}
.hide{display:none!important}

/* ---------- liquid glass ---------- */
.glass{background:var(--g-bg);-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:.5px solid var(--g-border);box-shadow:inset 0 1px .5px var(--g-hi),inset 0 -.5px .5px var(--g-hi),inset 0 0 16px var(--g-glow),var(--g-shadow)}
.glass.ai{background:var(--g-ai);border-color:var(--g-aiborder)}
.glass.sheet{background:var(--g-sheet)}
.gb{transition:transform .45s var(--spring)}
.gb:active{transform:scale(1.08)}
.reduce .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card);border-color:var(--line);box-shadow:var(--g-shadow)}
.reduce .glass.sheet{background:var(--bg)}
.dk{--g-bg:rgba(30,30,34,.42);--g-border:rgba(255,255,255,.2);--g-hi:rgba(255,255,255,.28);--g-glow:rgba(255,255,255,.05);--text:#FAFAFA;--sec:#C4C4CC;--card:#1d1d21;--line:#333;color:#FAFAFA}

/* ---------- screens ---------- */
.stack{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--bg);transition:transform .5s var(--ease),filter .5s,opacity .3s;will-change:transform;overflow:hidden}
.screen.enter{transform:translateX(100%)}
.screen.under{transform:translateX(-26%);filter:brightness(.9)}
.screen.fade{opacity:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.content{padding:calc(var(--st) + 60px) 20px calc(140px + var(--sb))}
.content.full{padding-left:0;padding-right:0}
.nav{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(var(--st) + 2px) 12px 0;pointer-events:none}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 30px);background:linear-gradient(var(--bg) 45%,transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.nav.scrolled::before{opacity:.9}
.navbar{position:relative;height:52px;display:flex;align-items:center;gap:6px;border-radius:26px;padding:0 4px;pointer-events:auto;border:.5px solid transparent;transition:background .35s,box-shadow .35s,border-color .35s}
.nt{flex:1;text-align:center;font-family:Sora;font-weight:600;letter-spacing:-.02em;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
.nav.large:not(.scrolled) .nt{opacity:0}
.nl,.nr{display:flex;gap:6px;min-width:44px}
.nr{justify-content:flex-end}
.nb{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;border:.5px solid transparent;flex:none}
.nb.txt{width:auto;padding:0 16px;font-weight:700;font-size:15px}
.nav.scrolled .nb{background:transparent!important;box-shadow:none!important;border-color:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

/* ---------- tab bar & AI button ---------- */
.tabbar{position:absolute;left:12px;width:calc(100% - 92px);bottom:calc(24px + var(--sb));height:64px;border-radius:32px;display:flex;align-items:center;padding:4px;z-index:40;overflow:hidden;transition:width .6s var(--spring),height .5s var(--spring),bottom .5s var(--spring),padding .4s}
.tab{flex:1 1 0;min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:700;color:var(--text);position:relative;z-index:1;border-radius:28px;white-space:nowrap;transition:color .3s,flex .55s var(--spring),opacity .25s,height .4s}
.tab.on{color:var(--cobalt)}
html.dark .tab.on{color:var(--link)}
.tab span{transition:opacity .2s,max-height .3s;max-height:16px;overflow:hidden;letter-spacing:-.01em}
.tabpill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:28px;background:var(--pill);transition:transform .55s var(--spring),opacity .2s}
/* scrolled down: collapse to the active tab's icon only */
.tabbar.mini{width:54px;height:54px;padding:0;bottom:calc(18px + var(--sb));cursor:pointer}
.tabbar.mini .tab{height:54px}
.tabbar.mini .tab:not(.on){flex:0 0 0;opacity:0;pointer-events:none}
.tabbar.mini .tab span{opacity:0;max-height:0}
.tabbar.mini .tabpill{opacity:0}
.aibtn{position:absolute;right:12px;bottom:calc(26px + var(--sb));width:60px;height:60px;border-radius:30px;display:grid;place-items:center;z-index:40;transition:all .55s var(--spring)}
.tabbar.mini~.aibtn{bottom:calc(18px + var(--sb));width:54px;height:54px}
.notabs .tabbar,.notabs .aibtn{transform:translateY(130px);opacity:0;pointer-events:none}

/* ---------- solid components ---------- */
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;position:relative}
.card.tap{cursor:pointer;transition:transform .3s var(--spring)}
.card.tap:active{transform:scale(.985)}
.card.flat{padding:0;overflow:hidden}
.inset{background:var(--inset);border-radius:16px;padding:12px 14px}
.btn{height:52px;border-radius:26px;width:100%;background:var(--btn);color:var(--btnText);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .35s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.glass{background:var(--g-bg);color:var(--text)}
.chip.glass:not(.on){background:var(--g-bg)}
.reduce .btn.glass,.reduce .chip.glass:not(.on){background:var(--card)}
.btn.cobalt{background:var(--cobalt);color:#fff}
.btn.danger{background:var(--down);color:#fff}
.btn.soft{background:var(--card);color:var(--text)}
.btn.sm{height:40px;font-size:14px;width:auto;padding:0 14px;border-radius:20px;white-space:nowrap}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{min-height:38px;padding:0 15px;border-radius:19px;background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .35s var(--spring),background .2s,color .2s;white-space:nowrap}
.chip:active{transform:scale(1.05)}
.chip.on{background:var(--text);color:var(--bg)}
.chip.glass.on{background:var(--text);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px}
.chips.scrollx::-webkit-scrollbar{display:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:8px;border:2px solid transparent;transition:border-color .2s,transform .3s var(--spring)}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--cobalt)}
.opt .dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on .dot{border-color:var(--cobalt);background:var(--cobalt);color:#fff}
.seg{display:flex;padding:4px;border-radius:24px;gap:2px}
.seg button{flex:1;height:38px;border-radius:19px;font-weight:700;font-size:14px;color:var(--sec);transition:background .35s var(--spring),color .2s,transform .35s var(--spring)}
.seg button.on{background:var(--segon);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button:active{transform:scale(1.04)}
.seg.solid{background:var(--card)}
.field{background:var(--card);border-radius:16px;height:52px;padding:0 16px;width:100%;border:1.5px solid transparent;outline:none;font-size:16px;transition:border-color .2s}
textarea.field{height:auto;min-height:96px;padding:14px 16px;resize:none;line-height:1.45}
.field:focus{border-color:var(--cobalt)}
.field.bad{border-color:var(--down)}
.label{font-size:13px;font-weight:700;color:var(--sec);margin:16px 4px 6px;display:block}
.err{color:var(--down);font-size:12.5px;margin:6px 4px 0;font-weight:600}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--track);position:relative;transition:background .3s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,1);transition:transform .45s var(--spring),width .25s}
.toggle:active::after{width:34px}
.toggle.on{background:var(--cobalt)}
.toggle.on::after{transform:translateX(20px)}
.toggle.on:active::after{transform:translateX(13px)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar.thick{height:10px;border-radius:5px}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .9s var(--spring)}
.list{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;text-align:left;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.li.noic+.li.noic::before,.list.plain .li+.li::before{left:16px}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--inset);flex:none}
.ico.cobalt{background:var(--cobalt);color:#fff}
.av{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-family:Sora;font-weight:600;font-size:15px;color:#fff;flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:22px;background:var(--card);display:grid;place-items:center;transition:transform .35s var(--spring)}
.stepper button:active{transform:scale(1.1)}
.warnchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:rgba(220,38,38,.1);color:var(--down);font-size:12px;font-weight:700}
.okchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:rgba(51,85,255,.1);color:var(--cobalt);font-size:12px;font-weight:700}
html.dark .okchip{color:var(--link);background:rgba(112,136,255,.14)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:var(--inset);font-size:12px;font-weight:700;color:var(--sec)}
.divider{height:1px;background:var(--line);margin:14px 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sechead h3{font-family:Sora;font-weight:600;letter-spacing:-.02em;font-size:19px}
.sechead button{color:var(--link);font-weight:700;font-size:14px}
.macro .bar i.p{background:var(--cobalt)}.macro .bar i.c{background:var(--macroC)}.macro .bar i.f{background:var(--macroF)}
.empty{text-align:center;padding:26px 18px}
.progdots{display:flex;gap:6px;margin:0 0 18px}
.progdots i{flex:1;height:4px;border-radius:2px;background:var(--track);transition:background .3s}
.progdots i.on{background:var(--cobalt)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring>svg{position:absolute;inset:0}
.ring .rf{transition:stroke-dashoffset 1.1s var(--ease)}
.ri{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.lifted{transform:scale(1.03);box-shadow:0 16px 30px rgba(0,0,0,.16);z-index:5;position:relative}
.handle{touch-action:none;cursor:grab;width:44px;height:44px;display:grid;place-items:center;color:var(--sec);flex:none}
.dropt{outline:2px dashed var(--cobalt);outline-offset:-2px}
.bubble{max-width:82%;padding:11px 15px;border-radius:22px;margin-bottom:8px;line-height:1.45;animation:pop .45s var(--spring)}
.bubble.me{margin-left:auto;background:var(--text);color:var(--bg);border-bottom-right-radius:8px}
.bubble.ai{background:var(--card);border-bottom-left-radius:8px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.photo{border-radius:18px;background:var(--inset);aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden}
.kbd{font-family:Sora;font-weight:600;font-size:44px;letter-spacing:-.04em;line-height:1}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.setrow input{height:44px;border-radius:12px;background:var(--inset);border:1.5px solid transparent;text-align:center;font-family:Sora;font-weight:600;font-size:17px;width:100%;outline:none;font-variant-numeric:tabular-nums}
.setrow input:focus{border-color:var(--cobalt)}
.setrow input::placeholder{color:var(--sec);opacity:.55}
.setrow .ck{width:44px;height:44px;border-radius:22px;background:var(--inset);display:grid;place-items:center;color:var(--sec);transition:all .35s var(--spring)}
.setrow .ck.on{background:var(--cobalt);color:#fff}
.setrow.done input{color:var(--sec)}
.daybox{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;gap:8px;min-height:64px;padding:8px 6px 8px 14px;background:var(--card);border-radius:18px;margin-bottom:8px}
.wchip{height:44px;border-radius:14px;background:var(--inset);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;touch-action:none;cursor:grab;transition:box-shadow .2s}
.wchip.rest{background:transparent;color:var(--sec);font-weight:600;border:1.5px dashed var(--line)}
.wchip.drag{box-shadow:0 14px 30px rgba(0,0,0,.2);z-index:30;position:relative;transition:none}
.camera{position:absolute;inset:0;background:#0d0d10;overflow:hidden}
.scanline{position:absolute;left:12%;right:12%;height:2px;background:#7088FF;box-shadow:0 0 12px #3355FF;animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:36%}50%{top:56%}}
.paper{background:#fff;color:#0A0A0B;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 6px;border-radius:20px;background:var(--card)}
.floatbar{position:absolute;left:16px;right:16px;bottom:calc(24px + var(--sb));z-index:30;border-radius:32px;padding:8px;display:flex;gap:8px;align-items:center}

/* ---------- overlays ---------- */
.layer{position:absolute;inset:0;z-index:60;pointer-events:none}
.layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .35s}
.layer.open .scrim{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sb));max-height:calc(100% - var(--st) - 16px);border-radius:40px;transform:translateY(115%);transition:transform .6s var(--spring);display:flex;flex-direction:column;overflow:hidden}
.layer.open .sheet{transform:none}
.sheet.dragging{transition:none}
.grab{height:30px;flex:none;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--sec);opacity:.45}
.sheetc{overflow-y:auto;padding:0 20px 24px;scrollbar-width:none}
.sheetc .card,.alert .card{background:rgba(127,127,135,.1)}
.sheetc .field,.sheetc .chip,.sheetc .opt,.sheetc .stepper button,.alert .chip{background:rgba(127,127,135,.12)}
.sheetc .chip.on,.alert .chip.on{background:var(--text);color:var(--bg)}
.sheetc .inset{background:rgba(127,127,135,.1)}
.alert{position:absolute;left:22px;right:22px;top:50%;border-radius:34px;padding:24px 20px 16px;transform:translateY(-50%) scale(1.12);opacity:0;transition:transform .5s var(--spring),opacity .25s}
.layer.open .alert{transform:translateY(-50%) scale(1);opacity:1}
.alert .btn{height:48px;font-size:15px;margin-top:8px}
.toast{position:absolute;left:14px;right:14px;bottom:calc(104px + var(--sb));min-height:56px;border-radius:28px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;z-index:80;transform:translateY(24px) scale(.96);opacity:0;transition:transform .5s var(--spring),opacity .25s;pointer-events:none;font-weight:600;font-size:14.5px}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.notif{position:absolute;left:10px;right:10px;top:calc(var(--st) - 2px);border-radius:26px;padding:12px 14px;z-index:85;display:flex;gap:12px;align-items:center;transform:translateY(calc(-100% - 70px));transition:transform .6s var(--spring);cursor:pointer}
.notif.show{transform:none}
.offline{position:absolute;left:14px;right:14px;top:calc(var(--st) + 60px);z-index:75;border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;transform:translateY(-20px);opacity:0;transition:all .5s var(--spring);pointer-events:none}
.offline.show{transform:none;opacity:1;pointer-events:auto}
.timer{position:absolute;left:12px;right:12px;bottom:calc(16px + var(--sb));z-index:65;border-radius:38px;padding:22px 20px 18px;transform:translateY(120%);transition:transform .6s var(--spring)}
.timer.show{transform:none}
.listen{position:absolute;left:50%;bottom:calc(110px + var(--sb));transform:translateX(-50%) scale(.8);opacity:0;z-index:66;border-radius:26px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-weight:600;transition:all .45s var(--spring);white-space:nowrap}
.listen.show{transform:translateX(-50%) scale(1);opacity:1}
.wave i{display:inline-block;width:3px;height:14px;margin:0 1.5px;border-radius:2px;background:var(--cobalt);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{50%{transform:scaleY(.35)}}
.welcomebg{position:absolute;inset:0;overflow:hidden;pointer-events:none}

/* iOS-style wheel picker */
.wheel{position:relative;height:220px;display:flex;justify-content:center;align-items:center;gap:2px;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);perspective:600px}
.wband{position:absolute;left:14px;right:14px;top:88px;height:44px;border-radius:12px;background:var(--pill);pointer-events:none}
.wcol{height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;position:relative;z-index:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wcol::-webkit-scrollbar{display:none}
.wcol div{height:44px;scroll-snap-align:center;display:grid;place-items:center;font-family:Sora;font-weight:600;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--sec);transition:color .15s;cursor:pointer}
.wcol div.sel{color:var(--text)}
.wsep,.wunit{position:relative;z-index:1;font-family:Sora;font-weight:600;font-size:26px}
.wunit{font-size:17px;color:var(--sec);margin-left:6px;width:30px}

/* cheer celebration */
.actc{position:relative;transition:background .5s,box-shadow .5s}
.actc.flash{z-index:5}
.sweepwrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.actc.on{background:linear-gradient(135deg,rgba(51,85,255,.16),rgba(112,136,255,.08));box-shadow:inset 0 0 0 1.5px rgba(51,85,255,.35)}
.actc.flash{animation:cheerPop .6s var(--spring)}
.sweepwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(112,136,255,.55) 45%,rgba(255,255,255,.75) 50%,rgba(112,136,255,.55) 55%,transparent 75%);animation:cheerSweep .9s ease forwards;pointer-events:none}
@keyframes cheerSweep{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes cheerPop{40%{transform:scale(1.035)}}
.cheerbtn{transition:background .3s,color .3s,transform .4s var(--spring)}
.cheerbtn.on{background:var(--cobalt)!important;color:#fff!important}
.cheerbtn.pop svg{animation:heartPop .55s var(--spring)}
@keyframes heartPop{40%{transform:scale(1.7) rotate(-12deg)}}
.cheerbits{position:absolute;pointer-events:none;width:0;height:0}

/* protein slider with a marked common range */
.pks{position:relative;height:44px;margin-top:14px}
.pks .tr{position:absolute;left:14px;right:14px;top:19px;height:6px;border-radius:3px;background:var(--track)}
.pks .band{position:absolute;top:15px;height:14px;border-radius:7px;background:rgba(34,197,94,.28);border:1.5px solid rgba(21,128,61,.45)}
.pks .tick{position:absolute;top:10px;width:2px;height:24px;border-radius:1px;background:var(--up);transform:translateX(-1px)}
.pks input{position:absolute;inset:0;width:100%;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.pks input::-webkit-slider-runnable-track{height:44px;background:transparent}
.pks input::-moz-range-track{background:transparent}
.pks input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:8px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.06)}
.pks input::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pks .lab{position:absolute;top:46px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--up)}
.card .chip:not(.on),.inset .chip:not(.on),.sheet .card .chip:not(.on){background:var(--bg)}

#phone[dir=rtl]{font-family:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif}
#phone[dir=rtl] .sora,#phone[dir=rtl] .kbd,#phone[dir=rtl] .h1,#phone[dir=rtl] .h2,#phone[dir=rtl] .h3{font-family:'IBM Plex Sans Arabic','Sora',system-ui,sans-serif}
#phone[dir=rtl] .num{font-family:'Sora','IBM Plex Sans Arabic',sans-serif}
#phone[dir=rtl] .ic-back,#phone[dir=rtl] .ic-chev{transform:scaleX(-1)}
#phone[dir=rtl] .tabpill{left:auto;right:4px}
#phone[dir=rtl] [style*="text-align:left"]{text-align:right!important}
#phone[dir=rtl] .right{text-align:left}
#phone[dir=rtl] input[type=email],#phone[dir=rtl] input[type=tel],#phone[dir=rtl] input[inputmode=numeric],#phone[dir=rtl] input[inputmode=decimal]{direction:ltr;text-align:right}
</style>
</head>
<body>
<div class="page">
  <aside class="side" id="leftSide"></aside>
  <div class="phone" id="phone">
    <div class="app" id="app">
      <div class="sbar"><span>9:41</span><div class="island"></div><span id="sbIcons"></span></div>
      <div class="stack" id="stack"></div>
      <nav class="tabbar glass" id="tabbar"></nav>
      <button class="aibtn glass ai gb" id="aibtn" aria-label="Open AI coach" onclick="openAI()"></button>
      <div class="offline glass" id="offline"></div>
      <div class="toast glass" id="toast"></div>
      <div class="notif glass" id="notif"></div>
      <div class="listen glass ai" id="listen"></div>
      <div class="layer" id="sheetLayer"><div class="scrim" onclick="closeSheet()"></div><div class="sheet glass" id="sheet"><div class="grab" id="grab"></div><div class="sheetc" id="sheetc"></div></div></div>
      <div class="layer" id="alertLayer"><div class="scrim"></div><div class="alert glass" id="alert"></div></div>
      <div class="hind"></div>
    </div>
  </div>
  <aside class="side" id="rightSide"></aside>
</div>
<button class="mapfab glass" id="mapfab" aria-label="Open screen map" onclick="openDrawer()"></button>
<div class="drawer" id="drawer"><div class="scrim" onclick="closeDrawer()"></div><div class="dpanel" id="dpanel"></div></div>
<script>
/* =====================================================
   GYMI PROTOTYPE · core
===================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=n=>Math.round(n).toLocaleString('en-US');
const fx=(n,d=1)=>(+n).toFixed(d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const NUM_RE=/\d[\d,.]*/g;
function arT(t){const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(t),core=m[2];if(!core||!/[A-Za-z]/.test(core))return null;let r=AR[core];if(r)return m[1]+r+m[3];
  const nums=core.match(NUM_RE)||[],key=core.replace(NUM_RE,'#');r=AR[key];if(!r)return null;let k=0;return m[1]+r.replace(/#/g,()=>nums[k++]??'')+m[3]}
function arNode(n){if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest('svg,script,style,textarea,[data-notr]'))return;if(n.__arv===n.nodeValue)return;const t=arT(n.nodeValue);if(t!=null){n.__en=n.nodeValue;n.nodeValue=t;n.__arv=t}return}
  if(n.nodeType!==1||n.closest('svg,[data-notr]'))return;['placeholder','aria-label','title'].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v&&!n.hasAttribute('data-en-'+a)){const t=arT(v);if(t!=null){n.setAttribute('data-en-'+a,v);n.setAttribute(a,t)}}});
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let x;while(x=w.nextNode()){if(x.nodeType===3)arNode(x);else ['placeholder','aria-label','title'].forEach(a=>{const v=x.getAttribute(a);if(v&&!x.hasAttribute('data-en-'+a)){const t=arT(v);if(t!=null){x.setAttribute('data-en-'+a,v);x.setAttribute(a,t)}}})}}
let AROBS=null;
function applyLang(){const ph=document.getElementById('phone'),ar=S.settings.lang==='ar';ph.setAttribute('dir',ar?'rtl':'ltr');ph.setAttribute('lang',ar?'ar':'en');document.body.classList.toggle('lang-ar',ar);
  if(ar){arNode(ph);if(!AROBS){AROBS=new MutationObserver(ms=>{if(S.settings.lang!=='ar')return;for(const m of ms){if(m.type==='characterData')arNode(m.target);else m.addedNodes.forEach(arNode)}});AROBS.observe(ph,{childList:true,subtree:true,characterData:true})}}
  else{const w=document.createTreeWalker(ph,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode())if(x.__en!=null&&x.nodeValue===x.__arv){x.nodeValue=x.__en;x.__arv=null}ph.querySelectorAll('[data-en-placeholder],[data-en-aria-label],[data-en-title]').forEach(e=>['placeholder','aria-label','title'].forEach(a=>{if(e.hasAttribute('data-en-'+a)){e.setAttribute(a,e.getAttribute('data-en-'+a));e.removeAttribute('data-en-'+a)}}))}

/* brand ring mark: ~80% closed, rounded ends, gap at top-left */
function mark(size=28,color='var(--cobalt)',sw){sw=sw||size*.2;const r=(size-sw)/2,C=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*.8} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function logo(h=30,textColor='var(--text)'){return `<div class="row" style="gap:${h*.3}px"><span style="display:grid">${mark(h*1.02,'var(--cobalt)',h*.22)}</span><span class="sora" style="font-size:${h*1.28}px;line-height:1;color:${textColor};letter-spacing:-.045em;font-weight:600;margin-top:-${h*.12}px">gymi</span></div>`}
function spinner(size=44){return `<span class="spin" style="display:inline-grid">${mark(size,'var(--cobalt)',size*.18)}</span>`}

/* progress ring with value memory so it animates from the last value */
const RP={};
function ring({id,v,max,size=180,sw=16,color='var(--cobalt)',track='var(--track)',inner=''}){
  const r=(size-sw)/2,C=2*Math.PI*r,p=max>0?clamp(v/max,0,1):0,prev=RP[id]??0;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle class="rf" data-rid="${id}" data-p="${p}" data-c="${C}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-prev)}" transform="rotate(-90 ${size/2} ${size/2})" ${p===0&&prev===0?'opacity="0"':''}/></svg><div class="ri">${inner}</div></div>`}
const BP={};
function bar(id,v,max,cls='',thick=false,color){const p=max>0?clamp(v/max,0,1)*100:0,prev=BP[id]??0;return `<div class="bar ${thick?'thick':''}"><i class="${cls}" data-bid="${id}" data-w="${p}" style="width:${prev}%;${color?`background:${color}`:''}"></i></div>`}
function animate(root){requestAnimationFrame(()=>requestAnimationFrame(()=>{
  $$('.rf',root).forEach(c=>{const p=+c.dataset.p,C=+c.dataset.c;c.removeAttribute('opacity');c.style.strokeDashoffset=C*(1-p);RP[c.dataset.rid]=p;if(p===0)c.setAttribute('opacity','0')});
  $$('[data-bid]',root).forEach(b=>{b.style.width=b.dataset.w+'%';BP[b.dataset.bid]=+b.dataset.w});
}))}

/* charts */
function lineChart(vals,{w=350,h=150,labels=[],color='var(--cobalt)',min,max,id='lc',dots=true,fill=true}={}){
  if(!vals.length)return '';
  const lo=min??Math.min(...vals),hi=max??Math.max(...vals),pad=(hi-lo)*.2||1,a=lo-pad,b=hi+pad,top=10,bot=labels.length?24:8;
  const X=i=>vals.length===1?w/2:8+i*(w-16)/(vals.length-1),Y=v=>top+(h-top-bot)*(1-(v-a)/(b-a));
  let d='';vals.forEach((v,i)=>{const x=X(i),y=Y(v);if(!i)d=`M${x},${y}`;else{const px=X(i-1),py=Y(vals[i-1]),cx=(px+x)/2;d+=` C${cx},${py} ${cx},${y} ${x},${y}`}});
  const area=`${d} L${X(vals.length-1)},${h-bot} L${X(0)},${h-bot}Z`;
  const li=vals.length-1;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;overflow:visible"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3355FF" stop-opacity=".16"/><stop offset="1" stop-color="#3355FF" stop-opacity="0"/></linearGradient></defs>${fill?`<path d="${area}" fill="url(#g${id})"/>`:''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" pathLength="1" class="draw"/>${dots?`<circle cx="${X(li)}" cy="${Y(vals[li])}" r="5" fill="${color}" stroke="var(--bg)" stroke-width="2.5"/>`:''}${labels.map((l,i)=>l?`<text x="${X(i)}" y="${h-4}" text-anchor="middle" font-size="11" font-family="Manrope" font-weight="600" fill="var(--sec)">${l}</text>`:'').join('')}</svg>`}
function barChart(vals,{w=350,h=150,labels=[],max,hl=-1,goal,fmtv}={}){
  const m=max||Math.max(...vals,1)*1.15,n=vals.length,bw=Math.min(26,(w/n)*.5),bot=24;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${goal?`<line x1="0" x2="${w}" y1="${(h-bot)*(1-goal/m)}" y2="${(h-bot)*(1-goal/m)}" stroke="var(--sec)" stroke-dasharray="3 5" opacity=".5"/>`:''}${vals.map((v,i)=>{const x=(i+.5)*w/n,bh=Math.max(4,(h-bot-6)*(v/m));return `<rect x="${x-bw/2}" y="${h-bot-bh}" width="${bw}" height="${bh}" rx="${bw/2}" fill="${i===hl?'var(--cobalt)':'var(--track)'}"><animate attributeName="height" from="0" to="${bh}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${h-bot}" to="${h-bot-bh}" dur=".7s" fill="freeze"/></rect><text x="${x}" y="${h-6}" text-anchor="middle" font-size="11" font-weight="600" font-family="Manrope" fill="var(--sec)">${labels[i]||''}</text>`}).join('')}</svg>`}

function bmr(){const {weight}=S.food,{height,age,gender}=S.user;return 10*weight+6.25*height-5*age+(gender==='Female'?-161:5)}
function calcPlan(){
  const f=S.food;let t=bmr()*ACTF[f.activity]+(f.sun?120:0)+GOALADJ[f.goal];
  f.kcal=Math.round(t/10)*10;
  f.perKg=[1.8,1.8,1.6,2.2,2.0][f.goal];
  f.carbG=null;f.fatG=null;f.water=Math.round((f.weight*35+(f.sun?700:0)+(f.activity>=2?300:0))/100)*100;
  const [sh,sm]=(f.noWork?'09:00':f.workStart).split(':').map(Number),[eh,em]=(f.noWork?'17:00':f.workEnd).split(':').map(Number);
  const tt=(h,m)=>`${String((h+24)%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const lunch=Math.round((sh+eh)/2);
  f.meals=[{n:'Breakfast',t:tt(sh-1,sm===0?15:0)},{n:'Lunch',t:tt(lunch,30)},{n:'Pre-workout',t:tt(eh,30)},{n:'Dinner',t:tt(eh+3,30)}];
  f.workoutTime=tt(eh+1,30);f.intensity=f.goal>=3?'Moderate, keep volume high':'Moderate to hard';
  f.pick={};
}

const SCR={};let NAV=[];const TABS=['home','food','train','progress','friends'];
function def(id,o){SCR[id]=o}
function screenHTML(e){
  const d=SCR[e.id],p=e.p||{};
  const title=typeof d.title==='function'?d.title(p):(d.title||'');
  const large=d.large!==false&&!!title&&!d.bare;
  const backBtn=d.back!==false&&!TABS.includes(e.id)&&!d.noBack;
  const right=d.right?d.right(p):'';
  if(d.bare)return `<div class="scroll">${d.body(p)}</div>${d.float?d.float(p):''}`;
  return `<div class="nav ${large?'large':''}"><div class="navbar"><div class="nl">${d.left?d.left(p):backBtn?`<button class="nb glass gb" aria-label="Back" onclick="back()">${ic('back')}</button>`:''}</div><div class="nt">${title}</div><div class="nr">${right}</div></div></div>
  <div class="scroll"><div class="content ${d.full?'full':''}">${large?(d.pre?d.pre(p):'')+`<h1 class="lt">${title}</h1>`:''}${d.body(p)}</div></div>${d.float?d.float(p):''}`;
}
function wire(el,e){
  const sc=$('.scroll',el);let last=0;
  if(sc)sc.addEventListener('scroll',()=>{const y=sc.scrollTop;const nav=$('.nav',el);
    if(nav){const s=y>24;if(s!==nav.classList.contains('scrolled')){nav.classList.toggle('scrolled',s);$('.navbar',nav).classList.toggle('glass',s)}}
    if(el===topEl()){const tb=$('#tabbar');if(y>last+6&&y>60)tb.classList.add('mini');else if(y<last-6||y<20)tb.classList.remove('mini')}
    last=y},{passive:true});
  const d=SCR[e.id];if(d.after)d.after(el,e.p||{});animate(el);
}
const topEl=()=>$('#stack').lastElementChild;
function mount(e){const el=document.createElement('div');el.className='screen';el.dataset.id=e.id;el.innerHTML=screenHTML(e);$('#stack').appendChild(el);wire(el,e);return el}
function updateChrome(){const e=NAV[NAV.length-1];const d=SCR[e.id];$('#app').classList.toggle('notabs',!d.tabs);$('#tabbar').classList.remove('mini');renderTabbar()}
function go(id,p={}){const prev=topEl();const e={id,p};NAV.push(e);const el=mount(e);el.classList.add('enter');el.getBoundingClientRect();requestAnimationFrame(()=>{el.classList.remove('enter');if(prev)prev.classList.add('under')});updateChrome()}
function replace(id,p={}){const prev=topEl();NAV.pop();NAV.push({id,p});const el=mount(NAV[NAV.length-1]);el.classList.add('fade');requestAnimationFrame(()=>{el.classList.remove('fade')});setTimeout(()=>prev&&prev.remove(),320);updateChrome()}
function back(){if(NAV.length<2)return;const cur=topEl();NAV.pop();const prevEl=cur.previousElementSibling;if(prevEl){rerender(prevEl,NAV[NAV.length-1]);prevEl.classList.remove('under')}cur.classList.add('enter');setTimeout(()=>cur.remove(),480);updateChrome();stopTimer()}
function reset(stack){$('#stack').innerHTML='';NAV=[];stack.forEach((e,i)=>{if(typeof e==='string')e={id:e,p:{}};NAV.push(e);const el=mount(e);if(i<stack.length-1)el.classList.add('under')});const t=topEl();t.classList.add('fade');requestAnimationFrame(()=>t.classList.remove('fade'));updateChrome()}
function tabTap(id){const tb=$('#tabbar');if(tb.classList.contains('mini')){tb.classList.remove('mini');return}tab(id)}
function tab(id){$('#tabbar').classList.remove('mini');if(NAV[0]?.id===id&&NAV.length===1){const sc=$('.scroll',topEl());sc&&sc.scrollTo({top:0,behavior:'smooth'});return}reset([id])}
function rerender(el,e){const sc=$('.scroll',el),y=sc?sc.scrollTop:0;el.innerHTML=screenHTML(e);wire(el,e);const s2=$('.scroll',el);if(s2){s2.scrollTop=y;if(y>24){const nav=$('.nav',el);nav&&(nav.classList.add('scrolled'),$('.navbar',nav).classList.add('glass'))}}}

function renderAlert(){const o=ALERT;if(!o)return;$('#alert').innerHTML=`${o.icon?`<div style="display:grid;place-items:center;margin-bottom:10px" class="${o.iconCls||'cob'}">${o.icon}</div>`:''}<div class="h3 center">${o.title}</div>${o.body?`<div class="center sec mt8" style="font-size:14.5px">${o.body}</div>`:''}${o.html?o.html():''}<div class="mt12">${o.actions.map((a,i)=>`<button class="btn ${a.cls||''}" ${a.disabled?'disabled':''} onclick="alertAct(${i})">${a.label}</button>`).join('')}</div>`}
function alertAct(i){const a=ALERT.actions[i];closeAlert();a.fn&&a.fn()}
function closeAlert(){$('#alertLayer').classList.remove('open');ALERT=null}

/* ---------- toast / notification / offline ---------- */
let toastT;
function toast(msg,{undo,ai,icon,action}={}){const t=$('#toast');t.classList.toggle('ai',!!ai);t.innerHTML=`<span style="display:grid" class="${ai?'':'cob'}">${ai?mark(22,'var(--cobalt)',4.5):ic(icon||'check',20,2.2)}</span><span class="grow">${msg}</span>${undo||action?`<button class="btn sm soft" style="background:transparent;color:var(--link)" id="undoBtn">${action?action.label:'Undo'}</button>`:''}`;
  if(action)$('#undoBtn').onclick=()=>{t.classList.remove('show');action.fn()};
  else if(undo)$('#undoBtn').onclick=()=>{undo();t.classList.remove('show');refresh();toast('Undone',{icon:'swap'})};
  t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),undo||action?5200:2600)}
let notifT;
function notify(title,body,{icon='bell',onTap}={}){const n=$('#notif');n.innerHTML=`<div class="ico cobalt" style="border-radius:10px;width:40px;height:40px">${icon==='ring'?mark(22,'#fff',4.5):ic(icon,20,2)}</div><div class="grow"><div class="row between"><b style="font-size:14px">${title}</b><span class="xs sec">now</span></div><div style="font-size:14px;line-height:1.35">${body}</div></div>`;n.onclick=()=>{n.classList.remove('show');onTap&&onTap()};n.classList.add('show');clearTimeout(notifT);notifT=setTimeout(()=>n.classList.remove('show'),4800)}
function setOffline(off){S.online=!off;const o=$('#offline');o.innerHTML=`${ic('wifioff',20,2)}<span class="grow">You're offline. Your workout is saved and will sync later.</span><button class="nb" style="width:32px;height:32px" onclick="setOffline(false)" aria-label="Dismiss">${ic('close',16,2.2)}</button>`;o.classList.toggle('show',off);if(!off&&o.dataset.was)toast('Back online. Everything is synced.',{icon:'check'});o.dataset.was=off?'1':''}

function tgl(on,fn){return `<button class="toggle ${on?'on':''}" role="switch" aria-checked="${on}" onclick="${fn}"></button>`}
function seg(opts,cur,fn,cls='glass'){return `<div class="seg ${cls}">${opts.map((o,i)=>`<button class="${(typeof cur==='number'?i===cur:o===cur)?'on':''}" onclick="${fn}(${typeof cur==='number'?i:`'${o}'`})">${o}</button>`).join('')}</div>`}

/* generic pointer sortable (lists & grids) */
function sortable(container,onDone){
  container.addEventListener('pointerdown',e=>{
    const h=e.target.closest('[data-handle]');if(!h||!container.contains(h))return;
    const item=h.closest('[data-key]');e.preventDefault();item.classList.add('lifted');h.setPointerCapture(e.pointerId);
    const move=ev=>{for(const x of $$('[data-key]',container)){if(x===item)continue;const r=x.getBoundingClientRect();if(ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom){const all=$$('[data-key]',container);if(all.indexOf(x)>all.indexOf(item))x.after(item);else x.before(item);break}}};
    const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);item.classList.remove('lifted');onDone($$('[data-key]',container).map(x=>x.dataset.key))};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}

function pwError(v){if(!v||v.length<8)return 'Use at least 8 characters.';if(!/[A-Za-z]/.test(v)||!/\d/.test(v))return 'Use at least one letter and one number.';return ''}
function pwMeter(v){const sc=pwScore(v),lab=['','Weak','Okay','Strong'][sc],col=['var(--track)','var(--down)','#D97706','var(--up)'][sc];return `<div class="row mt8" style="gap:4px">${[1,2,3].map(i=>`<i style="flex:1;height:4px;border-radius:2px;background:${i<=sc?col:'var(--track)'}"></i>`).join('')}</div><div class="xs b mt4" style="color:${sc?col:'var(--sec)'}">${v?lab+' password':'At least 8 characters, with a letter and a number'}</div>`}
function pwField(key,label,err,ac='new-password',store='F',meter){if(meter===undefined)meter=ac==='new-password';const v=(store==='F'?F:SHEET.p)[key]||'';return `<label class="label" for="pw_${key}">${label}</label><div class="field row ${err?'bad':''}" style="gap:4px;padding-right:4px"><input id="pw_${key}" type="password" autocomplete="${ac}" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:48px" value="${esc(v)}" oninput="${store}.${key}=this.value;${meter?`$('#pwm_${key}').innerHTML=pwMeter(this.value);`:''}${store==='F'&&(key==='pw'||key==='pw2')?'pwMatch()':''}" ${key==='pw2'?`onblur="pwMatch(true)"`:''}><button class="nb" style="width:44px;height:44px" aria-label="Show password" onclick="const i=$('#pw_${key}');i.type=i.type==='password'?'text':'password';this.innerHTML=i.type==='password'?ic('eye',20):ic('eyeoff',20)"><span class="sec">${ic('eye',20)}</span></button></div>${meter?`<div id="pwm_${key}">${pwMeter(v)}</div>`:''}${key==='pw2'?`<div class="small b" id="pwMatch" style="margin:6px 4px 0;min-height:18px">${err?`<span class="down">${err}</span>`:pwMatchHTML()}</div>`:err?`<div class="err">${err}</div>`:''}`}
function pwMatchHTML(final){const a=F.pw||'',b=F.pw2||'';if(!b)return '';if(a===b)return `<span class="up row" style="gap:4px;display:inline-flex">${ic('check',15,2.6)}Passwords match</span>`;if(final||b.length>=a.length||!a.startsWith(b))return `<span class="down">Passwords don\u2019t match</span>`;return ''}
function pwMatch(final){const e=$('#pwMatch');if(e)e.innerHTML=pwMatchHTML(final);const i=$('#pw_pw2');if(i)i.parentElement.classList.toggle('bad',!!(F.pw2&&(final||F.pw2.length>=(F.pw||'').length)&&F.pw2!==F.pw))}

const OTP={left:0,t:null,start(){this.left=30;clearInterval(this.t);this.t=setInterval(()=>{this.left--;const r=$('#otpResend');if(r)r.innerHTML=otpResendHTML();if(this.left<=0)clearInterval(this.t)},1000)}};

function otpBox(ctx){return `<div class="mt16" style="position:relative" onclick="$('#otpIn').focus()"><div class="row" style="gap:8px;justify-content:space-between">${[0,1,2,3,4,5].map(i=>`<div class="otpc sora num" data-i="${i}" style="flex:1;height:58px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:26px;border:2px solid transparent"></div>`).join('')}</div>

function otpPaint(blur){const v=($('#otpIn')||{}).value||'';$$('.otpc').forEach((c,i)=>{c.textContent=v[i]||'';c.style.borderColor=!blur&&i===Math.min(v.length,5)?'var(--cobalt)':'transparent'})}
async function otpInput(el,ctx){el.value=el.value.replace(/\D/g,'').slice(0,6);$('#otpErr').textContent='';otpPaint();if(el.value.length<6)return;el.blur();$('#otpErr').innerHTML=`<span class="sec">Checking\u2026</span>`;await wait(700);
  if(ctx==='signup')signupVerified();else if(ctx==='login'){if(S.trustNext!==false)S.trusted=true;toast('Verified. Welcome back.',{icon:'check'});finishSignup()}else contactVerified()}

const COUNTRIES=[['SA','Saudi Arabia','السعودية','966','5X XXX XXXX',9,'5'],['AE','United Arab Emirates','الإمارات','971','5X XXX XXXX',9,'5'],['KW','Kuwait','الكويت','965','XXXX XXXX',8],['BH','Bahrain','البحرين','973','XXXX XXXX',8],['QA','Qatar','قطر','974','XXXX XXXX',8],['OM','Oman','عمان','968','9XXX XXXX',8],['IQ','Iraq','العراق','964','7XX XXX XXXX',10],['JO','Jordan','الأردن','962','7X XXX XXXX',9],['EG','Egypt','مصر','20','1X XXXX XXXX',10],['LB','Lebanon','لبنان','961','XX XXX XXX',8],['SY','Syria','سوريا','963','9XX XXX XXX',9],['YE','Yemen','اليمن','967','7XX XXX XXX',9],['PS','Palestine','فلسطين','970','5X XXX XXXX',9],['SD','Sudan','السودان','249','9X XXX XXXX',9],['LY','Libya','ليبيا','218','9X XXX XXXX',9],['TN','Tunisia','تونس','216','XX XXX XXX',8],['DZ','Algeria','الجزائر','213','5XX XX XX XX',9],['MA','Morocco','المغرب','212','6XX XXX XXX',9],['TR','Turkey','تركيا','90','5XX XXX XX XX',10],['PK','Pakistan','باكستان','92','3XX XXX XXXX',10],['IN','India','الهند','91','XXXXX XXXXX',10],['BD','Bangladesh','بنغلاديش','880','1XXX XXX XXX',10],['PH','Philippines','الفلبين','63','9XX XXX XXXX',10],['ID','Indonesia','إندونيسيا','62','8XX XXXX XXXX',11],['MY','Malaysia','ماليزيا','60','1X XXX XXXX',9],['GB','United Kingdom','المملكة المتحدة','44','7XXX XXX XXX',10],['US','United States','الولايات المتحدة','1','XXX XXX XXXX',10],['CA','Canada','كندا','1','XXX XXX XXXX',10],['DE','Germany','ألمانيا','49','15X XXXX XXXX',11],['FR','France','فرنسا','33','6 XX XX XX XX',9]];
const flag=iso=>String.fromCodePoint(...[...iso.toUpperCase()].map(ch=>127397+ch.charCodeAt(0)));
const ctry=iso=>COUNTRIES.find(c=>c[0]===iso)||COUNTRIES[0];
const digits=v=>String(v||'').replace(/\D/g,'').replace(/^0+/,'');
function fullPhone(iso,local){const c=ctry(iso),d=digits(local);let o='',k=0;for(const ch of c[4]){if(k>=d.length)break;o+=ch===' '?' ':d[k++]}o+=d.slice(k);return `+${c[3]} ${o.trim()}`}
function phoneError(iso,local){const c=ctry(iso),d=digits(local);if(!d)return 'Enter your phone number.';if(d.length!==c[5])return `${c[1]} numbers have ${c[5]} digits after +${c[3]}.`;if(c[6]&&!d.startsWith(c[6]))return `${c[1]} mobile numbers start with ${c[6]}.`;return ''}
function fmtLocal(iso,d){const c=ctry(iso);let o='',k=0;for(const ch of c[4]){if(k>=d.length)break;o+=ch===' '?' ':d[k++]}return (o+d.slice(k)).trim()}
const phState=t=>t==='contact'?{get cc(){return SHEET.p.cc||'SA'},set cc(v){SHEET.p.cc=v},get val(){return SHEET.p.val||''},set val(v){SHEET.p.val=v}}:{get cc(){return F.cc},set cc(v){F.cc=v},get val(){return F.phone},set val(v){F.phone=v}};
function phoneMsg(iso,val,final){const c=ctry(iso),d=digits(val);if(!d)return final?['bad','Enter your phone number.']:['','We\u2019ll send a code to check it\u2019s yours.'];
  if(c[6]&&d[0]!==c[6])return ['bad',`${c[1]} mobile numbers start with ${c[6]}.`];
  if(d.length>c[5])return ['bad',`Too many digits. ${c[1]} numbers have ${c[5]} digits after +${c[3]}.`];
  if(d.length<c[5])return final?['bad',`Too short. ${c[1]} numbers have ${c[5]} digits.`]:['',`${c[5]-d.length} more digit${c[5]-d.length>1?'s':''}`];

function shiftPlan(fromDay,start){const P=S.train.plan,mw=P[fromDay].w;if(!mw||start>6)return null;
  const later=[];for(let i=start;i<=6;i++)if(P[i].w&&i!==fromDay&&!S.train.done[DAYS[i]])later.push(i);
  const queue=[mw,...later.map(i=>P[i].w)];let slots=[...new Set([start,...later])].sort((a,b)=>a-b);
  if(P[start].w&&!later.includes(start))slots=slots;
  while(slots.length<queue.length){const last=slots[slots.length-1];let c=null;for(const g of [2,1])if(last+g<=6&&!P[last+g].w&&!slots.includes(last+g)){c=last+g;break}if(c===null)break;slots.push(c)}
  if(P[fromDay].lock||slots.some(i=>P[i].lock))return null;
  const changes=slots.map((d,k)=>[d,queue[k]]),overflow=queue.slice(slots.length);return {fromDay,changes,overflow}}
function applyShift(sh,msg){const P=S.train.plan;const before=P.map(d=>({...d}));P[sh.fromDay].w=null;sh.changes.forEach(([d])=>P[d].w=null);sh.changes.forEach(([d,w])=>P[d].w=w);refresh();toast(msg+(sh.overflow.length?` ${sh.overflow.join(', ')} moves to next week.`:''),{icon:'cal',undo:()=>{before.forEach((d,i)=>P[i]=d)}})}
function missedInfo(){if(coachLock())return null;const P=S.train.plan;for(let i=TODAY-1;i>=0;i--){if(P[i].w&&!S.train.done[DAYS[i]]&&!S.train.skipped[DAYS[i]]&&!S.train.dismiss[DAYS[i]]){const sh=shiftPlan(i,TODAY);return sh?{day:i,w:P[i].w,sh}:null}}return null}

/* ---------- wheel picker (like the iOS Clock app) + type mode ---------- */
const PICK={ck:{get:()=>S.checkin.weight,set:v=>S.checkin.weight=v},lw:{get:()=>SHEET.p.v,set:v=>SHEET.p.v=v}};
let WMODE='wheel';
function weightPicker(key){WMODE='wheel';const v=PICK[key].get();
  if(WMODE==='type')return `<div style="padding:18px 16px 8px"><div class="row" style="justify-content:center;gap:8px"><input id="wType" class="field sora num center" type="text" inputmode="decimal" enterkeyhint="done" aria-label="Weight in kg" value="${fx(v)}" style="font-size:44px;height:84px;max-width:210px;background:var(--inset)" oninput="typeWeight('${key}',this)" onfocus="this.select()"><span class="sec b" style="font-size:18px">kg</span></div><div class="err center" id="wErr" style="min-height:18px"></div></div>
   <button class="link small" style="display:block;margin:0 auto 10px" onclick="WMODE='wheel';renderSheet()">Use the wheel</button>`;
  const ints=[],decs=[];for(let i=30;i<=250;i++)ints.push(`<div data-v="${i}">${i}</div>`);for(let d=0;d<=9;d++)decs.push(`<div data-v="${d}">${d}</div>`);
  return `<div class="wheel" data-key="${key}"><div class="wband"></div><div class="wcol" data-w="i" style="width:92px;text-align:right">${ints.join('')}</div><span class="wsep">.</span><div class="wcol" data-w="d" style="width:48px">${decs.join('')}</div><span class="wunit">kg</span></div>
`}
function typeWeight(key,el){const v=parseFloat(el.value.replace(/[٫,]/g,'.').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));const ok=v>=30&&v<=250;$('#wErr').textContent=el.value&&!ok?'Enter a weight between 30 and 250 kg':'';el.classList.toggle('bad',!!el.value&&!ok);if(ok)PICK[key].set(Math.round(v*10)/10)}
function initWheels(root){const w=$('.wheel[data-key]',root);if(!w)return;const key=w.dataset.key,v=PICK[key].get();const ci=$('[data-w="i"]',w),cd=$('[data-w="d"]',w);
  const iv=Math.floor(v+1e-6),dv=Math.round((v-iv)*10)%10;
  const paint=col=>{const c=col.scrollTop+88+22;[...col.children].forEach((it,j)=>{const d=(j*44+22+88-c)/44;if(Math.abs(d)>4){it.style.transform='';return}it.style.transform=`rotateX(${-d*20}deg) scale(${1-Math.abs(d)*.06})`;it.classList.toggle('sel',Math.abs(d)<.5)})};
  const commit=()=>{const i=30+Math.round(ci.scrollTop/44),d=Math.round(cd.scrollTop/44);PICK[key].set(clamp(i,30,250)+clamp(d,0,9)/10)};
  [[ci,iv-30],[cd,dv]].forEach(([col,idx])=>{col.scrollTop=idx*44;paint(col);let t,raf;
    col.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>paint(col));clearTimeout(t);t=setTimeout(commit,90)},{passive:true});
    col.addEventListener('click',e=>{const it=e.target.closest('[data-v]');if(it)col.scrollTo({top:[...col.children].indexOf(it)*44,behavior:'smooth'})})})}
SH.checkin_after=c=>{initWheels(c);initGW(c)};

/* ---------- sleep editor: bed/wake times (AM/PM wheels), several sleeps, or just hours ---------- */
let SL=null;
function resetSL(){SL={mode:'times',periods:[{bed:'23:30',wake:'06:45'}],open:null,hours:7,mins:0}}
const pad2=n=>String(n).padStart(2,'0');
const durMin=(b,w)=>{const [bh,bm]=b.split(':').map(Number),[wh,wm]=w.split(':').map(Number);let m=(wh*60+wm)-(bh*60+bm);if(m<=0)m+=1440;return m};
const fmtDur=m=>`${Math.floor(m/60)} h${m%60?` ${m%60} min`:''}`;
const slTotal=()=>SL.mode==='hours'?SL.hours*60+SL.mins:SL.periods.reduce((a,x)=>a+durMin(x.bed,x.wake),0);
function slResult(){if(!SL)resetSL();const m=slTotal();if(SL.mode==='hours'){const w=(23*60+30+m)%1440;return {h:m/60,bed:'23:30',wake:`${pad2(Math.floor(w/60))}:${pad2(w%60)}`,periods:null}}const f=SL.periods[0];return {h:m/60,bed:f.bed,wake:f.wake,periods:SL.periods.map(x=>({...x}))}}
function paintCol(col){const c=col.scrollTop+88+22;[...col.children].forEach((it,j)=>{const d=(j*44+22+88-c)/44;if(Math.abs(d)>4){it.style.transform='';it.classList.remove('sel');return}it.style.transform=`rotateX(${-d*20}deg) scale(${1-Math.abs(d)*.06})`;it.classList.toggle('sel',Math.abs(d)<.5)})}
var GW=window.GW||{};window.GW=GW;
function gwheel(name,cols){return `<div class="wheel" data-gw="${name}"><div class="wband"></div>${cols.map((c,ci)=>`${c.sep?`<span class="wsep">${c.sep}</span>`:''}<div class="wcol" data-sel="${Math.max(0,c.items.findIndex(x=>String(x[0])===String(c.sel)))}" style="width:${c.w||64}px">${c.items.map(([v,l])=>`<div data-v="${v}">${l}</div>`).join('')}</div>${c.unit?`<span class="wunit" style="width:auto;margin:0 8px 0 4px">${c.unit}</span>`:''}`).join('')}</div>`}
function initGW(root){$$('[data-gw]',root).forEach(w=>{const name=w.dataset.gw,cols=$$('.wcol',w);
  const read=()=>cols.map(col=>col.children[clamp(Math.round(col.scrollTop/44),0,col.children.length-1)].dataset.v);
  cols.forEach(col=>{col.scrollTop=(+col.dataset.sel)*44;paintCol(col);let t,raf;
    col.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>paintCol(col));clearTimeout(t);t=setTimeout(()=>GW[name]&&GW[name](read()),90)},{passive:true});
    col.addEventListener('click',e=>{const it=e.target.closest('[data-v]');if(it)col.scrollTo({top:[...col.children].indexOf(it)*44,behavior:'smooth'})})})})}
function timeRow(label,v,id,onch,bold){return `<label class="li noic" style="position:relative;cursor:pointer"><span class="grow ${bold?'b':''}">${label}</span><b class="sora num" id="${id}" style="padding:6px 12px;border-radius:12px;background:var(--inset)">${fmtTime(v)}</b><input type="time" value="${v}" aria-label="${label}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="${onch}"></label>`}
function timeWheel(t,name='t'){const [h,m]=t.split(':').map(Number);const h12=(h%12)||12,ap=h<12?'AM':'PM',mm=Math.round(m/5)*5%60;
  return gwheel(name,[{items:Array.from({length:12},(_,i)=>[i+1,i+1]),sel:h12,w:64},{sep:':',items:Array.from({length:12},(_,i)=>[i*5,pad2(i*5)]),sel:mm,w:64},{items:[['AM','AM'],['PM','PM']],sel:ap,w:70}])}
GW.t=([h,m,ap])=>{if(!SL.open)return;let H=(+h)%12+(ap==='PM'?12:0);SL.periods[SL.open.i][SL.open.w]=`${pad2(H)}:${pad2(+m)}`;updSleepText()};
GW.h=([h,m])=>{SL.hours=+h;SL.mins=+m;updSleepText()};
function slToggle(i,w){SL.open=SL.open&&SL.open.i===i&&SL.open.w===w?null:{i,w};renderSheet()}
function slAdd(){SL.periods.push({bed:'14:00',wake:'15:00'});SL.open={i:SL.periods.length-1,w:'bed'};renderSheet()}
function slDel(i){SL.periods.splice(i,1);SL.open=null;renderSheet()}
function updSleepText(){SL.periods.forEach((x,i)=>{const b=$(`#slv_${i}_bed`),w=$(`#slv_${i}_wake`),d=$(`#sld_${i}`);b&&(b.textContent=fmtTime(x.bed));w&&(w.textContent=fmtTime(x.wake));d&&(d.textContent=fmtDur(durMin(x.bed,x.wake)))});const t=$('#slTotal');if(t)t.textContent=fmtDur(slTotal())}
function sleepEditor(multi=true){if(!SL)resetSL();const s=SL;
  const seg=`<div class="seg solid">${[['times','Bed and wake time'],['hours','Just hours']].map(([k,l])=>`<button class="${s.mode===k?'on':''}" onclick="SL.mode='${k}';SL.open=null;renderSheet()">${l}</button>`).join('')}</div>`;
  const total=`<div class="row between b" style="padding:12px 6px 0"><span>Total sleep</span><span class="sora num" id="slTotal" style="font-size:18px">${fmtDur(slTotal())}</span></div>`;
  if(s.mode==='hours')return seg+`<div class="card mt12" style="padding:10px 0">${gwheel('h',[{items:Array.from({length:17},(_,i)=>[i,i]),sel:s.hours,w:64,unit:'h'},{items:Array.from({length:12},(_,i)=>[i*5,pad2(i*5)]),sel:s.mins,w:64,unit:'min'}])}</div>`+total;
  const row=(i,w,label)=>timeRow(label,s.periods[i][w],`slv_${i}_${w}`,`SL.periods[${i}].${w}=this.value;updSleepText()`);
  return seg+s.periods.map((x,i)=>`<div class="card mt12" style="padding:6px 0"><div class="row" style="padding:8px 16px 2px;gap:8px"><b class="grow">${i?'Nap or other sleep':'Night sleep'}</b><span class="sec small b" id="sld_${i}">${fmtDur(durMin(x.bed,x.wake))}</span>${s.periods.length>1?`<button class="nb" style="width:32px;height:32px" aria-label="Remove this sleep" onclick="slDel(${i})"><span class="sec">${ic('trash',16)}</span></button>`:''}</div>${row(i,'bed','Went to sleep')}${row(i,'wake','Woke up')}</div>`).join('')
   +(multi?`<button class="btn sm soft mt12" style="width:100%" onclick="slAdd()">${ic('plus',16,2.2)}Add another sleep</button>`:'')+total}
function ckW(d){S.checkin.weight=Math.round((S.checkin.weight+d)*10)/10;renderSheet()}
function ckS(d){S.checkin.sleep=clamp(S.checkin.sleep+d,0,14);renderSheet()}
const CKS={w:false,s:false,f:false};
function finishCheckin(){const c=S.checkin;if(!CKS.w)logWeight(c.weight,true);if(!CKS.s){const sp=slResult();c.sleep=sp.h;logSleep(sp.h,c.quality,true,sp.bed,sp.wake,sp.periods)}
  S.train.light=!CKS.f&&(c.energy===0||c.sore===2);c.done=true;closeSheet();refresh();
  const sk=[CKS.w&&'weight',CKS.s&&'sleep',CKS.f&&'how you feel'].filter(Boolean);
  toast(sk.length===3?'Check-in skipped for today. See you tomorrow.':S.train.light?'Check-in saved. Today\u2019s workout is lighter.':sk.length?`Check-in saved. Skipped ${sk.join(' and ')}.`:'Check-in saved. Have a strong day.',{ai:true})}
function logWeight(v,today=true){S.food.weight=Math.round(v*10)/10;const i=S.weights.findIndex(x=>x.d==='Sep 29');if(i>=0)S.weights[i].v=v;else S.weights.push({d:'Sep 29',v});S.food.weight=Math.round(v)}
function logSleep(h,q=1,today=true,bed,wake,periods){const last=S.sleeps[S.sleeps.length-1];const e={d:'Tue*',h,q,periods,bed:bed||'23:30',wake:wake||(()=>{const m=(23*60+30+h*60)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`})()};if(last.d==='Tue*')S.sleeps[S.sleeps.length-1]=e;else S.sleeps.push(e)}

  const ws=meals.map(m=>MW[m.type||m.n]||.13),tot=ws.reduce((a,b)=>a+b,0);
  return meals.map((m,i)=>{const ty=m.type||m.n,key=(ram?'r':'')+ty+i;const all=MP[ty]||MP.Snack,tag=mealTag(),pool=all.filter(x=>x.tag===tag).length?all.filter(x=>x.tag===tag):all;const r=S.food.custom[key]||pool[(S.food.pick[key]||0)%pool.length];const k=Math.round(S.food.kcal*ws[i]/tot/10)*10;
    return {...m,key,r,k,p:Math.round(k*r.m[0]/4),c:Math.round(k*r.m[1]/4),f:Math.round(k*r.m[2]/9),logged:S.log.some(x=>x.plan===key)}})}
function scaleIng(r,k){const f=k/600;return r.ing.map(([n,a,u])=>{let v=a*f;v=(u==='g'||u==='ml')?Math.round(v/5)*5:Math.max(1,Math.round(v*2)/2);return [n,v,u]})}

function foodLoggedHTML(){const meals=planMeals();return `<div class="row between" style="margin:16px 4px 10px"><span class="sec small b">${S.log.length?`${S.log.length} item${S.log.length>1?'s':''}, ${fmt(eaten().k)} kcal`:'What you ate today'}</span></div>${S.log.length?`<div class="list">${S.log.map(x=>`<div class="li"><span class="grow"><span class="b" style="display:block">${esc(x.n)}</span><span class="sec small">${x.m}, ${fmtTime(x.t)}</span>${x.sugar||x.fatHigh?`<div class="row gap4 mt4">${x.sugar?`<span class="warnchip">${ic('warn',13,2.2)}High added sugar</span>`:''}${x.fatHigh?`<span class="warnchip">${ic('warn',13,2.2)}High fat</span>`:''}</div>`:''}</span><b class="num">${fmt(x.k)}</b><button class="nb" style="width:36px;height:36px" aria-label="Delete ${esc(x.n)}" onclick="delFood(${x.id})"><span class="sec">${ic('trash',18)}</span></button></div>`).join('')}</div>`:`<div class="card empty"><span class="sec">${ic('food',30)}</span><div class="h3 mt8">Nothing logged yet</div><p class="sec small mt4 mb12">Log your first meal. Type it, scan it, or pick from the plan.</p><button class="btn sm soft" style="margin:0 auto;background:var(--inset)" onclick="S.foodTab=1;refresh()">See today\u2019s meal plan</button></div>`}`}

function evenSplit(amt,days){const base=Math.floor(amt/days.length/10)*10,r={};days.forEach(d=>r[d]=base);r[days[0]]+=amt-base*days.length;return r}
function balAlloc(p){return p.mode==='tomorrow'?{[WEEKLEFT[0]]:p.amt}:p.split==='even'?evenSplit(p.amt,p.days):p.custom}

function balDay(d){const p=SHEET.p;if(p.days.includes(d)){if(p.days.length===1){toast('Pick at least one day',{icon:'info'});return}p.days=p.days.filter(x=>x!==d)}else p.days=WEEKLEFT.filter(x=>x===d||p.days.includes(x));p.custom=evenSplit(p.amt,p.days);renderSheet()}

function movedCard(){if(!S.food.moved.length)return '';const days=WEEKLEFT.filter(d=>S.food.moved.some(m=>m.d===d));return `<div class="card"><div class="row between"><b>Adjusted goals this week</b><button class="link small" onclick="const o=S.food.moved;S.food.moved=[];refresh();toast('Goals reset',{icon:'cal',undo:()=>{S.food.moved=o}})">Reset</button></div><div class="row mt12" style="gap:8px;flex-wrap:wrap">${days.map(d=>{const diff=dayGoal(d)-S.food.kcal;return `<div class="inset" style="padding:10px 12px;min-width:84px"><div class="sec xs b">${d}</div><div class="sora num">${fmt(dayGoal(d))}</div><div class="xs b ${diff>0?'cob':'sec'}">${diff>0?'+':'\u2212'}${fmt(Math.abs(diff))}</div></div>`}).join('')}</div></div>`}

      <div class="grid2 mt8">${[['s','Start'],['e','End']].map(([k,l])=>`<label style="position:relative;display:block;cursor:pointer"><span class="sec xs b">${l}</span><span class="inset" style="display:flex;align-items:center;justify-content:center;height:46px;margin-top:4px;padding:0"><b class="sora num">${fmtTime(w[k])}</b></span><input type="time" aria-label="${l} of work time ${i+1}" value="${w[k]}" style="position:absolute;left:0;right:0;bottom:0;height:46px;opacity:0;width:100%;cursor:pointer" onchange="setWork(${i},'${k}',this.value)"></label>`).join('')}</div></div>`).join('')}
    ${f.work.length<4?`<button class="btn sm soft mt12" style="width:100%" onclick="addWork()">${ic('plus',16,2.2)}Add another work time</button>`:''}

    <div class="card row mt12"><span class="cob">${ic('sun')}</span><span class="grow b">I work in the sun</span>${tgl(f.sun,'S.food.sun=!S.food.sun;refresh()')}</div><div class="mt24"><button class="btn" onclick="S.food.noWork=false;syncWork();P().step++;refresh();topEl().querySelector('.scroll').scrollTop=0">Next</button></div>
    <button class="link small" style="display:block;margin:14px auto 0;color:var(--sec)" onclick="skipWork()">Skip, I don\u2019t work</button>`}
  return `${hdr}<div class="h1 mt4">Anything else about your day?</div><div class="card row mt16" style="align-items:flex-start">${mark(22,'var(--cobalt)',4.5)}<span class="small b">The more details you add about your day and work, the more accurately the AI can help you.</span></div>
   <textarea class="field" rows="5" placeholder="For example: I work in the sun, carry heavy loads, and walk long distances." oninput="S.food.notes=this.value">${esc(f.notes)}</textarea><div class="sec small mt8">Optional</div>${next('Calculate my plan')}`}});

function syncWork(){const f=S.food,w=f.work;f.workStart=w[0].s;f.workEnd=w[w.length-1].e;f.schedule=w.length>1?(f.rotate?2:1):0}

function delWork(i){const w=S.food.work,it=w[i];w.splice(i,1);if(w.length<2)S.food.rotate=false;syncWork();refresh();toast('Work time removed',{icon:'trash',undo:()=>{w.splice(i,0,it);syncWork()}})}
function fwParse(v){return parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.'))}

function fwStep(d){S.food.weight=Math.round(clamp(S.food.weight+d,30,250)*10)/10;const i=$('#fwIn');if(i)i.value=fx(S.food.weight)}
function skipWork(){S.food.noWork=true;S.food.sun=false;P().step++;refresh();topEl().querySelector('.scroll').scrollTop=0;toast('No problem. Meals are timed around a normal day.',{icon:'clock'})}
async function runSetup(){const p=P();p.step=5;refresh();for(const m of ['Reading your answers','Working out your calories','Timing your meals around work']){p.msg=m;refresh();await wait(750)}calcPlan();if(NAV[NAV.length-1].id==='food'){p.step=0;go('foodresults',{fresh:true})}else replace('foodresults',{fresh:true})}

   <div class="pks"><div class="tr"></div><div class="band" style="left:${pkPos(1.6)};width:calc((100% - 28px) * ${(2.2-1.6)/(3.5-1.2)})"></div><div class="tick" style="left:${pkPos(1.6)}"></div><div class="tick" style="left:${pkPos(2.2)}"></div>
     <input type="range" min="1.2" max="3.5" step="0.01" value="${f.perKg}" aria-label="Protein grams per kg" oninput="pkSlide(this)" onchange="refresh()">
     <span class="lab" style="left:${pkPos(1.6)}">1.6</span><span class="lab" style="left:${pkPos(2.2)}">2.2</span></div>

   <div id="pkWarn">${pkWarn(f.perKg)}</div>`:`<div class="sec small mt4">${fx(f.perKg)} g for each kg of body weight</div>`}</div>

   <div class="grid3 mt12">${[['Protein',t.p,4],['Carbs',t.c,4],['Fat',t.f,9]].map(([a,g,m])=>`<button class="inset center" style="padding:12px 6px" onclick="openMacros()"><div class="sec xs b">${a}</div><div class="sora num mt4" style="font-size:20px">${g} g</div><div class="xs sec b">${Math.round(g*m*100/t.k)}%</div></button>`).join('')}</div>
   <div class="sec xs mt8">Protein ${t.p*4} + carbs ${t.c*4} + fat ${t.f*9} = ${fmt(t.k)} kcal</div></div>
