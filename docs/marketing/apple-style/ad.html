<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Sora,sans-serif}
.abs{position:absolute}
.word{font-weight:800;letter-spacing:-6px;line-height:1;color:#1d1d1f;will-change:transform,opacity,filter}
.sub{font-weight:600;font-size:40px;line-height:1.3;letter-spacing:-0.6px;color:#6e6e73;width:640px}
.phone{position:absolute;width:440px;height:952px;border-radius:72px;background:#0B0B0D;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.28),inset 0 0 0 3px #2c2c30;transform-style:preserve-3d}
.screen{position:relative;width:100%;height:100%;border-radius:57px;overflow:hidden;background:#fff}
.status{position:absolute;top:0;left:0;right:0;height:52px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 40px 0;font:600 18px Inter;color:#111;z-index:2}
.island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:120px;height:36px;border-radius:20px;background:#000;z-index:3}
.screen img{position:absolute;top:52px;left:0;width:100%}
.chip{position:absolute;padding:20px 28px;border-radius:28px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);box-shadow:0 20px 50px rgba(0,0,0,.14);font:700 28px Sora;color:#1d1d1f;white-space:nowrap;display:flex;gap:14px;align-items:center}
.chip b{color:#3355FF}
.dot{width:14px;height:14px;border-radius:50%;background:#3355FF;box-shadow:0 0 16px #3355FF}
.center{left:0;right:0;text-align:center}
</style></head><body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0;background:#000"></div>
  <div id="glow" class="abs" style="inset:0;background:radial-gradient(circle at 50% 55%,rgba(51,85,255,.35),rgba(0,0,0,0) 55%);opacity:0"></div>
  <div id="intro" class="abs center" style="top:470px;font:700 92px Sora;color:#fff;letter-spacing:-3px"></div>

  <div id="words"></div>
  <div id="p3d" class="abs" style="inset:0;perspective:2400px">
    <div id="phone" class="phone" style="left:1150px;top:64px">
      <div class="screen"><div class="status"><span>9:41</span><span>●●●</span></div><div class="island"></div>
        <img id="s_active" src="img/en_active.png"><img id="s_food" src="img/en_food.png"><img id="s_recovery" src="img/en_recovery.png"><img id="s_coach" src="img/en_coach.png">
      </div>
    </div>
    <div id="fan"></div>
  </div>
  <div id="chips"></div>
  <div id="mont" class="abs center" style="top:400px;font:800 210px Sora;letter-spacing:-9px;color:#fff"></div>
  <div id="end" class="abs" style="inset:0;opacity:0">
    <svg id="logo" class="abs" viewBox="30 -745 2229 775" style="left:610px;top:380px;width:700px;height:243px">
      <path id="letters" d="M408 0V-161H385V-340Q385 -387 362 -410Q339 -433 291 -433Q266 -433 231 -432Q196 -431 160 -430Q125 -428 97 -426V-544Q120 -546 149 -548Q178 -550 208 -550Q239 -551 266 -551Q350 -551 406 -529Q461 -507 490 -460Q518 -413 518 -337V0ZM233 14Q174 14 130 -7Q85 -28 60 -67Q36 -106 36 -161Q36 -221 66 -259Q95 -297 148 -316Q202 -335 274 -335H400V-252H272Q224 -252 198 -228Q173 -205 173 -168Q173 -131 198 -108Q224 -85 272 -85Q301 -85 326 -96Q350 -106 366 -132Q383 -157 385 -201L419 -162Q414 -105 392 -66Q369 -27 330 -6Q290 14 233 14ZM847 18Q790 18 742 -3Q694 -24 659 -62Q624 -100 605 -150Q586 -201 586 -260V-281Q586 -339 604 -390Q623 -441 656 -479Q690 -517 738 -538Q785 -560 843 -560Q907 -560 956 -532Q1004 -505 1033 -450Q1062 -395 1065 -312L1024 -360V-730H1163V0H1053V-231H1077Q1074 -148 1043 -92Q1012 -37 962 -10Q911 18 847 18ZM878 -99Q919 -99 953 -118Q987 -136 1008 -172Q1028 -207 1028 -255V-295Q1028 -343 1007 -376Q986 -408 952 -426Q918 -443 878 -443Q833 -443 798 -422Q764 -400 744 -361Q725 -322 725 -270Q725 -218 745 -180Q765 -141 800 -120Q834 -99 878 -99ZM1276 0V-543H1386V-313H1383Q1383 -430 1433 -490Q1483 -550 1580 -550H1600V-429H1562Q1492 -429 1454 -392Q1415 -354 1415 -283V0Z" fill="#1d1d1f"/>
      <circle id="ring" cx="1953.5" cy="-271.5" r="228.5" fill="none" stroke="#3355FF" stroke-width="130" stroke-linecap="round" transform="rotate(-90 1953.5 -271.5)"/>
    </svg>
    <div id="tag" class="abs center" style="top:690px;font:700 52px Sora;letter-spacing:-1.5px;color:#1d1d1f">Your AI fitness coach.</div>
    <div id="soon" class="abs center" style="top:775px;font:600 34px Sora;color:#6e6e73">Coming soon to the App Store.</div>
  </div>
  <div id="fadeblack" class="abs" style="inset:0;background:#000;opacity:0;pointer-events:none"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=(x)=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=(x)=>1-Math.pow(1-clamp(x),4);
const lerp=(a,b,u)=>a+(b-a)*u;
const fade=(t,a,b,c,d)=>clamp((t-a)/(b-a))*(1-clamp((t-c)/(d-c)));
const $=(id)=>document.getElementById(id);

// scenes on a 120 bpm grid (one bar = 2 s)
const SCENES=[
  {k:'active',w:'Train.',sub:'It reads every set and tells you when to go heavier.',s:2,e:6,chip:['+2.5 kg','next set'],cx:860,cy:210},
  {k:'food',w:'Eat.',sub:'Calories and macros from the food you actually eat.',s:6,e:10,chip:['1,050 kcal','left today'],cx:880,cy:640},
  {k:'recovery',w:'Recover.',sub:'Sleep, soreness and your watch set today’s effort.',s:10,e:14,chip:['85%','recovered'],cx:860,cy:260},
  {k:'coach',w:'Ask.',sub:'An AI coach that knows your day. In English and Arabic.',s:14,e:18,chip:['Answers','in seconds'],cx:870,cy:700},
];
// build scene words, subs and chips
for(const [i,sc] of SCENES.entries()){
  const w=document.createElement('div');w.className='abs word';w.id='w'+i;w.style.cssText='left:170px;top:300px;font-size:210px';w.textContent=sc.w;$('words').appendChild(w);
  const s=document.createElement('div');s.className='abs sub';s.id='u'+i;s.style.cssText='left:178px;top:560px';s.textContent=sc.sub;$('words').appendChild(s);
  const c=document.createElement('div');c.className='chip';c.id='c'+i;c.innerHTML='<span class="dot"></span><b>'+sc.chip[0]+'</b>'+sc.chip[1];c.style.left=sc.cx+'px';c.style.top=sc.cy+'px';$('chips').appendChild(c);
}
// three phones for "everything"
for(const [i,k] of ['home','progress','food'].entries()){
  const p=document.createElement('div');p.className='phone';p.id='f'+i;p.style.cssText='left:740px;top:64px';
  p.innerHTML='<div class="screen"><div class="status"><span>9:41</span><span>●●●</span></div><div class="island"></div><img src="img/en_'+k+'.png" style="opacity:1"></div>';
  $('fan').appendChild(p);
}
const INTRO=['Meet','your','new','coach.'];
const MONT=[['Smarter.',22.0],['Stronger.',22.667],['Yours.',23.333]];
const RC=2*Math.PI*228.5;

window.render=function(t){
  // background: black intro, white scenes, black "everything" and montage, white end
  const white = (t>=2&&t<18)||t>=24;
  $('bg').style.background= white?'#F5F5F7':'#000';
  $('glow').style.opacity = (t>=18&&t<24)? fade(t,18,18.6,23.6,24):0;
  // intro, word by word
  $('intro').innerHTML = INTRO.map((w,i)=>{const a=fade(t,0.25+i*0.28,0.6+i*0.28,1.75,1.98);const u=out((t-0.25-i*0.28)/0.5);return '<span style="display:inline-block;margin:0 14px;opacity:'+a+';transform:translateY('+(1-u)*40+'px);filter:blur('+(1-u)*8+'px)'+(i===3?';color:#8FA3FF':'')+'">'+w+'</span>'}).join('');
  // the scenes
  let phoneOn=0;
  SCENES.forEach((sc,i)=>{
    const a=fade(t,sc.s,sc.s+0.3,sc.e-0.25,sc.e);
    const u=out((t-sc.s)/0.6);
    const w=$('w'+i); w.style.opacity=a; w.style.transform='translateY('+(1-u)*60+'px) scale('+(1.06-0.06*u)+')'; w.style.filter='blur('+(1-u)*14+'px)';
    const s=$('u'+i), u2=out((t-sc.s-0.35)/0.6); s.style.opacity=fade(t,sc.s+0.35,sc.s+0.75,sc.e-0.25,sc.e); s.style.transform='translateY('+(1-u2)*30+'px)';
    const c=$('c'+i), u3=out((t-sc.s-0.9)/0.5); c.style.opacity=fade(t,sc.s+0.9,sc.s+1.2,sc.e-0.3,sc.e); c.style.transform='translateY('+(Math.sin((t-sc.s)*1.6)*8+(1-u3)*30)+'px) scale('+(0.9+0.1*u3)+')';
    $('s_'+sc.k).style.opacity = t<sc.s? 0 : (i===0?1:clamp((t-sc.s)/0.35));
    if(t>=sc.s&&t<sc.e) phoneOn=1;
  });
  // the phone: turns in, floats, tilts a little each scene, leaves at the end
  const ph=$('phone');
  if(t<2||t>=18.4){ph.style.opacity=0;}
  else{
    const enter=ease((t-2)/0.9), leave=ease((t-17.6)/0.8);
    const k=Math.floor((t-2)/4), local=(t-2)%4, kick=ease(local/0.7);
    const ry=lerp(-38,-14,enter)+ (k%2?6:-6)*kick + leave*30;
    const rx=4*Math.sin(t*0.8);
    const tx=lerp(500,0,enter)+leave*600, ty=12*Math.sin(t*1.3);
    ph.style.opacity=1; ph.style.transform='translate('+tx+'px,'+ty+'px) rotateY('+ry+'deg) rotateX('+rx+'deg)';
  }
  // everything: three phones fan out on black
  ['f0','f1','f2'].forEach((id,i)=>{
    const el=$(id); const u=ease((t-18.2-i*0.12)/1.0), lv=ease((t-21.6)/0.5);
    if(t<18||t>=22.2){el.style.opacity=0;return;}
    const dx=[-520,0,520][i]*u, ry=[28,0,-28][i]*u, sc=[0.86,1,0.86][i];
    el.style.opacity=clamp((t-18.2-i*0.12)/0.3)*(1-lv);
    el.style.zIndex=i===1?3:1;
    el.style.transform='translate('+(dx*0.85)+'px,'+(-70+(1-u)*120+Math.sin(t*1.2+i)*10)+'px) rotateY('+ry+'deg) scale('+(0.8*sc*(0.9+0.1*u))+')';
  });
  // "Everything. In one place." on black
  const ev = fade(t,19.2,19.6,21.6,21.9);
  $('mont').style.fontSize = (t<22?96:210)+'px';
  $('mont').style.letterSpacing = (t<22?-3:-9)+'px';
  $('mont').style.top = (t<22?950:420)+'px';
  if(t>=19&&t<22){$('mont').style.opacity=ev;$('mont').innerHTML='Everything. <span style="color:#8FA3FF">In one place.</span>';$('mont').style.transform='translateY('+(1-out((t-19.2)/0.5))*30+'px)';}
  else if(t>=22&&t<24){ let cur=MONT[0]; for(const m of MONT) if(t>=m[1]) cur=m; const u=out((t-cur[1])/0.25); $('mont').innerHTML=cur[0]; $('mont').style.opacity=1; $('mont').style.color= cur[0]==='Yours.'?'#8FA3FF':'#fff'; $('mont').style.transform='scale('+(1.25-0.25*u)+')'; $('mont').style.filter='blur('+(1-u)*10+'px)';}
  else { $('mont').style.opacity=0; }
  if(t<22){$('mont').style.color='#fff';$('mont').style.filter='none';}
  // the end: the ring draws itself, the letters arrive, then the words
  const ea=clamp((t-24)/0.3); $('end').style.opacity=ea;
  const rd=ease((t-24.1)/1.1); $('ring').setAttribute('stroke-dasharray', (RC*0.8*rd)+' '+RC);
  const la=out((t-24.7)/0.8); $('letters').style.opacity=la; $('letters').style.transform='translateX('+(-(1-la)*120)+'px)';
  const sw=1+0.0*Math.sin(t); $('logo').style.transform='scale('+(1.04-0.04*ease((t-24)/2))+')';
  $('tag').style.opacity=fade(t,25.6,26.1,99,100); $('tag').style.transform='translateY('+(1-out((t-25.6)/0.5))*24+'px)';
  $('soon').style.opacity=fade(t,26.2,26.7,99,100);
  $('fadeblack').style.opacity=Math.max(clamp((t-29.3)/0.7), 0);
};
window.ready=(async()=>{await document.fonts.load('800 100px Sora');await document.fonts.load('600 40px Sora');await document.fonts.load('600 18px Inter');await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));window.render(3);return true;})();
</script></body></html>
