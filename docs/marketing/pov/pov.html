<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0b; }
  #shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: saturate(0.35) contrast(1.18) brightness(0.92) hue-rotate(-8deg); }
  #tint { position: absolute; inset: 0; background: rgba(40, 70, 140, 0.10); mix-blend-mode: soft-light; }
  #grain { position: absolute; inset: 0; opacity: 0.13; mix-blend-mode: overlay; }
  #vig { position: absolute; inset: 0; background: radial-gradient(75% 60% at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%); }
  #black { position: absolute; inset: 0; background: #0a0a0b; opacity: 0; z-index: 1; }
  .card { z-index: 3; position: absolute; left: 50%; transform: translateX(-50%); padding: 26px 44px; border-radius: 34px; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.22); backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px); color: #fff; font-family: Sora, sans-serif; font-weight: 600; font-size: 54px; letter-spacing: -0.5px; white-space: nowrap; display: flex; align-items: center; gap: 18px; opacity: 0; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .card .small { font-weight: 400; font-size: 40px; color: rgba(255,255,255,.75); }
  .dn { color: #34d27b; font-size: 52px; }
  #logo { position: absolute; inset: 0; z-index: 4; }
  .line { z-index: 4; position: absolute; left: 0; right: 0; text-align: center; color: #fff; opacity: 0; }
</style>
</head>
<body>
  <img id="shot" />
  <div id="tint"></div>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" /><feColorMatrix type="saturate" values="0" /></filter><rect width="1080" height="1920" filter="url(#n)" /></svg>
  <div id="vig"></div>

  <div class="card" id="c1" style="top:1440px">Good morning.</div>
  <div class="card" id="c2" style="top:1440px"><span class="dn">▼</span>−0.4 kg</div>
  <div class="card" id="c3" style="top:1440px">41 g protein <span class="small">· 18 g left</span></div>
  <div class="card" id="c4" style="top:1400px">80 kg → 82.5 kg</div>
  <div class="card" id="c4b" style="top:1540px;font-weight:400;font-size:44px">You've got this.</div>
  <div class="card" id="c5" style="top:1440px">Recovery 82%</div>

  <div id="black"></div>
  <svg id="logo" width="1080" height="1920">
    <g id="letters" opacity="0"></g>
    <circle id="ring" fill="none" stroke="#3355FF" stroke-linecap="round" style="filter:drop-shadow(0 0 22px rgba(51,85,255,.75))" />
    <circle id="dot" r="0" fill="#3355FF" style="filter:drop-shadow(0 0 18px rgba(51,85,255,.9))" />
  </svg>
  <div class="line" id="l1" style="top:1080px;font-family:Sora;font-weight:400;font-size:44px;color:rgba(255,255,255,.8)">Your AI gym coach</div>
  <div class="line" id="l2" style="top:1150px;font-family:Sora;font-weight:600;font-size:40px;letter-spacing:12px;color:#6f86ff">COMING SOON</div>
  <div class="line" id="l3" dir="rtl" style="top:1290px;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:50px">يشوف يومك كله… ويدرّبك عليه.</div>

<script src="letters.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);

// The adro wordmark (src/components/wordmark.ts): letters in font units, ring as the o.
const WM = { x0: 30, y0: -745, w: 2229, h: 775, ring: { cx: 1953.5, cy: -271.5, r: 228.5, stroke: 130 } };
const S = 760 / WM.w;                          // wordmark 760 px wide
const L = (1080 - WM.w * S) / 2, T = 880 - WM.h * S; // baseline area above the lines
$('letters').innerHTML = `<path transform="translate(${L - WM.x0 * S} ${T - WM.y0 * S}) scale(${S})" fill="#ffffff" d="${window.LETTERS}"/>`;
const end = { x: L + (WM.ring.cx - WM.x0) * S, y: T + (WM.ring.cy - WM.y0) * S, r: WM.ring.r * S, sw: WM.ring.stroke * S };
const mid = { x: 540, y: 820, r: 170, sw: 96 };

// Overlay card: fade in + 10 px rise, then out at the cut.
const card = (id, t, a, b) => {
  const k = Math.min(clamp((t - a) / 0.35), clamp((b - t) / 0.2));
  $(id).style.opacity = k;
  $(id).style.marginTop = `${(1 - out((t - a) / 0.4)) * 10}px`;
};

window.render = (t, frame) => {
  if (frame) $('shot').src = frame;
  $('shot').style.opacity = t < 15 ? 1 : 0;
  $('turb').setAttribute('seed', String(Math.floor(t * 24) % 97));
  // Shot 5 fades to black at the end.
  $('black').style.opacity = t < 13.4 ? 0 : t < 15 ? clamp((t - 13.4) / 1.4) : 1;

  card('c1', t, 0.6, 2.95);
  card('c2', t, 3.6, 5.95);
  card('c3', t, 6.6, 8.95);
  card('c4', t, 9.5, 11.95);
  card('c4b', t, 10.2, 11.95);
  card('c5', t, 12.5, 14.6);

  // 15.0–15.7: the five cards come back for a moment and collapse into one blue dot.
  const ids = ['c1', 'c2', 'c3', 'c4', 'c5'];
  if (t >= 14.95 && t < 15.8) {
    const k = ease((t - 15.05) / 0.6);
    ids.forEach((id, i) => {
      const el = $(id);
      const y0 = 640 + i * 150;
      el.style.top = `${y0 + (790 - y0) * k}px`;
      el.style.marginTop = '0px';
      el.style.opacity = clamp((t - 14.95) / 0.12) * (1 - k);
      el.style.transform = `translateX(-50%) scale(${1 - 0.92 * k})`;
    });
    $('c4b').style.opacity = 0;
  } else if (t >= 15.8) ids.forEach((id) => ($(id).style.opacity = 0));

  // Dot → open ring (never closes, never rotates) → slides into the o of adro.
  const dotK = clamp((t - 15.45) / 0.25) * (1 - clamp((t - 15.75) / 0.15));
  $('dot').setAttribute('cx', 540); $('dot').setAttribute('cy', 820); $('dot').setAttribute('r', 22 * dotK);
  const draw = ease((t - 15.7) / 0.8);
  const slide = ease((t - 16.7) / 0.7);
  const x = mid.x + (end.x - mid.x) * slide, y = mid.y + (end.y - mid.y) * slide;
  const r = mid.r + (end.r - mid.r) * slide, sw = mid.sw + (end.sw - mid.sw) * slide;
  const C = 2 * Math.PI * r;
  const ring = $('ring');
  ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', r); ring.setAttribute('stroke-width', sw);
  ring.setAttribute('transform', `rotate(-90 ${x} ${y})`);
  ring.style.strokeDasharray = `${C * 0.8 * draw} ${C}`;
  ring.style.opacity = t >= 15.7 ? 1 : 0;
  $('letters').setAttribute('opacity', clamp((t - 17.1) / 0.45));
  $('l1').style.opacity = clamp((t - 17.6) / 0.4);
  $('l2').style.opacity = clamp((t - 17.9) / 0.4);
  $('l3').style.opacity = clamp((t - 18.3) / 0.45);
};
</script>
</body>
</html>
