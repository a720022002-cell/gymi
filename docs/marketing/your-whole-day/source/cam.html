<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:390px;height:844px;overflow:hidden;background:#000;font-family:Inter,sans-serif;color:#fff}
.v{position:absolute;inset:0 0 150px 0;background:url(vf.jpg) center/cover;filter:saturate(1.05) contrast(1.05)}
.top{position:absolute;top:56px;left:16px;right:16px;display:flex;justify-content:space-between}
.chip{background:rgba(0,0,0,.45);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:600}
.br{position:absolute;width:44px;height:44px;border-color:#fff;border-style:solid;opacity:.9}
.bot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#000;display:flex;align-items:center;justify-content:center}
.sh{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}.sh div{width:60px;height:60px;border-radius:50%;background:#fff}
</style></head><body><div class="v"></div>
<div class="top"><span class="chip">✕</span><span class="chip">Flash</span></div>
<div class="br" style="left:40px;top:200px;border-width:4px 0 0 4px;border-radius:14px 0 0 0"></div><div class="br" style="right:40px;top:200px;border-width:4px 4px 0 0;border-radius:0 14px 0 0"></div>
<div class="br" style="left:40px;top:600px;border-width:0 0 4px 4px;border-radius:0 0 0 14px"></div><div class="br" style="right:40px;top:600px;border-width:0 4px 4px 0;border-radius:0 0 14px 0"></div>
<div class="bot"><div class="sh"><div></div></div></div></body></html>
