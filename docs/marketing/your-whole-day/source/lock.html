<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;font-family:Inter,-apple-system,sans-serif;color:#fff;background:radial-gradient(90% 60% at 30% 20%,#3a2a1c 0%,#1a130d 45%,#07060a 100%)}
.date{text-align:center;margin-top:70px;font-size:20px;font-weight:600;opacity:.9}
.time{text-align:center;font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:2px}
.n{position:absolute;left:12px;right:12px;top:430px;border-radius:22px;background:rgba(60,55,50,.55);backdrop-filter:blur(30px);padding:12px 14px;display:flex;gap:11px}
.ic{width:38px;height:38px;border-radius:9px;background:#0a0a0b;flex:none;display:flex;align-items:center;justify-content:center}
.h{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.h span{font-weight:400;opacity:.6;font-size:13px}
.b{font-size:15px;line-height:1.3;margin-top:1px;opacity:.95}
.bot{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:space-between;padding:0 46px}
.bot div{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15)}
.bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#fff}
</style></head><body>
<div class="date">Monday, November 2</div><div class="time">5:30</div>
<div class="n"><div class="ic"><svg width="26" height="26" viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="none" stroke="#3355ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="65.3 81.7" transform="rotate(-90 20 20)"/></svg></div>
<div style="flex:1"><div class="h">Ready to train hard<span>now</span></div><div class="b">You slept 7.7 h. Your watch says you recovered well. A good day to push.</div></div></div>
<div class="bot"><div></div><div></div></div><div class="bar"></div>
</body></html>
