<script>
// The QR code on the box and in print opens adroapp.com/get. It never changes; this page decides where it goes.
// LIVE: true once Adro is on the App Store (flip it on launch day). Until then everyone lands on the website.
var LIVE = false;
var IOS = 'https://apps.apple.com/app/id6826500429';
var SITE = 'https://adroapp.com/';
var ua = navigator.userAgent || '';
var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
location.replace(LIVE && apple ? IOS : SITE);
</script></head>
